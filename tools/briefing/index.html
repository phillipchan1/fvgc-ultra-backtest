<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NQ Morning Briefing · TACTICAL</title>
<style>
  :root {
    --bg-0:      #04060c;
    --bg-1:      #080d18;
    --bg-2:      #0c1322;
    --bg-3:      #11192c;
    --bg-glass:  rgba(12, 19, 34, 0.7);
    --line:      #1c2742;
    --line-2:    #2a3a58;
    --line-soft: #15203a;
    --text:      #eaf0fa;
    --text-dim:  #8997b2;
    --text-mute: #4b5878;
    --cyan:      #5ee3f7;
    --cyan-dim:  #5ee3f71f;
    --cyan-glow: #5ee3f7;
    --green:     #4eecaf;
    --green-dim: #4eecaf1f;
    --red:       #ff5e7a;
    --red-dim:   #ff5e7a1f;
    --amber:     #ffc24d;
    --amber-dim: #ffc24d1f;
    --violet:    #b69eff;
    --violet-dim:#b69eff1f;
    --pink:      #ff7eb6;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--text); }
  body {
    font: 13px/1.5 var(--sans);
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 80% -150px, #102536 0%, transparent 55%),
      radial-gradient(900px 600px at -10% 110%, #1a1336 0%, transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(94,227,247,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,227,247,0.018) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 90%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 3px);
    opacity: 0.4;
  }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--text-dim); }
  .mute { color: var(--text-mute); }

  /* ===== Layout ===== */
  .wrap { max-width: 1480px; margin: 0 auto; padding: 18px 22px 60px; position: relative; z-index: 1; }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1.45fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-6 { grid-template-columns: repeat(6, 1fr); }
  @media (max-width: 1180px) {
    .grid-2 { grid-template-columns: 1fr; }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 0 14px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 16px;
  }
  .brand {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: 3px; color: var(--text);
  }
  .brand .accent { color: var(--cyan); }
  .brand::before {
    content: "◤"; color: var(--cyan); margin-right: 6px;
    text-shadow: 0 0 8px var(--cyan-glow);
  }
  .topbar .spacer { flex: 1; }
  .meta-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim);
  }
  .meta-tag b { color: var(--text); font-weight: 600; }
  .pulse {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px;
    border-radius: 2px;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: var(--mono); font-size: 9px;
    text-transform: uppercase; letter-spacing: 2px;
    background: var(--green-dim);
  }
  .pulse.demo { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
  .pulse.offline { border-color: var(--text-mute); color: var(--text-mute); background: transparent; }
  .pulse::before {
    content: ""; width: 6px; height: 6px;
    border-radius: 50%; background: currentColor;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
    50% { opacity: 0.5; box-shadow: 0 0 0 6px transparent; }
  }

  /* ===== PRIMARY READ HERO ===== */
  .primary {
    position: relative;
    padding: 22px 26px;
    background:
      linear-gradient(135deg, rgba(94,227,247,0.06) 0%, transparent 55%),
      linear-gradient(180deg, #0e1830 0%, #08101d 100%);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .primary.go     { box-shadow: inset 0 0 0 1px var(--cyan-dim), 0 0 40px -10px var(--cyan-glow); border-color: var(--cyan); }
  .primary.wait   { box-shadow: inset 0 0 0 1px var(--amber-dim); }
  .primary.stand  { box-shadow: inset 0 0 0 1px var(--red-dim); border-color: #4a2434; }
  /* HUD corner brackets */
  .corner {
    position: absolute; width: 16px; height: 16px;
    border-color: var(--cyan); border-style: solid; border-width: 0;
    box-shadow: 0 0 8px var(--cyan-glow);
  }
  .primary.stand .corner { border-color: var(--red); box-shadow: 0 0 8px var(--red); }
  .primary.wait  .corner { border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .corner.tl { top: 8px; left: 8px;   border-top-width: 2px;  border-left-width: 2px; }
  .corner.tr { top: 8px; right: 8px;  border-top-width: 2px;  border-right-width: 2px; }
  .corner.bl { bottom: 8px; left: 8px;border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 8px; right: 8px;border-bottom-width: 2px;border-right-width: 2px; }
  /* scan line */
  .primary::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.4;
  }
  .primary-grid {
    display: grid;
    grid-template-columns: minmax(280px, 1.2fr) minmax(280px, 1.4fr) minmax(220px, 1fr);
    gap: 28px;
    align-items: stretch;
  }
  @media (max-width: 1100px) { .primary-grid { grid-template-columns: 1fr; gap: 18px; } }

  .pr-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
    color: var(--text-mute); font-weight: 700; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .pr-label::before { content: "▶ "; color: var(--cyan); }

  .pr-action {
    font-family: var(--mono); font-size: 32px; font-weight: 700; line-height: 1.05;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--text), #b5d3e0);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .primary.go .pr-action { background: linear-gradient(180deg, var(--cyan), #34a5b8); -webkit-background-clip: text; background-clip: text; }
  .primary.stand .pr-action { background: linear-gradient(180deg, var(--red), #b03c4e); -webkit-background-clip: text; background-clip: text; }
  .primary.wait .pr-action { background: linear-gradient(180deg, var(--amber), #b8851c); -webkit-background-clip: text; background-clip: text; }
  .pr-window {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-top: 4px; letter-spacing: 1px;
  }
  .pr-summary { font-size: 13px; color: var(--text-dim); margin-top: 14px; line-height: 1.65; }
  .pr-summary b { color: var(--text); font-weight: 600; }

  .pr-trigger { padding-left: 6px; }
  .pr-trig-row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 12px;
  }
  .pr-trig-row:last-child { border-bottom: 0; }
  .pr-trig-row .when {
    font-family: var(--mono); font-size: 10px;
    color: var(--cyan); background: var(--cyan-dim);
    padding: 2px 6px; border-radius: 2px; min-width: 44px; text-align: center;
  }
  .pr-trig-row .desc { color: var(--text); flex: 1; }
  .pr-trig-row .lift {
    font-family: var(--mono); font-size: 10px; color: var(--green); font-weight: 600;
  }

  .pr-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: 10px;
  }
  .pr-meta-tile {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
  }
  .pr-meta-tile .l {
    font-size: 8px; letter-spacing: 1.5px; color: var(--text-mute);
    font-family: var(--mono); font-weight: 600;
  }
  .pr-meta-tile .v {
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    color: var(--text); margin-top: 2px;
  }
  .pr-meta-tile.good .v { color: var(--green); }
  .pr-meta-tile.warn .v { color: var(--amber); }
  .pr-meta-tile.bad  .v { color: var(--red); }
  .pr-meta-tile.cool .v { color: var(--cyan); }

  /* ===== KPI strip ===== */
  .kpi {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
  }
  .kpi::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 2px;
    background: var(--line-2);
  }
  .kpi .k-l {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-mute); margin-bottom: 5px;
    font-family: var(--mono); font-weight: 700;
  }
  .kpi .k-v {
    font-family: var(--mono); font-size: 18px; font-weight: 700; line-height: 1.05;
    color: var(--text);
  }
  .kpi .k-s {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .kpi.up   { background: linear-gradient(135deg, var(--green-dim), var(--bg-1) 60%); }
  .kpi.up::before   { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .kpi.up .k-v   { color: var(--green); }
  .kpi.down { background: linear-gradient(135deg, var(--red-dim), var(--bg-1) 60%); }
  .kpi.down::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .kpi.down .k-v { color: var(--red); }
  .kpi.warn { background: linear-gradient(135deg, var(--amber-dim), var(--bg-1) 60%); }
  .kpi.warn::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .kpi.warn .k-v { color: var(--amber); }
  .kpi.cool::before { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  /* ===== Section header ===== */
  .section-h {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text-dim); font-weight: 700;
    margin: 22px 0 10px;
  }
  .section-h::before {
    content: ""; width: 12px; height: 1px; background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan); flex-shrink: 0;
  }
  .section-h::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line) 0%, transparent 80%);
  }
  .section-h .count {
    font-family: var(--mono); color: var(--cyan);
    padding: 2px 7px; background: var(--cyan-dim);
    border-radius: 2px; letter-spacing: 1.5px; font-size: 10px;
  }

  /* ===== Card ===== */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    position: relative;
  }
  .card.dense { padding: 10px 12px; }
  .card-h {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
  }
  .card-t {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text-dim); font-weight: 700;
  }
  .card-t::before { content: "▌ "; color: var(--cyan); }

  /* ===== Narrative callout ===== */
  .narrative {
    margin-top: 12px;
    padding: 10px 12px;
    background: linear-gradient(90deg, var(--violet-dim), transparent 80%);
    border-left: 2px solid var(--violet);
    border-radius: 0 3px 3px 0;
    font-size: 12px;
    color: #d5cbf3;
    line-height: 1.6;
  }
  .narrative::before {
    content: "AI"; display: inline-block;
    font-size: 8px; font-family: var(--mono); font-weight: 700;
    letter-spacing: 1.5px; color: var(--violet);
    padding: 1px 5px; border: 1px solid var(--violet);
    border-radius: 2px; margin-right: 8px;
    vertical-align: middle;
  }
  .narrative b { color: var(--violet); font-weight: 600; }
  .narrative-empty {
    margin-top: 10px; padding: 6px 10px;
    border-left: 2px dashed var(--line-2);
    color: var(--text-mute); font-size: 10px; font-style: italic; letter-spacing: 0.3px;
  }

  /* ===== Chips ===== */
  .chip {
    display: inline-flex; align-items: center;
    padding: 3px 8px;
    border-radius: 2px;
    font-size: 10px; line-height: 1.4;
    margin: 2px 3px 2px 0;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text-dim);
    font-family: var(--mono);
    white-space: nowrap;
    letter-spacing: 0.4px;
  }
  .chip.on  { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .chip.off { background: var(--bg-2); border-color: var(--line); color: var(--text-mute); }
  .chip.unk { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .chip.veto{ background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .chip.dim { color: var(--text-dim); }

  /* ===== Matrix play card ===== */
  .play {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .play + .play { margin-top: 10px; }
  .play.active {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 28px -10px var(--cyan-glow);
  }
  .play.veto {
    border-color: #4a1f2b;
    background: linear-gradient(180deg, #170c14, var(--bg-1));
  }
  .play::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: var(--line-2);
  }
  .play.veto::before { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .play.active::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .play.skip::before { background: var(--text-mute); }

  .play-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .play-id { display: flex; align-items: center; gap: 12px; }
  .play-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--text-mute); background: var(--bg-3); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 2px; font-weight: 700;
  }
  .play.active .play-tag { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-dim); }
  .play.veto   .play-tag { color: var(--red);  border-color: var(--red);  background: var(--red-dim); }
  .play-name { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
  .play-window { font-family: var(--mono); font-size: 11px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 8px; }
  .badge-dir {
    padding: 3px 8px; border-radius: 2px; font-size: 9px;
    text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
    font-family: var(--mono);
  }
  .badge-dir.long  { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .badge-dir.short { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }
  .badge-dir.both  { background: var(--cyan-dim);  color: var(--cyan);  border: 1px solid var(--cyan); }

  /* Stat tiles */
  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-bottom: 12px;
  }
  .stat-tile {
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
    text-align: left;
  }
  .stat-tile .t-l {
    font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mute); font-weight: 700; font-family: var(--mono);
  }
  .stat-tile .t-v {
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    margin-top: 3px; color: var(--text);
  }
  .stat-tile.good .t-v { color: var(--green); }
  .stat-tile.bad  .t-v { color: var(--red); }
  .stat-tile.warn .t-v { color: var(--amber); }
  .stat-tile.cool .t-v { color: var(--cyan); }

  /* Confluence dots */
  .conf-dots {
    display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
    font-family: var(--mono); font-size: 11px;
  }
  .conf-dots .d {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid var(--line-2); background: transparent;
    flex-shrink: 0;
  }
  .conf-dots .d.on { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .conf-dots .d.maybe { background: transparent; border-color: var(--cyan); border-style: dashed; }
  .conf-dots .l { color: var(--text-dim); margin-left: 8px; letter-spacing: 0.5px; }
  .conf-dots .l b { color: var(--text); }

  .factor-line {
    display: grid;
    grid-template-columns: 16px 50px 1fr 95px;
    gap: 8px; align-items: baseline;
    padding: 4px 0;
    font-size: 12px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .factor-line:last-child { border-bottom: 0; }
  .factor-line.pending { opacity: 0.75; }
  .factor-line .marker { font-family: var(--mono); font-size: 11px; }
  .factor-line.on .marker { color: var(--green); }
  .factor-line.pending .marker { color: var(--text-mute); }
  .factor-line.veto .marker { color: var(--red); }
  .factor-line .lift {
    font-family: var(--mono); font-size: 11px;
    color: var(--green); font-weight: 600;
  }
  .factor-line.pending .lift { color: var(--text-dim); }
  .factor-line.veto .lift { color: var(--red); }
  .factor-line .desc { color: var(--text); }
  .factor-line.veto .desc { color: var(--red); }
  .factor-line .meta {
    font-family: var(--mono); font-size: 10px; color: var(--text-mute); text-align: right;
  }
  .factor-line .meta .when {
    color: var(--cyan); padding: 1px 5px; border: 1px solid var(--cyan-dim);
    border-radius: 2px; margin-right: 4px;
  }

  .projection-strip {
    display: flex; gap: 6px; margin: 12px 0 0;
  }
  .proj-card {
    flex: 1;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 9px 11px;
    position: relative;
  }
  .proj-card.active {
    border-color: var(--cyan);
    background: linear-gradient(180deg, var(--cyan-dim), var(--bg-3));
    box-shadow: 0 0 12px -4px var(--cyan-glow);
  }
  .proj-card.veto.active {
    border-color: var(--red);
    background: linear-gradient(180deg, var(--red-dim), var(--bg-3));
    box-shadow: 0 0 12px -4px var(--red);
  }
  .proj-card .pl {
    font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mute); font-weight: 700; font-family: var(--mono);
  }
  .proj-card .pa { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .proj-card .pn { font-size: 10px; color: var(--text-dim); margin-top: 3px; font-family: var(--mono); }
  .proj-card.skip .pa { color: var(--text-mute); }
  .proj-card.take .pa { color: var(--green); }
  .proj-card.veto .pa { color: var(--red); }

  .extra-note {
    margin-top: 10px; padding: 7px 10px;
    background: var(--amber-dim); border-left: 2px solid var(--amber);
    border-radius: 0 3px 3px 0; color: #e3b366; font-size: 11px; line-height: 1.5;
  }

  /* ===== Edges ===== */
  .edge-list { display: flex; flex-direction: column; gap: 6px; }
  .edge {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 3px;
    padding: 9px 11px;
    position: relative;
  }
  .edge.armed {
    border-color: var(--green);
    background: linear-gradient(90deg, var(--green-dim) 0%, var(--bg-2) 60%);
    box-shadow: 0 0 16px -8px var(--green);
  }
  .edge-head {

    margin-bottom: 12px;

    font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1;
    color: var(--text);
    text-shadow: 0 0 24px var(--cyan-dim);

  .price-ts { font-family: var(--mono); font-size: 9px; color: var(--text-mute); margin-top: 4px; letter-spacing: 1px; }
  .gap-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 3px;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    border: 1px solid;

  .gap-pill.down { color: var(--red);   border-color: var(--red);   background: var(--red-dim); box-shadow: 0 0 14px -6px var(--red); }

  .ladder svg { width: 100%; height: 100%; display: block; }

  .session-row.lon::before  { background: var(--amber);  box-shadow: 0 0 8px var(--amber); }
  .session-row.pd::before   { background: var(--green);  box-shadow: 0 0 8px var(--green); }

    font-size: 8px; letter-spacing: 2px; text-transform: uppercase;

  .session-row.asia .s-label { color: var(--violet); }
  .session-row.lon  .s-label { color: var(--amber); }
  .session-row.pd   .s-label { color: var(--green); }

    font-family: var(--mono); font-size: 11px; margin-top: 4px;

  table.levels {
    width: 100%; border-collapse: collapse; font-size: 11px;
  }
  table.levels th {
    text-align: left; color: var(--text-mute);
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px;

  table.levels tr.below td:first-child { color: var(--red); text-shadow: 0 0 6px var(--red); }

        return {mode: 'wait', label: 'NO ACTIVE PLAY', window: 'wait for 9:30', reason: 'No matrix play active and not vetoed.', play: null, triggers: [], targets: []};
      }

      const primary = candidates[0];
      const triggers = (primary.post_pending || []).slice(0, 3);
      const isReady = primary.preopen_count >= (primary.max_preopen / 2);
      return {
        mode: 'go', label: primary.name.toUpperCase(),
        window: primary.window,
        direction: primary.direction,
        play: primary,
        triggers, isReady,
        backup: candidates[1] || null,
        avoidHot,
      };
    }

    // ============ TOPBAR ============
    const meta = d.meta || {};
    const fc = d.or_forecast || {};
    const tierLevel = fc.tier_level || 'unknown';
    const qLabel = (fc.quintile || '').split(' ', 1)[0];
    const pulseClass = isDemo ? 'demo' : (meta.mode === 'live' ? '' : 'offline');
    const pulseText  = isDemo ? 'Demo' : (meta.mode || 'idle').toUpperCase();

    app.appendChild(h('div', {class:'topbar'},
      h('div', {class:'brand'},
        h('span', {class:'accent'}, 'NQ'), ' BRIEFING'),
      h('div', {class:'spacer'}),
      h('span', {class:'meta-tag mono'}, h('b', null, meta.date || '—'), ' · ', meta.day_of_week || '—'),
      h('span', {class:'meta-tag mono'},
        meta.generated_at_et
          ? new Date(meta.generated_at_et).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',hour12:false}) + ' ET'
          : 'HISTORICAL'),
      h('span', {class: 'pulse ' + pulseClass}, pulseText),
    ));

    // ============ PRIMARY READ HERO ============
    const primary = computePrimary();
    const primaryEl = h('div', {class: 'primary ' + primary.mode},
      h('div', {class:'corner tl'}), h('div', {class:'corner tr'}),
      h('div', {class:'corner bl'}), h('div', {class:'corner br'}));

    // Column 1: the action
    const col1 = h('div', null,
      h('div', {class:'pr-label'}, "TODAY'S PRIMARY READ"),
      h('div', {class:'pr-action'}, primary.label),
      h('div', {class:'pr-window'},
        primary.play
          ? `${(primary.direction || '').toUpperCase()}  ·  ${primary.window}`
          : primary.window),
      primary.play
        ? h('div', {class:'pr-summary'},
            'Currently ',
            h('b', null, `${primary.play.preopen_count}/${primary.play.max_preopen}`),
            ' confluence pre-open. Watch the ',
            h('b', null, '9:30 candle'),
            ' for confirmation — full play unlocks at projected count ',
            h('b', null, `${primary.play.projection.max_count}`),
            primary.backup ? h('span', null, '. Backup: ', h('b', null, primary.backup.name), '.') : '.',
          )
        : h('div', {class:'pr-summary'}, primary.reason),
    );

    // Column 2: triggers
    let col2;
    if (primary.play && primary.triggers.length) {
      col2 = h('div', {class:'pr-trigger'},
        h('div', {class:'pr-label'}, 'TRIGGERS @ 9:30+'),
        ...primary.triggers.map(t => h('div', {class:'pr-trig-row'},
          h('span', {class:'when'}, t.when),
          h('span', {class:'desc'}, t.desc),
          h('span', {class:'lift'}, `+${t.lift_pp}pp`))));
    } else {
      col2 = h('div', null,
        h('div', {class:'pr-label'}, 'STATUS'),
        h('div', {style:'color:var(--text-dim);font-size:13px;line-height:1.7;'},
          primary.mode === 'stand' ? 'OR forecast says TIGHT regime — historical WR collapses. Stand down for the session.' :
          primary.mode === 'wait'  ? 'All eligible matrix plays at low confluence or vetoed. Wait for 9:30 confirmations before engaging.' :
          'See triggers below.'));
    }

    // Column 3: meta tiles (size / target / OR / kill)
    const fcReady = fc.available;
    const gp = d.game_plan || {};
    const firstTarget = (gp.best_targets || [])
      .filter(t => primary.direction === 'short' ? t.direction === 'below' : t.direction === 'above')[0]
      || (gp.best_targets || [])[0];

    const col3 = h('div', null,
      h('div', {class:'pr-label'}, 'SIZE · TARGET · KILL'),
      h('div', {class:'pr-meta'},
        h('div', {class: 'pr-meta-tile ' + (
          tierLevel === 'wide' || tierLevel === 'wide_max' ? 'good' :
          tierLevel === 'normal' ? 'cool' :
          tierLevel === 'below' ? 'warn' :
          tierLevel === 'stand_down' ? 'bad' : '')},
          h('div', {class:'l'}, 'TIER'),
          h('div', {class:'v'}, fcReady ? (qLabel || '—') + ' ' + (fc.tier_level || '').replace('_', ' ').toUpperCase() : '—')),
        h('div', {class: 'pr-meta-tile cool'},
          h('div', {class:'l'}, 'OR PTS'),
          h('div', {class:'v'}, fcReady ? Math.round(fc.point_pts) : '—')),
        firstTarget
          ? h('div', {class: 'pr-meta-tile ' + (firstTarget.direction === 'above' ? 'good' : 'bad')},
              h('div', {class:'l'}, 'TGT-01'),
              h('div', {class:'v'}, `${firstTarget.label} ${fmtPts(firstTarget.distance_pts)}`))
          : h('div', {class:'pr-meta-tile'},
              h('div', {class:'l'}, 'TGT'),
              h('div', {class:'v'}, '—')),
        h('div', {class: 'pr-meta-tile ' + (primary.avoidHot ? 'bad' : '')},
          h('div', {class:'l'}, 'KILL'),
          h('div', {class:'v'}, primary.avoidHot ? 'AVOID HOT' : 'CLEAR'))),
    );

    primaryEl.appendChild(h('div', {class:'primary-grid'}, col1, col2, col3));
    app.appendChild(primaryEl);

    // ============ KPI STRIP ============
    const po = d.pre_open || {};
    const cal = d.calendar || {};
    const mp = d.matrix_plays || [];
    const factors = d.factors || {};

    const activeCount = mp.filter(p => !p.veto_active && (p.projection?.max_tier?.action || '').toUpperCase().includes('TAKE')).length;
    const vetoCount   = mp.filter(p => p.veto_active).length;

    const gap = po.gap || {};
    const ovr = po.overnight || {};
    const kpis = [
      {label: 'Current', value: fmtPrice(po.current_price), sub: po.current_price_ts || '—', cls: 'cool'},
      {label: 'Gap', value: gap.pts != null ? fmtPts(gap.pts) : '—',
        sub: gap.pct != null ? fmtPts(gap.pct) + '%' : '',
        cls: gap.pts == null ? '' : (gap.pts >= 0 ? 'up' : 'down')},
      {label: 'Overnight', value: ovr.range != null ? Number(ovr.range).toFixed(0) + ' pts' : '—',
        sub: ovr.direction || '—',
        cls: ovr.wide ? 'warn' : ovr.tight ? 'warn' : ''},
      {label: 'OR Forecast', value: fc.available ? Math.round(fc.point_pts) + ' pts' : '—',
        sub: fc.available ? (fc.quintile || '') : '',
        cls: fc.tier_level === 'wide' || fc.tier_level === 'wide_max' ? 'up' :
             fc.tier_level === 'stand_down' ? 'down' : 'cool'},
      {label: 'Calendar', value: cal.unknown ? '?' : (cal.events || []).length + ' EVT',
        sub: cal.is_fomc_week ? 'FOMC WEEK' : 'CLEAR',
        cls: cal.is_fomc_week || (cal.events||[]).some(e => (e.impact||'').toLowerCase()==='high') ? 'warn' : ''},
      {label: 'Plays', value: `${activeCount}/${mp.length}`,
        sub: vetoCount ? `${vetoCount} VETOED` : 'CLEAR',
        cls: activeCount ? 'up' : ''},
    ];
    app.appendChild(h('div', {class:'grid grid-6'},
      kpis.map(k => h('div', {class:'kpi ' + (k.cls || '')},
        h('div', {class:'k-l'}, k.label),
        h('div', {class:'k-v'}, k.value),
        k.sub ? h('div', {class:'k-s'}, k.sub) : null))));

    // ============ FRESHNESS / AVOID ============
    const stale = (d.freshness || []).filter(f => f.is_stale);
    if (stale.length) {
      app.appendChild(h('div', {class:'freshness'},
        h('h3', null, '⚠ STALE DATA'),
        stale.map(f => h('div', null, `${f.label} — last ${f.last_date} (${f.days_stale}d) — ${f.impact}`))));
    }

    const av = d.avoid || {};
    const avoidHot = (av.factor_signals || []).length + (av.combo_signals || []).length;
    if (avoidHot) {
      app.appendChild(h('div', {class:'avoid-banner'},
        h('div', {class:'a-h'}, '◆ AVOID / STAND-DOWN'),
        (av.factor_signals || []).map(fs => h('div', {class:'item'},
          h('b', null, fs.factor), `WR ${fs.wr_pct}% · lift ${fs.lift_pp > 0 ? '+' : ''}${fs.lift_pp}pp · PF ${fs.pf}`)),
        (av.combo_signals || []).map(cs => h('div', {class:'item'},
          h('b', null, cs.status === 'armed' ? 'ARMED' : 'WATCH'),
          cs.factors.join(' + '), ` — WR ${cs.wr_pct}%, PF ${cs.pf}`,
          cs.post_needed && cs.post_needed.length
            ? ` (confirm: ${cs.post_needed.map(p => p.factor).join(', ')})` : '')),
        narrative(av.narrative)));
    }

    // ============ MATRIX PLAYS ============
    if (mp.length) {
      app.appendChild(h('div', {class:'section-h'},
        'Matrix Play Scorecards', h('span', {class:'count'}, `${mp.length}`)));
      mp.forEach((p, i) => app.appendChild(renderMatrixPlay(p, i)));
    }

    // ============ EDGES + PRE-OPEN ============
    app.appendChild(h('div', {class:'section-h'}, 'Edges & Market State'));
    const main = h('div', {class:'grid grid-2'});

    const leftCol = h('div', {class:'grid', style:'gap:12px;'});

    const armed = d.armed_edges || [];
    leftCol.appendChild(h('div', {class:'card'},
      h('div', {class:'card-h'},
        h('span', {class:'card-t'}, 'Armed Edges'),
        h('span', {class:'mono', style:'color:var(--green);font-size:11px;'}, `${armed.length} ACTIVE`)),
      armed.length
        ? h('div', {class:'edge-list'}, armed.map(e => renderEdge(e, true)))
        : h('div', {class:'empty'}, 'No combos fully armed. Wait for 9:30.')));

    if (d.w1_short_confluence) {
      const w1 = d.w1_short_confluence;
      const tier = w1.tier || {};
      leftCol.appendChild(h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'W1 Short Confluence'),
          h('span', {class:'mono', style:'color:var(--cyan);font-size:11px;'},
            `${w1.preopen_count} PRE-MARKET`)),
        h('div', {style:'display:flex;flex-wrap:wrap;gap:3px;'},
          (w1.active_factors || []).map(f => h('span', {class:'chip on'}, f))),
        tier.action ? h('div', {style:'margin-top:10px;'},
          h('div', {class:'mono', style:'color:var(--cyan);font-size:12px;font-weight:700;'}, tier.action),
          h('div', {class:'mono dim', style:'font-size:10px;margin-top:4px;letter-spacing:0.5px;'},
            `WR ${tier.wr || '?'} · PF ${tier.pf_1r || '?'} · target ${tier.target || '?'}`)) : null,
        h('div', {class:'mute mono', style:'font-size:10px;margin-top:8px;letter-spacing:0.5px;'},
          '↳ 9:30:30 bearish candle = +1 tier')));
    }

    const watch = d.watch_list || [];
    if (watch.length) {
      leftCol.appendChild(h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Watch List'),
          h('span', {class:'mute mono', style:'font-size:10px;'}, 'NEED 9:30 CONFIRM')),
        h('div', {class:'edge-list'}, watch.map(e => renderEdge(e, false)))));
    }

    const ap = d.active_plays || [];
    if (ap.length) {
      leftCol.appendChild(h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Playbook Plays Active'),
          h('span', {class:'mono', style:'color:var(--cyan);font-size:11px;'}, `${ap.length}`)),
        ap.map(p => h('div', {style:'padding:7px 0;border-bottom:1px dashed var(--line-soft);'},
          h('div', {style:'display:flex;justify-content:space-between;gap:8px;align-items:baseline;'},
            h('div', null,
              h('span', {class: 'badge-dir ' + (p.direction || 'both'), style:'margin-right:8px;'},
                (p.direction || '?').toUpperCase()),
              h('span', {style:'font-size:12px;font-weight:600;'}, p.name || '?')),
            h('span', {class:'mono dim', style:'font-size:10px;'},
              `WR ${p.wr_base || '?'} · n=${p.sample_size || '?'}`)),
          p.action_plan ? h('div', {class:'dim', style:'font-size:11px;margin-top:4px;line-height:1.55;'}, p.action_plan) : null))));
    }

    main.appendChild(leftCol);

    const rightCol = h('div', {class:'grid', style:'gap:12px;'});
    rightCol.appendChild(renderPreOpen(po, d.levels || {}));
    rightCol.appendChild(renderCalendar(cal));
    rightCol.appendChild(renderFactors(factors));
    main.appendChild(rightCol);
    app.appendChild(main);

    // ============ BOTTOM: LEVELS + PLAN ============
    app.appendChild(h('div', {class:'section-h'}, 'Targets & Plan'));
    const bottom = h('div', {class:'grid grid-2'});
    bottom.appendChild(renderLevelsTable(d.levels || {}));
    bottom.appendChild(renderGamePlan(d.game_plan || {}));
    app.appendChild(bottom);

    // Footer
    app.appendChild(h('div', {class:'mute mono', style:'text-align:center;font-size:9px;margin-top:28px;letter-spacing:2px;'},
      `// SCHEMA v${d.schema_version} ${isDemo ? '// DEMO MODE — run morning_briefing.py --export-dashboard' : ''}`));

    // ========================================================
    // Renderers
    // ========================================================

    function renderMatrixPlay(p, idx) {
      const isVeto = !!p.veto_active;
      const proj = p.projection || {};
      const minAction = (proj.min_tier?.action || '').toUpperCase();
      const maxAction = (proj.max_tier?.action || '').toUpperCase();
      const isActive = !isVeto && maxAction.includes('TAKE');

      const exp = p.expectancy;
      const noteMax = proj.max_tier?.note || '';
      const wrMatch = noteMax.match(/~?(\d+(?:[-–]\d+)?)\s*%\s*WR/i);
      const pfMatch = noteMax.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);

      const statTiles = [
        {label:'Confluence', value: `${p.preopen_count}/${p.max_preopen}`,
          cls: p.preopen_count >= Math.ceil((p.max_preopen||1)/2) ? 'cool' : ''},
        {label:'Best WR', value: wrMatch ? wrMatch[1] + '%' : '—', cls: 'good'},
        {label:'Best PF', value: pfMatch ? pfMatch[1] : '—', cls: 'good'},
        {label: exp ? 'Setup/day' : 'Status',
          value: exp ? exp.setup_pct_of_all_days + '%' :
                 (isVeto ? 'VETO' : isActive ? 'READY' : 'WAIT'),
          cls: exp ? '' : (isVeto ? 'bad' : isActive ? 'cool' : 'warn')},
      ];

      const dots = [];
      for (let i = 0; i < p.max_preopen; i++) {
        dots.push(h('div', {class: 'd' + (i < p.preopen_count ? ' on' : '')}));
      }
      for (let i = 0; i < (p.post_pending || []).length; i++) {
        dots.push(h('div', {class:'d maybe'}));
      }

      const cardCls = 'play ' + (isVeto ? 'veto' : isActive ? 'active' : 'skip');
      const card = h('div', {class: cardCls});

      card.appendChild(h('div', {class:'play-head'},
        h('div', {class:'play-id'},
          h('span', {class:'play-tag'}, String(idx + 1).padStart(2, '0')),
          h('span', {class: 'badge-dir ' + p.direction}, p.direction.toUpperCase()),
          h('span', {class:'play-name'}, p.name)),
        h('span', {class:'play-window'},
          isVeto ? h('span', {class:'chip veto'}, '🚫 VETO') : null,
          p.window)));

      if (isVeto) {
        card.appendChild(h('div', null,
          (p.active_vetoes || []).map(v => h('div', {class:'factor-line veto'},
            h('span', {class:'marker'}, '✕'),
            h('span', {class:'lift'}, `${v.lift_pp > 0 ? '+' : ''}${v.lift_pp}pp`),
            h('span', {class:'desc'}, v.desc),
            h('span', {class:'meta'}, v.id)))));
        card.appendChild(h('div', {class:'extra-note'},
          `Skip ${p.name} today — veto overrides any confluence count.`));
        if (p.extra_note) card.appendChild(h('div', {class:'extra-note'}, p.extra_note));
        if (p.notion_url) card.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
        card.appendChild(narrative(p.narrative));
        return card;
      }

      card.appendChild(h('div', {class:'conf-dots'},
        dots,
        h('span', {class:'l'},
          h('b', null, `${p.preopen_count}`), '/',
          h('b', null, `${p.max_preopen}`), ' CONFLUENCE',
          (p.post_pending || []).length ? ` · +${p.post_pending.length} possible` : '')));

      card.appendChild(h('div', {class:'stat-row'},
        statTiles.map(s => h('div', {class:'stat-tile ' + (s.cls||'')},
          h('div', {class:'t-l'}, s.label),
          h('div', {class:'t-v'}, s.value)))));

      if ((p.preopen_active || []).length) {
        card.appendChild(h('div', null,
          p.preopen_active.map(f => h('div', {class:'factor-line on'},
            h('span', {class:'marker'}, '✓'),
            h('span', {class:'lift'}, `+${f.lift_pp}pp`),
            h('span', {class:'desc'}, f.desc),
            h('span', {class:'meta'}, f.id)))));
      }
      if ((p.post_pending || []).length) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin-top:8px;'},
          'PENDING'));
        card.appendChild(h('div', null,
          p.post_pending.map(f => h('div', {class:'factor-line pending'},
            h('span', {class:'marker'}, '○'),
            h('span', {class:'lift'}, `+${f.lift_pp}pp`),
            h('span', {class:'desc'}, f.desc),
            h('span', {class:'meta'},
              h('span', {class:'when'}, f.when), f.id)))));
      }

      const projStrip = h('div', {class:'projection-strip'});
      const cls = (action) => action.includes('TAKE') ? 'take' : 'skip';
      if (proj.locked) {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minAction) + ' active'},
          h('div', {class:'pl'}, `COUNT ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
      } else {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minAction)},
          h('div', {class:'pl'}, `IF ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(maxAction) + ' active'},
          h('div', {class:'pl'}, `IF ${proj.max_count}`),
          h('div', {class:'pa'}, proj.max_tier.action),
          h('div', {class:'pn'}, proj.max_tier.note || '')));
      }
      card.appendChild(projStrip);

      if (exp) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:10px;margin-top:10px;text-align:right;letter-spacing:0.5px;'},
          `baseline: ${exp.setup_pct_of_all_days}% of days · fires ${exp.fire_rate_pct}% · EV +${exp.ev_per_setup_day_R}R`));
      }
      if (p.extra_note) card.appendChild(h('div', {class:'extra-note'}, p.extra_note));
      if (p.notion_url) card.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
      card.appendChild(narrative(p.narrative));
      return card;
    }

    function renderEdge(e, armed) {
      const wrap = h('div', {class:'edge' + (armed ? ' armed' : '')},
        h('div', {class:'edge-head'},
          h('span', null,
            h('span', {class:'stars'}, e.stars || ''), ' ',
            h('span', {class:'mono'}, (e.factors || []).join(' + '))),
          h('span', {class:'stats'},
            h('b', null, `WR ${e.wr_pct}%`),
            h('b', null, `PF ${e.pf}`),
            h('span', null, `n=${e.n}`))));
      if (!armed) {
        wrap.appendChild(h('div', {class:'edge-confirm'},
          h('span', null, 'matched: ',
            h('span', {class:'mono', style:'color:var(--green);'},
              (e.pre_matched || []).map(f => f + '✓').join(' ') || '—')),
          h('span', null, '· confirm: ',
            h('span', {class:'mono'},
              (e.post_needed || []).map(p => p.factor).join(', ') || '—'))));
      }
      return wrap;
    }

    function renderPreOpen(po, lv) {
      const cur = po.current_price;
      const ovr = po.overnight || {};
      const asia = po.asia || {};
      const lon = po.london || {};
      const pr = po.prior_rth || {};

      const card = h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Pre-Open Structure'),
          po.current_price_ts ? h('span', {class:'mute mono', style:'font-size:10px;letter-spacing:1px;'},
            po.current_price_ts) : null),
        h('div', {class:'preopen-head'},
          h('div', null,
            h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;'}, 'CURRENT'),
            h('div', {class:'price-current'}, fmtPrice(cur))),
          po.gap?.pts != null
            ? h('div', {class:'gap-pill ' + (po.gap.pts >= 0 ? 'up' : 'down')},
                `${fmtPts(po.gap.pts)}`,
                po.gap.pct != null ? ` (${fmtPts(po.gap.pct)}%)` : '')
            : null));

      card.appendChild(buildPriceLadder(po, lv));

      const sessions = h('div', {class:'session-grid'});
      if (pr.high != null) {
        const pcp = pr.close_position;
        const pcpStr = pcp != null ? ` · close@${(pcp*100).toFixed(0)}%` : '';
        sessions.appendChild(h('div', {class:'session-row pd'},
          h('div', {class:'s-label'}, 'PRIOR RTH'),
          h('div', {class:'s-val'}, `${fmtPrice(pr.high)} / ${fmtPrice(pr.low)}`,
            h('span', {class:'dim'}, pcpStr))));
      }
      if (ovr.high != null) {
        const tag = ovr.tight ? ' · TIGHT' : ovr.wide ? ' · WIDE' : '';
        sessions.appendChild(h('div', {class:'session-row on'},
          h('div', {class:'s-label'}, 'OVERNIGHT'),
          h('div', {class:'s-val'}, `${fmtPrice(ovr.high)} / ${fmtPrice(ovr.low)}`,
            h('span', {class:'dim'}, ` · ${fmtPts(ovr.range)}${tag}`))));
      }
      if (asia.high != null) {
        sessions.appendChild(h('div', {class:'session-row asia'},
          h('div', {class:'s-label'}, 'ASIA'),
          h('div', {class:'s-val'}, `${fmtPrice(asia.high)} / ${fmtPrice(asia.low)}`)));
      }
      if (lon.high != null) {
        sessions.appendChild(h('div', {class:'session-row lon'},
          h('div', {class:'s-label'}, 'LONDON'),
          h('div', {class:'s-val'}, `${fmtPrice(lon.high)} / ${fmtPrice(lon.low)}`)));
      }
      card.appendChild(sessions);

      if ((po.data_notes || []).length) {
        card.appendChild(h('div', {class:'mute', style:'font-size:10px;margin-top:6px;'},
          po.data_notes.map(n => h('div', null, '· ', n))));
      }
      card.appendChild(narrative(po.narrative));
      return card;
    }

    function buildPriceLadder(po, lv) {
      const cur = po.current_price;
      if (cur == null) return h('div', {class:'empty'}, 'No live price.');

      const pts = [];
      const push = (price, label, color) => {
        if (price == null) return;
        pts.push({price, label, color});
      };
      const ovr = po.overnight || {};
      const asia = po.asia || {};
      const lon = po.london || {};
      const pr = po.prior_rth || {};
      push(ovr.high, 'ON H', '#5ee3f7');
      push(ovr.low,  'ON L', '#5ee3f7');
      push(asia.high, 'Asia H', '#b69eff');
      push(asia.low,  'Asia L', '#b69eff');
      push(lon.high, 'Lon H', '#ffc24d');
      push(lon.low,  'Lon L', '#ffc24d');
      push(pr.high, 'PDH', '#4eecaf');
      push(pr.low,  'PDL', '#4eecaf');
      push(pr.close, 'PDC', '#4eecaf');
      (lv.above || []).forEach(l => {
        if (!pts.find(p => Math.abs(p.price - l.price) < 0.5)) push(l.price, l.label, '#4eecaf');
      });
      (lv.below || []).forEach(l => {
        if (!pts.find(p => Math.abs(p.price - l.price) < 0.5)) push(l.price, l.label, '#ff5e7a');
      });

      const allP = pts.map(p => p.price).concat([cur]);
      const minP = Math.min(...allP), maxP = Math.max(...allP);
      const span = Math.max(maxP - minP, 1);
      const pad = span * 0.08;
      const lo = minP - pad, hi = maxP + pad;
      const W = 600, H = 320;
      const yOf = p => H - ((p - lo) / (hi - lo)) * (H - 20) - 10;

      const svg = h('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio:'none'});

      // grid lines
      for (let i = 0; i < 5; i++) {
        const y = (H / 5) * i + 4;
        svg.appendChild(h('line', {x1: 0, x2: W, y1: y, y2: y,
          stroke: 'rgba(94,227,247,0.04)', 'stroke-width': 1}));
      }

      // spine
      svg.appendChild(h('line', {x1: 90, x2: 90, y1: 6, y2: H-6,
        stroke: '#1c2742', 'stroke-width': 1}));

      // current price marker
      const curY = yOf(cur);
      svg.appendChild(h('line', {x1: 0, x2: W, y1: curY, y2: curY,
        stroke: '#eaf0fa', 'stroke-width': 1.4, 'stroke-dasharray': '5,3', opacity: 0.7}));
      svg.appendChild(h('rect', {x: W-118, y: curY-13, width: 112, height: 24,
        fill: '#080d18', stroke:'#5ee3f7', 'stroke-width': 1.2, rx: 2}));
      svg.appendChild(h('text', {x: W-62, y: curY+4, 'text-anchor': 'middle',
        'font-family': 'ui-monospace, Menlo', 'font-size': 12, 'font-weight': 700,
        fill: '#5ee3f7'}, `▶ ${cur.toFixed(2)}`));

      // de-collide labels
      const sorted = pts.slice().sort((a,b) => b.price - a.price);
      const minGap = 16;
      const placed = [];
      sorted.forEach(p => {
        let ty = yOf(p.price);
        for (const q of placed) if (Math.abs(ty - q.ty) < minGap) ty = q.ty + minGap;
        placed.push({...p, ty, y: yOf(p.price)});
      });

      placed.forEach(p => {
        svg.appendChild(h('line', {x1: 82, x2: 98, y1: p.y, y2: p.y,
          stroke: p.color, 'stroke-width': 2}));
        svg.appendChild(h('circle', {cx: 90, cy: p.y, r: 3.5,
          fill: p.color, stroke: '#080d18', 'stroke-width': 1.5}));
        svg.appendChild(h('line', {x1: 98, x2: 130, y1: p.y, y2: p.ty,
          stroke: p.color, 'stroke-width': 1, opacity: 0.4}));
        svg.appendChild(h('text', {x: 134, y: p.ty+4,
          'font-family': 'ui-monospace, Menlo', 'font-size': 11, 'font-weight': 600,
          fill: p.color},
          `${p.label}  ${p.price.toFixed(2)}  `,
          h('tspan', {fill: '#4b5878', 'font-size': 10, 'font-weight': 400},
            `${p.price > cur ? '+' : ''}${(p.price - cur).toFixed(1)}`)));
      });

      return h('div', {class:'ladder'}, svg);
    }

    function renderCalendar(cal) {
      const card = h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Calendar'),
          h('span', {class:'mute mono', style:'font-size:10px;letter-spacing:1px;'}, cal.day_of_week || '')));

      if (cal.unknown) {
        card.appendChild(h('div', {style:'color:var(--amber);font-size:11px;'},
          '⚠ Calendar unavailable — FOMC/red folder UNKNOWN'));
      } else {
        if ((cal.events || []).length) {
          cal.events.forEach(e => {
            card.appendChild(h('div', {class:'event-row'},
              e.time_et ? h('span', {class:'e-time'}, e.time_et) : null,
              h('span', {class: 'e-impact ' + (e.impact || '').toLowerCase()}),
              h('span', {class:'e-name'}, e.event),
              e.currency ? h('span', {class:'e-ccy'}, e.currency) : null));
          });
        } else {
          card.appendChild(h('div', {class:'empty'}, 'No red folder events'));
        }
        card.appendChild(h('div', {class:'flag-row'},
          h('span', {class: 'flag ' + (cal.is_fomc_week ? 'on' : '')},
            'FOMC: ', cal.is_fomc_week ? 'YES' : 'NO'),
          cal.dow_note ? h('span', {class:'flag'}, cal.dow_note) : null));
      }
      card.appendChild(narrative(cal.narrative));
      return card;
    }

    function renderFactors(fs) {
      const card = h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Factor Snapshot'),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${(fs.active||[]).length} ON · ${(fs.inactive||[]).length} OFF`)));
      const sec = (title, list, cls) => {
        if (!list || !list.length) return;
        card.appendChild(h('div', {style:'margin-top:6px;'},
          h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin-bottom:5px;'},
            `${title} · ${list.length}`),
          h('div', null, list.map(f => h('span', {class:'chip ' + cls}, f)))));
      };
      sec('ACTIVE', fs.active, 'on');
      sec('UNKNOWN', fs.unknown, 'unk');
      sec('INACTIVE', fs.inactive, 'off');
      card.appendChild(narrative(fs.narrative));
      return card;
    }

    function renderLevelsTable(lv) {
      const card = h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Liquidity Levels'),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `WITHIN ${lv.scope_pts || 100} PTS`)));

      const above = lv.above || [], below = lv.below || [];
      if (!above.length && !below.length) {
        card.appendChild(h('div', {class:'empty'}, 'No levels available — needs live price.'));
        card.appendChild(narrative(lv.narrative));
        return card;
      }
      const tbl = h('table', {class:'levels'},
        h('thead', null, h('tr', null,
          h('th', null, ''), h('th', null, 'Level'),
          h('th', null, 'Price'), h('th', null, 'Dist'),
          h('th', null, 'Hit 45m'), h('th', null, 'WR'))));
      const tb = h('tbody');
      const fmtRow = (l, cls) => h('tr', {class: cls},
        h('td', null, cls === 'above' ? '↑' : '↓'),
        h('td', null, l.label),
        h('td', null, fmtPrice(l.price)),
        h('td', null, fmtPts(l.distance_pts)),
        h('td', null,
          h('span', {class:'heat', style:`--w:${Math.min(100, l.hit_rate_45m_pct || 0)}%`}),
          fmtPct(l.hit_rate_45m_pct)),
        h('td', {class: l.below_baseline ? 'weak' : ''}, fmtPct(l.wr_as_magnet_pct)));
      above.forEach(l => tb.appendChild(fmtRow(l, 'above')));
      below.forEach(l => tb.appendChild(fmtRow(l, 'below')));
      tbl.appendChild(tb);
      card.appendChild(tbl);
      card.appendChild(h('div', {class:'mute mono', style:'font-size:10px;margin-top:10px;line-height:1.6;'},
        '1–2 levels in trade direction = sweet spot (55% WR, PF 1.30) ',
        '· 1 obstruction between entry/target = positive (58.5% WR) ',
        '· 3+ stacked = contested, reduce size'));
      card.appendChild(narrative(lv.narrative));
      return card;
    }

    function renderGamePlan(gp) {
      const card = h('div', {class:'card'},
        h('div', {class:'card-h'}, h('span', {class:'card-t'}, "Today's Game Plan")));

      (gp.one_liners || []).forEach(o =>
        card.appendChild(h('div', {class:'one-liner'}, '"', o, '"')));

      if ((gp.checklist || []).length) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin:12px 0 4px;'},
          '9:30 CHECKLIST'));
        card.appendChild(h('ul', {class:'checklist'},
          gp.checklist.map(t => h('li', null, t))));
      }

      if ((gp.best_targets || []).length) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin:14px 0 4px;'},
          'BEST DRAW TARGETS'));
        gp.best_targets.forEach(t =>
          card.appendChild(h('div', {class: 'target-row ' + (t.direction === 'above' ? 'up' : 'down')},
            h('span', null, t.direction === 'above' ? '↑' : '↓'),
            h('span', {class:'t-label'}, t.label),
            h('span', {class:'t-px'}, fmtPrice(t.price)),
            h('span', {class:'t-dist'}, fmtPts(t.distance_pts), ' pts'))));
      }
      card.appendChild(narrative(gp.narrative));
      return card;
    }
  })();
  </script>
