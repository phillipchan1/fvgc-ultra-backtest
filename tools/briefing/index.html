<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Disable browser caching of the HTML shell. GH Pages default is
     max-age=600, which means a stale index.html from yesterday's deploy
     can hang around for 10 minutes after a fresh push — and worse, the
     user's morning visit will pull HTML from yesterday's cache if the
     tab was left open or revisited inside the TTL window. We can't
     control the HTTP response headers Pages sends (no _headers support),
     but every modern browser honors these meta directives. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NQ Morning Briefing · TACTICAL</title>
<!-- Favicon — matches the ◤ NQ BRIEFING brand mark in the topbar. SVG
     for crisp rendering at any DPR; the data: URL fallback inline below
     keeps a tab icon even before favicon.svg loads (avoids the white
     "missing icon" flash on first paint). -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<script>
(function () {
  var KEY = 'briefing-theme';
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function resolve(pref) {
    if (pref === 'light') return 'light';
    if (pref === 'dark') return 'dark';
    return mq.matches ? 'dark' : 'light';
  }
  function apply(pref) {
    var p = pref || 'auto';
    var theme = resolve(p);
    var root = document.documentElement;
    root.dataset.theme = theme;
    root.dataset.themePref = p;
    root.style.colorScheme = theme;
  }
  function get() {
    try {
      var v = localStorage.getItem(KEY);
      if (v === 'light' || v === 'dark' || v === 'auto') return v;
    } catch (e) {}
    return 'auto';
  }
  function set(pref) {
    try { localStorage.setItem(KEY, pref); } catch (e) {}
    apply(pref);
    if (window.BriefingTheme && window.BriefingTheme._syncToggle) {
      window.BriefingTheme._syncToggle();
    }
  }
  apply(get());
  mq.addEventListener('change', function () {
    if (get() === 'auto') apply('auto');
  });
  window.BriefingTheme = {
    get: get,
    set: set,
    apply: apply,
    resolve: resolve,
    mountToggle: function (parent) {
      if (!parent || parent.querySelector('.theme-toggle')) return;
      var pref = get();
      var group = document.createElement('div');
      group.className = 'theme-toggle';
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', 'Color theme');
      [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].forEach(function (pair) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'theme-btn';
        btn.dataset.pref = pair[0];
        btn.setAttribute('aria-pressed', pref === pair[0] ? 'true' : 'false');
        btn.appendChild(document.createTextNode(pair[1]));
        if (pair[0] === 'auto') {
          var hint = document.createElement('span');
          hint.className = 'theme-sys';
          hint.textContent = 'SYS';
          btn.appendChild(hint);
        }
        btn.addEventListener('click', function () { set(pair[0]); });
        group.appendChild(btn);
      });
      if (parent.firstChild && parent.firstChild.nextSibling) {
        parent.insertBefore(group, parent.firstChild.nextSibling);
      } else {
        parent.appendChild(group);
      }
      window.BriefingTheme._syncToggle = function () {
        var p = get();
        group.querySelectorAll('.theme-btn').forEach(function (b) {
          b.setAttribute('aria-pressed', b.dataset.pref === p ? 'true' : 'false');
        });
      };
      window.BriefingTheme._syncToggle();
    },
  };
})();
</script>
<style>
  :root,
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg-0:      #04060c;
    --bg-1:      #080d18;
    --bg-2:      #0c1322;
    --bg-3:      #11192c;
    --bg-glass:  rgba(12, 19, 34, 0.7);
    --line:      #1c2742;
    --line-2:    #2a3a58;
    --line-soft: #15203a;
    --text:      #eaf0fa;
    --text-dim:  #8997b2;
    --text-mute: #4b5878;
    --cyan:      #5ee3f7;
    --cyan-dim:  #5ee3f71f;
    --cyan-glow: #5ee3f7;
    --cyan-deep: #38b3c9;
    --green:     #4eecaf;
    --green-dim: #4eecaf1f;
    --red:       #ff5e7a;
    --red-dim:   #ff5e7a1f;
    --red-deep:  #b03c4e;
    --red-soft:  #f0c5cc;
    --amber:     #ffc24d;
    --amber-dim: #ffc24d1f;
    --amber-deep:#b8851c;
    --amber-text:#e3b366;
    --violet:    #b69eff;
    --violet-dim:#b69eff1f;
    --violet-text:#d5cbf3;
    --pink:      #ff7eb6;
    --bg-grad-a: #102536;
    --bg-grad-b: #1a1336;
    --grid-line: rgba(94, 227, 247, 0.018);
    --scanline:  rgba(0, 0, 0, 0.05);
    --scanline-opacity: 0.4;
    --primary-shine: rgba(94, 227, 247, 0.06);
    --primary-bg-top: #0e1830;
    --primary-bg-bot: #08101d;
    --stand-border: #4a2434;
    --veto-border: #4a1f2b;
    --veto-bg-top: #170c14;
    --text-grad-end: #b5d3e0;
    --pr-cyan-end: #34a5b8;
    --card-hover: rgba(94, 227, 247, 0.04);
    --tile-overlay: rgba(0, 0, 0, 0.25);
    --ladder-grid: rgba(94, 227, 247, 0.04);
    --glow: 1;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg-0:      #f5f7fc;
    --bg-1:      #ffffff;
    --bg-2:      #f0f3f9;
    --bg-3:      #e8edf5;
    --bg-glass:  rgba(255, 255, 255, 0.85);
    --line:      #d4dce8;
    --line-2:    #c2ccd8;
    --line-soft: #e2e8f0;
    --text:      #0c1220;
    --text-dim:  #4a5568;
    --text-mute: #7a8699;
    --cyan:      #0a8fa8;
    --cyan-dim:  #0a8fa814;
    --cyan-glow: #0a8fa8;
    --cyan-deep: #066b7f;
    --green:     #0d9b6e;
    --green-dim: #0d9b6e14;
    --red:       #d42d4a;
    --red-dim:   #d42d4a14;
    --red-deep:  #9a2238;
    --red-soft:  #6b2030;
    --amber:     #b87a00;
    --amber-dim: #b87a0014;
    --amber-deep:#8a5c00;
    --amber-text:#7a5500;
    --violet:    #6b4fc7;
    --violet-dim:#6b4fc714;
    --violet-text:#4a3580;
    --pink:      #c43d72;
    --bg-grad-a: #d8e8f5;
    --bg-grad-b: #e8e0f5;
    --grid-line: rgba(10, 143, 168, 0.07);
    --scanline:  rgba(0, 0, 0, 0.03);
    --scanline-opacity: 0.12;
    --primary-shine: rgba(10, 143, 168, 0.08);
    --primary-bg-top: #eef4fa;
    --primary-bg-bot: #ffffff;
    --stand-border: #e8c4cc;
    --veto-border: #e8c4cc;
    --veto-bg-top: #faf0f2;
    --text-grad-end: #3d4f63;
    --pr-cyan-end: #066b7f;
    --card-hover: rgba(10, 143, 168, 0.06);
    --tile-overlay: rgba(0, 0, 0, 0.04);
    --ladder-grid: rgba(10, 143, 168, 0.08);
    --glow: 0;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--text); }
  body {
    font: 13px/1.5 var(--sans);
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 80% -150px, var(--bg-grad-a) 0%, transparent 55%),
      radial-gradient(900px 600px at -10% 110%, var(--bg-grad-b) 0%, transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 90%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 2px, var(--scanline) 2px, var(--scanline) 3px);
    opacity: var(--scanline-opacity);
  }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .dim { color: var(--text-dim); }
  .mute { color: var(--text-mute); }

  /* ===== Layout ===== */
  .wrap { max-width: 1480px; margin: 0 auto; padding: 18px 22px 60px; position: relative; z-index: 1; }
  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1.45fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-6 { grid-template-columns: repeat(6, 1fr); }
  @media (max-width: 1180px) {
    .grid-2 { grid-template-columns: 1fr; }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 0 14px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 16px;
  }
  .brand {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: 3px; color: var(--text);
  }
  .brand .accent { color: var(--cyan); }
  .brand::before {
    content: "◤"; color: var(--cyan); margin-right: 6px;
    text-shadow: 0 0 calc(8px * var(--glow)) var(--cyan-glow);
  }
  .topbar .spacer { flex: 1; }

  /* Theme toggle */
  .topbar .theme-toggle {
    margin-left: 4px;
    flex-shrink: 0;
  }
  .theme-toggle {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .theme-btn {
    appearance: none;
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text-mute);
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 9px;
    cursor: pointer;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .theme-btn:last-child { border-right: 0; }
  .theme-btn:hover { color: var(--text-dim); background: var(--bg-3); }
  .theme-btn[aria-pressed="true"] {
    background: var(--cyan-dim);
    color: var(--cyan);
  }
  .theme-btn .theme-sys {
    font-size: 7px;
    letter-spacing: 1px;
    opacity: 0.55;
    padding: 1px 3px;
    border: 1px solid currentColor;
    border-radius: 1px;
  }
  .theme-btn[aria-pressed="true"] .theme-sys { opacity: 0.85; }

  .meta-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
    color: var(--text-dim);
  }
  .meta-tag b { color: var(--text); font-weight: 600; }
  .meta-tag.dim { color: var(--text-mute); }

  /* ===== Topbar — clock + status pill cluster =====
     Reading order, left to right:
       BRAND → spacer → day · date → CLOCK (12hr) → MARKET pill →
       FEED pill → AI pill → PLAYS pill → briefing-age label
     Each named pill answers a single question. Together they let the
     trader see at a glance: is the market open, is the data fresh, is
     the AI working, and how many plays are still on the table.
  */
  .live-clock {
    font-family: var(--mono); font-size: 18px; font-weight: 700;
    color: var(--cyan); text-shadow: 0 0 calc(10px * var(--glow)) var(--cyan-dim);
    letter-spacing: 1px;
    margin-left: 4px;
  }
  .live-meridiem {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    color: var(--cyan); opacity: 0.85;
    letter-spacing: 1.5px;
    align-self: flex-end;
    margin-bottom: 3px;
  }
  .now-tz {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
    color: var(--cyan); opacity: 0.6;
    align-self: flex-end;
    margin-bottom: 3px;
  }
  .pill-sep {
    width: 1px; height: 18px;
    background: var(--line);
    margin: 0 4px;
  }
  .briefing-age {
    font-size: 9px; letter-spacing: 1px;
    color: var(--text-dim);
    margin-left: 8px;
    white-space: nowrap;
  }
  .briefing-age .dim { color: var(--text-mute); }

  /* Status pills — shared shell. Each pill has:
       .dot   — colored circle (state indicator, pulses when live)
       .lbl   — uppercase short label ("OR WINDOW" / "FEED" / etc)
       .sub   — secondary detail (countdown, lag, age)
     States set the color tint via the parent's modifier class. */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 1.5px;
    white-space: nowrap;
    cursor: help;
    transition: border-color 0.3s ease, color 0.3s ease;
  }
  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-mute);
    flex: 0 0 auto;
  }
  .status-pill .lbl {
    font-weight: 700;
    color: var(--text);
  }
  .status-pill .sub {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    font-weight: 500;
  }
  /* Generic "active/pulse" — green dot animation. Apply when adding
     `.live` / `.or` / `.open` to any pill. */
  .status-pill.live .dot,
  .status-pill.or .dot,
  .status-pill.open .dot,
  .status-pill.fresh .dot {
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 6px currentColor;
  }

  /* MARKET state */
  .status-pill.market.pre   { border-color: var(--amber); color: var(--amber); }
  .status-pill.market.pre   .dot { background: var(--amber); }
  .status-pill.market.pre   .lbl { color: var(--amber); }
  .status-pill.market.or    { border-color: var(--green); color: var(--green);
                              background: var(--green-dim);
                              box-shadow: 0 0 16px -6px var(--green); }
  .status-pill.market.or    .dot { background: var(--green); }
  .status-pill.market.or    .lbl { color: var(--green); }
  .status-pill.market.open  { border-color: var(--green); color: var(--green); }
  .status-pill.market.open  .dot { background: var(--green); }
  .status-pill.market.open  .lbl { color: var(--green); }
  .status-pill.market.closed { color: var(--text-mute); }
  .status-pill.market.closed .lbl { color: var(--text-mute); }

  /* FEED — Fly.io live data. `.live-pill` is set externally by
     setupLiveOverlay; here we re-skin it to match the named-pill
     vocabulary (FEED · 1s). */
  .live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 1.5px;
    white-space: nowrap;
    cursor: help;
  }
  .live-pill::before {
    content: ""; width: 6px; height: 6px;
    border-radius: 50%; background: var(--text-mute);
    flex: 0 0 auto;
  }
  .live-pill .lbl { font-weight: 700; color: var(--text); }
  .live-pill .lag { font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px; }
  .live-pill.live    { border-color: var(--green); color: var(--green); }
  .live-pill.live::before {
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--green);
  }
  .live-pill.live .lbl { color: var(--green); }
  .live-pill.stale   { border-color: var(--amber); }
  .live-pill.stale::before { background: var(--amber); }
  .live-pill.stale .lbl { color: var(--amber); }
  .live-pill.offline { border-color: var(--text-mute); color: var(--text-mute); }
  .live-pill.offline .lbl { color: var(--text-mute); }

  /* AI pill */
  .status-pill.ai.disabled { color: var(--text-mute); }
  .status-pill.ai.disabled .lbl { color: var(--text-mute); }
  .status-pill.ai.ready    { border-color: var(--cyan); color: var(--cyan); }
  .status-pill.ai.ready    .dot { background: var(--cyan); }
  .status-pill.ai.ready    .lbl { color: var(--cyan); }
  .status-pill.ai.fresh    { border-color: var(--violet); color: var(--violet);
                             background: var(--violet-dim); }
  .status-pill.ai.fresh    .dot { background: var(--violet); }
  .status-pill.ai.fresh    .lbl { color: var(--violet); }

  /* PLAYS pill */
  .status-pill.plays.wait  { border-color: var(--text-mute); }
  .status-pill.plays.wait  .dot { background: var(--text-mute); }
  .status-pill.plays.live  { border-color: var(--cyan); color: var(--cyan);
                             background: var(--cyan-dim);
                             box-shadow: 0 0 16px -6px var(--cyan); }
  .status-pill.plays.live  .dot { background: var(--cyan); }
  .status-pill.plays.live  .lbl { color: var(--cyan); }
  .status-pill.plays.done  { color: var(--text-mute); }
  .status-pill.plays.done  .lbl { color: var(--text-mute); }
  .status-pill.plays.muted { color: var(--text-mute); }

  /* Subtle pulse on a live-updated field to make changes visible. */
  @keyframes live-update-flash {
    0%   { background-color: var(--cyan-dim); }
    100% { background-color: transparent; }
  }
  [data-live-field].live-just-updated {
    animation: live-update-flash 0.9s ease-out;
    border-radius: 2px;
  }

  /* Stronger pulse when an intraday factor fires — confluence dot or row
     transitioning from pending → active. */
  @keyframes live-factor-fire {
    0%   { box-shadow: 0 0 0 8px var(--cyan-glow); transform: scale(1.4); }
    100% { box-shadow: 0 0 6px var(--cyan); transform: scale(1); }
  }
  .conf-mini .dd.live-just-fired {
    animation: live-factor-fire 0.9s ease-out;
  }
  .factor-line.live-just-fired {
    animation: live-update-flash 1.2s ease-out;
  }

  /* Card-level glow when a matrix play transitions to ARMED. */
  .play-card.armed {
    box-shadow: 0 0 0 1px var(--cyan), 0 0 24px -4px var(--cyan-glow);
  }
  .play-card.armed .pstate {
    animation: pulse 1.8s ease-in-out infinite;
  }

  /* MISSED — post-open factor failed, threshold unreachable. Card visually
     deflates but stays readable (you might still want to see why it missed). */
  .play-card.missed { opacity: 0.6; }
  .play-card.missed::before { background: var(--text-mute); box-shadow: none; }
  .play-card .pstate.missed {
    color: var(--text-mute); border-color: var(--text-mute);
    background: var(--bg-2);
  }
  /* Dot for a definitively-failed factor — muted red with a tiny ✕ glyph. */
  .conf-mini .dd.missed {
    background: var(--red); border-color: var(--red);
    opacity: 0.35; box-shadow: none; position: relative;
  }
  /* Factor-line in the detail view when its factor failed. */
  .factor-line.missed { opacity: 0.55; }
  .factor-line.missed .marker { color: var(--red); }
  .factor-line.missed .lift   { color: var(--red); text-decoration: line-through; }
  .factor-line.missed .desc   { text-decoration: line-through; color: var(--text-dim); }
  /* Make factor rows safe against long descriptions (e.g. "Prior day close in
     middle 1/3 (no narrative)"). Constrain the desc column to the remaining
     space and wrap there instead of overflowing the panel. */
  .factor-line .desc { min-width: 0; overflow-wrap: anywhere; }
  .factor-line .meta { min-width: 0; overflow-wrap: anywhere; }

  /* ===== Detail State Banner (col 3 hero) =====
     Mirror of the col-2 card state — but bigger and surfaced first so
     the trader sees current state + confluence progress + recommended
     action without scrolling. */
  .detail-state-banner {
    margin: 10px 0 14px;
    padding: 10px 12px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 4px;
    border-left: 3px solid var(--line-2);
    transition: border-color 0.4s ease, background 0.4s ease;
  }
  .detail-state-banner.wait   { border-left-color: var(--text-mute); }
  .detail-state-banner.live   { border-left-color: var(--cyan);
                                background: linear-gradient(90deg, var(--cyan-dim), var(--bg-3) 40%); }
  .detail-state-banner.missed { border-left-color: var(--red);
                                background: linear-gradient(90deg, var(--red-dim), var(--bg-3) 40%);
                                opacity: 0.85; }
  .detail-state-banner.veto   { border-left-color: var(--red);
                                background: linear-gradient(90deg, var(--red-dim), var(--bg-3) 40%); }
  .dsb-top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .dsb-chip {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: 2px; padding: 4px 8px; border-radius: 3px;
    border: 1px solid currentColor;
  }
  .dsb-chip.wait   { color: var(--text-mute); }
  .dsb-chip.live   { color: var(--cyan);  background: var(--cyan-dim);
                     box-shadow: 0 0 10px -2px var(--cyan-glow);
                     animation: pulse 2s ease-in-out infinite; }
  .dsb-chip.missed { color: var(--red);   background: var(--red-dim); }
  .dsb-chip.veto   { color: var(--red);   background: var(--red-dim); }
  .dsb-count {
    font-size: 13px; color: var(--text-dim); letter-spacing: 0.5px;
  }
  .dsb-count b { color: var(--text); font-weight: 700; font-size: 16px; }
  .dsb-count .dim { color: var(--text-mute); }
  .dsb-action {
    font-size: 12px; line-height: 1.4; color: var(--text);
    padding: 6px 8px; background: rgba(0,0,0,0.18); border-radius: 3px;
    border-left: 2px solid var(--line);
  }
  .detail-state-banner.live   .dsb-action { border-left-color: var(--cyan); }
  .detail-state-banner.missed .dsb-action { border-left-color: var(--red); color: var(--text-dim); }
  .detail-state-banner.veto   .dsb-action { border-left-color: var(--red); color: var(--red); font-weight: 600; }
  .detail-state-banner.wait   .dsb-action { color: var(--text-dim); }

  /* Big confluence dots — same visual language as .conf-mini .dd in col 2
     but sized up for detail-pane prominence. */
  .conf-tracker { display: flex; gap: 4px; margin-left: auto; }
  .conf-tracker .dd.big {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--line-2); background: transparent;
  }
  .conf-tracker .dd.big.on {
    background: var(--cyan); border-color: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
  }
  .conf-tracker .dd.big.maybe {
    border-style: dashed; border-color: var(--cyan);
  }
  .conf-tracker .dd.big.missed {
    border-color: var(--red); background: var(--red-dim);
    position: relative;
  }
  .conf-tracker .dd.big.missed::after {
    content: "✕"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 9px; color: var(--red); font-weight: 700;
    line-height: 1;
  }

  /* ===== Execution Guide — actionable checklist ===== */
  .exec-checklist {
    display: flex; flex-direction: column; gap: 8px;
  }
  .ex-row {
    display: grid; grid-template-columns: 28px 1fr;
    gap: 10px; align-items: start;
    padding: 8px 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 3px;
    border-left: 2px solid var(--cyan-dim);
  }
  .ex-num {
    font-size: 14px; font-weight: 700; color: var(--cyan);
    text-align: center;
    background: var(--cyan-dim);
    border: 1px solid var(--cyan);
    border-radius: 50%;
    width: 22px; height: 22px; line-height: 20px;
  }
  .ex-body { min-width: 0; }
  .ex-label {
    font-size: 9px; letter-spacing: 1.5px; font-weight: 700;
    color: var(--cyan); margin-bottom: 3px;
  }
  .ex-text {
    font-size: 12px; line-height: 1.45; color: var(--text);
    overflow-wrap: anywhere; word-break: break-word;
  }
  .pulse::before {
    content: ""; width: 6px; height: 6px;
    border-radius: 50%; background: currentColor;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
    50% { opacity: 0.5; box-shadow: 0 0 0 6px transparent; }
  }

  /* ===== DECISION FLOW (3 cols) ===== */
  .flow {
    position: relative;
    display: grid;
    grid-template-columns: 0.9fr 1fr 1.35fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 1180px) { .flow { grid-template-columns: 1fr; } }
  .flow-col {
    position: relative;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 14px 16px;
  }
  .flow-col::before {
    content: ""; position: absolute; top: 0; left: 12px; right: 12px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-2), transparent);
  }
  .flow-step {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--text-mute); font-weight: 700;
    margin-bottom: 12px;
  }
  .flow-step .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px;
    background: var(--cyan-dim); color: var(--cyan);
    border: 1px solid var(--cyan); border-radius: 2px;
    font-size: 10px; font-weight: 700;
    box-shadow: 0 0 calc(8px * var(--glow)) var(--cyan-dim);
  }
  .flow-step .t { color: var(--cyan); }
  .flow-step::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line) 0%, transparent 80%);
  }
  .flow::before, .flow::after {
    content: "▶";
    position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--cyan); font-family: var(--mono); font-size: 14px;
    background: var(--bg-0); padding: 4px 2px; z-index: 2;
    text-shadow: 0 0 calc(10px * var(--glow)) var(--cyan);
  }
  .flow::before { left: calc(30.5% - 6px); }
  .flow::after  { left: calc(58% - 6px); }
  @media (max-width: 1180px) { .flow::before, .flow::after { display: none; } }

  .cond-headline {
    background: linear-gradient(135deg, var(--cyan-dim), transparent 70%);
    border-left: 2px solid var(--cyan);
    padding: 10px 12px;
    border-radius: 0 3px 3px 0;
    margin-bottom: 10px;
  }
  .cond-headline.bad  { background: linear-gradient(135deg, var(--red-dim), transparent 70%); border-color: var(--red); }
  .cond-headline.warn { background: linear-gradient(135deg, var(--amber-dim), transparent 70%); border-color: var(--amber); }
  .cond-headline.good { background: linear-gradient(135deg, var(--green-dim), transparent 70%); border-color: var(--green); }
  .cond-headline .l {
    font-size: 9px; letter-spacing: 2px; color: var(--text-mute);
    font-family: var(--mono); font-weight: 700; margin-bottom: 4px;
  }
  .cond-headline .v {
    font-family: var(--mono); font-size: 20px; font-weight: 700; line-height: 1;
  }
  .cond-headline.good .v { color: var(--green); }
  .cond-headline.warn .v { color: var(--amber); }
  .cond-headline.bad  .v { color: var(--red); }
  .cond-headline.cool .v { color: var(--cyan); }
  .cond-headline .s {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    margin-top: 5px; letter-spacing: 0.5px;
  }

  .cond-row {
    display: grid; grid-template-columns: 80px 1fr;
    gap: 8px; align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line-soft);
  }
  .cond-row:last-child { border-bottom: 0; }
  .cond-row .l {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text-mute); font-weight: 700;
  }
  .cond-row .v {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--text); text-align: right;
  }
  .cond-row .v.up   { color: var(--green); }
  .cond-row .v.down { color: var(--red); }
  .cond-row .v.warn { color: var(--amber); }
  .cond-row .v.cool { color: var(--cyan); }
  .cond-row .v .sub {
    font-family: var(--mono); font-size: 9px; color: var(--text-mute);
    margin-left: 4px; letter-spacing: 0.3px;
  }

  /* Col 2: time-window sections + unified play list */
  .window-section { margin-bottom: 14px; }
  .window-section:last-child { margin-bottom: 0; }
  .window-header {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--text-mute); font-weight: 700;
    margin-bottom: 6px; padding: 0 2px;
  }
  .window-header .w-bar { width: 4px; height: 10px; background: var(--cyan); border-radius: 1px; box-shadow: 0 0 6px var(--cyan); }
  .window-header .w-count { color: var(--cyan); margin-left: auto; font-size: 9px; }
  .window-header .w-status {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
    color: var(--text-mute); margin-left: 4px;
  }
  .window-header.win-any .w-bar { background: var(--violet); box-shadow: 0 0 6px var(--violet); }
  .window-header.win-any .w-count { color: var(--violet); }

  /* Time-based macro status (set by tickMacroStatus) */
  .window-section.live .window-header .w-bar {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 18px var(--cyan);
    animation: macroPulse 1.6s ease-in-out infinite;
  }
  .window-section.live .window-header .w-status::before {
    content: "● LIVE"; color: var(--cyan); text-shadow: 0 0 6px var(--cyan);
  }
  .window-section.past { opacity: 0.45; }
  .window-section.past .window-header .w-bar { background: var(--text-mute); box-shadow: none; }
  .window-section.past .window-header .w-count { color: var(--text-mute); }
  .window-section.past .window-header .w-status::before { content: "PAST"; }
  .window-section.past .play-card.primary,
  .window-section.past .play-card.selected {
    background: var(--bg-2); box-shadow: none; border-color: var(--line);
  }
  .window-section.past .play-card::before { background: var(--line-2); box-shadow: none; }
  @keyframes macroPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }

  /* Detail-pane empty hint */
  .detail-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 380px; text-align: center;
    color: var(--text-mute); font-family: var(--mono);
    padding: 24px; gap: 14px;
  }
  .detail-empty .icon {
    font-size: 32px; color: var(--cyan); opacity: 0.4;
    text-shadow: 0 0 12px var(--cyan);
  }
  .detail-empty .hint {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim);
  }
  .detail-empty .arrow {
    font-size: 18px; color: var(--cyan); opacity: 0.7;
  }
  .detail-empty .summary {
    font-size: 11px; line-height: 1.7; color: var(--text-dim);
    letter-spacing: 0.3px; max-width: 280px; text-align: left;
    padding-top: 8px; border-top: 1px solid var(--line-soft);
  }
  .detail-empty .summary b { color: var(--cyan); }

  /* Detail header (for selected play) */
  .detail-head {
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line-soft);
  }
  .detail-title {
    font-family: var(--mono); font-size: 22px; font-weight: 700;
    color: var(--text); letter-spacing: 0.5px; line-height: 1.1;
  }
  .detail-sub {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-top: 4px; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .detail-sub .badge-dir { font-size: 9px; padding: 2px 7px; }
  .detail-section { margin-bottom: 14px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 6px;
  }
  .detail-label::before { content: "▸ "; color: var(--cyan); }
  /* "X of N fired" badge that lives inside the INTRADAY CONFLUENCES
     section header. Color reflects how the day stacked up so the
     trader sees the confluence count at a glance. */
  .conf-tally {
    display: inline-block; margin-left: 10px;
    font-size: 9px; letter-spacing: 1px; font-weight: 700;
    padding: 2px 6px; border-radius: 2px;
    border: 1px solid currentColor;
  }
  .conf-tally.all  { color: var(--green); background: var(--green-dim); }
  .conf-tally.some { color: var(--cyan);  background: var(--cyan-dim); }
  .conf-tally.none { color: var(--text-mute); }
  .conf-tally.anti { color: var(--amber); background: var(--amber-dim); }
  .detail-text {
    font-size: 12px; color: var(--text); line-height: 1.6;
    white-space: pre-wrap;
  }
  .detail-text-mute {
    font-size: 11px; color: var(--text-dim); line-height: 1.6;
    white-space: pre-wrap;
  }

  /* Col 2: candidate plays */
  .play-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 12px;
    position: relative;
    margin-bottom: 8px;
    transition: opacity 0.15s;
  }
  .play-card:last-child { margin-bottom: 0; }
  .play-card::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: var(--line-2);
  }
  .play-card.primary,
  .play-card.selected {
    border-color: var(--cyan);
    background: linear-gradient(180deg, var(--cyan-dim), var(--bg-2) 70%);
    box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 22px -8px var(--cyan-glow);
  }
  .play-card.primary::before,
  .play-card.selected::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .play-card.selected .pname::after {
    content: " ◢"; color: var(--cyan); font-size: 9px;
  }
  .play-card.wait::before { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .play-card.veto {
    opacity: 0.42;
    background: var(--bg-2);
  }
  .play-card.veto::before { background: var(--red); }
  .play-card.veto:hover { opacity: 0.9; }
  /* DONE state — window has closed; play is informational only. */
  .play-card.passed { opacity: 0.55; }
  .play-card.passed::before { background: var(--text-mute); box-shadow: none; }
  .play-card.passed:hover { opacity: 0.85; }
  .play-card.passed .conf-mini .dd.on {
    background: var(--text-mute); border-color: var(--text-mute); box-shadow: none;
  }
  .play-card .pstate.passed {
    color: var(--text-mute); border-color: var(--line-2);
    background: var(--bg-2);
  }
  .play-card .ph {
    display: flex; align-items: center; gap: 8px; justify-content: space-between;
  }
  .play-card .pname {
    font-size: 13px; font-weight: 700; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  .play-card .pnum {
    font-family: var(--mono); font-size: 9px;
    color: var(--text-mute); background: var(--bg-3); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 2px; font-weight: 700; letter-spacing: 1px;
  }
  .play-card.primary .pnum { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-dim); }
  .play-card.veto .pnum { color: var(--red); border-color: var(--red); background: var(--red-dim); }
  .play-card .pstate {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
    font-weight: 700; padding: 2px 7px; border-radius: 2px; border: 1px solid;
  }
  .play-card .pstate.live { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-dim); }
  .play-card .pstate.wait { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
  .play-card .pstate.veto { color: var(--red); border-color: var(--red); background: var(--red-dim); }
  .play-card .pbody {
    margin-top: 8px;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  }
  /* Standardized body grid: indicator | meta | stats (right-aligned).
     Fixed-width columns so cards align across matrix + playbook cards. */
  .play-card .pbody-standard {
    display: grid;
    grid-template-columns: 78px 1fr auto;
    gap: 10px; align-items: center;
  }
  .play-card .pbody-standard .pmeta {
    color: var(--text-dim); font-size: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .play-card.veto .pbody-standard .pmeta { color: var(--red); }
  .play-card .pbody-standard .pstats {
    display: grid; grid-template-columns: repeat(3, minmax(46px, auto));
    gap: 8px; margin-left: auto;
  }
  .play-card .pbody-standard .stat-cell {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    text-align: right; white-space: nowrap;
  }
  .play-card .pbody-standard .stat-cell b { color: var(--text); font-weight: 700; }
  .play-card.primary .pbody-standard .stat-cell b,
  .play-card.selected .pbody-standard .stat-cell b { color: var(--cyan); }
  .conf-mini { display: flex; gap: 3px; }
  .conf-mini .dd {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--line-2); background: transparent;
  }
  .conf-mini .dd.on {
    background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 5px var(--cyan);
  }
  .play-card.veto .conf-mini .dd.on {
    background: var(--text-mute); border-color: var(--text-mute); box-shadow: none;
  }
  .conf-mini .dd.maybe { border-style: dashed; border-color: var(--cyan); }
  .play-card .pstats {
    display: flex; gap: 8px; margin-left: auto;
    font-family: var(--mono); font-size: 10px;
  }
  .play-card .pstats b { color: var(--text); font-weight: 700; }
  .play-card.primary .pstats b { color: var(--cyan); }
  .play-card .pveto-line {
    margin-top: 6px;
    font-family: var(--mono); font-size: 10px; color: var(--red);
    letter-spacing: 0.3px;
  }
  .play-card .pveto-line::before { content: "⊘  "; }
  .play-card .pwait-line {
    margin-top: 6px;
    font-family: var(--mono); font-size: 10px; color: var(--amber);
    letter-spacing: 0.3px;
  }
  .play-card .pwait-line::before { content: "◷  "; }

  /* Col 3: execution */
  .exec {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
  }
  .exec-frame {
    position: absolute; inset: -2px; pointer-events: none;
  }
  .exec-frame i {
    position: absolute; width: 14px; height: 14px;
    border-color: var(--cyan); border-style: solid; border-width: 0;
    box-shadow: 0 0 6px var(--cyan-glow);
  }
  .exec.stand .exec-frame i { border-color: var(--red); box-shadow: 0 0 6px var(--red); }
  .exec.wait  .exec-frame i { border-color: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .exec-frame .tl { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
  .exec-frame .tr { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
  .exec-frame .bl { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
  .exec-frame .br { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
  .exec-action {
    font-family: var(--mono); font-size: 34px; font-weight: 700; line-height: 1.05;
    background: linear-gradient(180deg, var(--cyan), var(--cyan-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 0.5px;
  }
  .exec.stand .exec-action { background: linear-gradient(180deg, var(--red), var(--red-deep)); -webkit-background-clip: text; background-clip: text; }
  .exec.wait  .exec-action { background: linear-gradient(180deg, var(--amber), var(--amber-deep)); -webkit-background-clip: text; background-clip: text; }
  .exec-sub {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .exec-summary {
    font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6;
  }
  .exec-summary b { color: var(--text); font-weight: 600; }
  .exec-block { margin-top: 14px; }
  .exec-block .label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 8px;
  }
  .exec-block .label::before { content: "▸ "; color: var(--cyan); }
  .trig-row {
    display: grid; grid-template-columns: 22px 50px 1fr auto;
    gap: 10px; align-items: baseline;
    padding: 6px 0;
    font-size: 12px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .trig-row:last-child { border-bottom: 0; }
  .trig-row .step {
    font-family: var(--mono); font-size: 10px; color: var(--cyan); font-weight: 700;
    background: var(--cyan-dim); border: 1px solid var(--cyan);
    border-radius: 2px; padding: 1px 0; text-align: center;
  }
  .trig-row .time {
    font-family: var(--mono); font-size: 10px; color: var(--cyan);
    padding: 2px 6px; background: var(--cyan-dim);
    border-radius: 2px; text-align: center;
  }
  .trig-row .desc { color: var(--text); }
  .trig-row .lift { font-family: var(--mono); font-size: 10px; color: var(--green); font-weight: 700; }
  .exec-tiles {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    margin-top: 4px;
  }
  .exec-tile {
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 3px; padding: 9px 10px;
  }
  .exec-tile.good { border-color: var(--green); background: linear-gradient(180deg, var(--green-dim), var(--bg-3)); }
  .exec-tile.bad  { border-color: var(--red);   background: linear-gradient(180deg, var(--red-dim), var(--bg-3)); }
  .exec-tile.warn { border-color: var(--amber); background: linear-gradient(180deg, var(--amber-dim), var(--bg-3)); }
  .exec-tile.cool { border-color: var(--cyan);  background: linear-gradient(180deg, var(--cyan-dim), var(--bg-3)); }
  .exec-tile .tl {
    font-size: 8px; letter-spacing: 1.5px; color: var(--text-mute);
    font-family: var(--mono); font-weight: 700;
  }
  .exec-tile .tv {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    color: var(--text); margin-top: 4px; line-height: 1.1;
  }
  .exec-tile.good .tv { color: var(--green); }
  .exec-tile.bad  .tv { color: var(--red); }
  .exec-tile.warn .tv { color: var(--amber); }
  .exec-tile.cool .tv { color: var(--cyan); }

  /* ===== PRIMARY READ HERO (legacy) ===== */
  .primary {
    position: relative;
    padding: 22px 26px;
    background:
      linear-gradient(135deg, var(--primary-shine) 0%, transparent 55%),
      linear-gradient(180deg, var(--primary-bg-top) 0%, var(--primary-bg-bot) 100%);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .primary.go     { box-shadow: inset 0 0 0 1px var(--cyan-dim), 0 0 40px -10px var(--cyan-glow); border-color: var(--cyan); }
  .primary.wait   { box-shadow: inset 0 0 0 1px var(--amber-dim); }
  .primary.stand  { box-shadow: inset 0 0 0 1px var(--red-dim); border-color: var(--stand-border); }
  /* HUD corner brackets */
  .corner {
    position: absolute; width: 16px; height: 16px;
    border-color: var(--cyan); border-style: solid; border-width: 0;
    box-shadow: 0 0 8px var(--cyan-glow);
  }
  .primary.stand .corner { border-color: var(--red); box-shadow: 0 0 8px var(--red); }
  .primary.wait  .corner { border-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .corner.tl { top: 8px; left: 8px;   border-top-width: 2px;  border-left-width: 2px; }
  .corner.tr { top: 8px; right: 8px;  border-top-width: 2px;  border-right-width: 2px; }
  .corner.bl { bottom: 8px; left: 8px;border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 8px; right: 8px;border-bottom-width: 2px;border-right-width: 2px; }
  /* scan line */
  .primary::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.4;
  }
  .primary-grid {
    display: grid;
    grid-template-columns: minmax(280px, 1.2fr) minmax(280px, 1.4fr) minmax(220px, 1fr);
    gap: 28px;
    align-items: stretch;
  }
  @media (max-width: 1100px) { .primary-grid { grid-template-columns: 1fr; gap: 18px; } }

  .pr-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
    color: var(--text-mute); font-weight: 700; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .pr-label::before { content: "▶ "; color: var(--cyan); }

  .pr-action {
    font-family: var(--mono); font-size: 32px; font-weight: 700; line-height: 1.05;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--text), var(--text-grad-end));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .primary.go .pr-action { background: linear-gradient(180deg, var(--cyan), var(--pr-cyan-end)); -webkit-background-clip: text; background-clip: text; }
  .primary.stand .pr-action { background: linear-gradient(180deg, var(--red), var(--red-deep)); -webkit-background-clip: text; background-clip: text; }
  .primary.wait .pr-action { background: linear-gradient(180deg, var(--amber), var(--amber-deep)); -webkit-background-clip: text; background-clip: text; }
  .pr-window {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-top: 4px; letter-spacing: 1px;
  }
  .pr-summary { font-size: 13px; color: var(--text-dim); margin-top: 14px; line-height: 1.65; }
  .pr-summary b { color: var(--text); font-weight: 600; }

  .pr-trigger { padding-left: 6px; }
  .pr-trig-row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 12px;
  }
  .pr-trig-row:last-child { border-bottom: 0; }
  .pr-trig-row .when {
    font-family: var(--mono); font-size: 10px;
    color: var(--cyan); background: var(--cyan-dim);
    padding: 2px 6px; border-radius: 2px; min-width: 44px; text-align: center;
  }
  .pr-trig-row .desc { color: var(--text); flex: 1; }
  .pr-trig-row .lift {
    font-family: var(--mono); font-size: 10px; color: var(--green); font-weight: 600;
  }

  .pr-meta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: 10px;
  }
  .pr-meta-tile {
    background: var(--tile-overlay);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
  }
  .pr-meta-tile .l {
    font-size: 8px; letter-spacing: 1.5px; color: var(--text-mute);
    font-family: var(--mono); font-weight: 600;
  }
  .pr-meta-tile .v {
    font-family: var(--mono); font-size: 13px; font-weight: 600;
    color: var(--text); margin-top: 2px;
  }
  .pr-meta-tile.good .v { color: var(--green); }
  .pr-meta-tile.warn .v { color: var(--amber); }
  .pr-meta-tile.bad  .v { color: var(--red); }
  .pr-meta-tile.cool .v { color: var(--cyan); }

  /* ===== KPI strip ===== */
  .kpi {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
  }
  .kpi::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 2px;
    background: var(--line-2);
  }
  .kpi .k-l {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-mute); margin-bottom: 5px;
    font-family: var(--mono); font-weight: 700;
  }
  .kpi .k-v {
    font-family: var(--mono); font-size: 18px; font-weight: 700; line-height: 1.05;
    color: var(--text);
  }
  .kpi .k-s {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .kpi.up   { background: linear-gradient(135deg, var(--green-dim), var(--bg-1) 60%); }
  .kpi.up::before   { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .kpi.up .k-v   { color: var(--green); }
  .kpi.down { background: linear-gradient(135deg, var(--red-dim), var(--bg-1) 60%); }
  .kpi.down::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .kpi.down .k-v { color: var(--red); }
  .kpi.warn { background: linear-gradient(135deg, var(--amber-dim), var(--bg-1) 60%); }
  .kpi.warn::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .kpi.warn .k-v { color: var(--amber); }
  .kpi.cool::before { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  /* ===== Section header ===== */
  .section-h {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text-dim); font-weight: 700;
    margin: 22px 0 10px;
  }
  .section-h::before {
    content: ""; width: 12px; height: 1px; background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan); flex-shrink: 0;
  }
  .section-h::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line) 0%, transparent 80%);
  }
  .section-h .count {
    font-family: var(--mono); color: var(--cyan);
    padding: 2px 7px; background: var(--cyan-dim);
    border-radius: 2px; letter-spacing: 1.5px; font-size: 10px;
  }

  /* ===== Playbook chip strip ===== */
  .playbook-strip {
    display: flex; gap: 8px; padding: 8px 0;
    margin-bottom: 14px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
  }
  .playbook-strip::-webkit-scrollbar { height: 6px; }
  .playbook-strip::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  .playbook-strip::-webkit-scrollbar-track { background: transparent; }
  .pb-chip {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 12px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    min-width: 180px;
    position: relative;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .pb-chip:hover { background: var(--bg-2); border-color: var(--line-2); }
  .pb-chip::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 2px;
    background: var(--line-2); border-radius: 2px 0 0 2px;
  }
  .pb-chip.long::before  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .pb-chip.short::before { background: var(--red);   box-shadow: 0 0 6px var(--red); }
  .pb-chip.both::before  { background: var(--cyan);  box-shadow: 0 0 6px var(--cyan); }
  .pb-chip .pb-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    letter-spacing: 0.2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pb-chip .pb-stats {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10px;
  }
  .pb-chip .pb-stats .wr { color: var(--text-dim); }
  .pb-chip .pb-stats .wr b { color: var(--text); font-weight: 700; }
  .pb-chip .pb-stats .n  { color: var(--text-mute); }
  .pb-chip .pb-dir {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px;
    font-weight: 700; padding: 1px 5px; border-radius: 2px;
  }
  .pb-chip.long  .pb-dir { color: var(--green); background: var(--green-dim); }
  .pb-chip.short .pb-dir { color: var(--red);   background: var(--red-dim); }
  .pb-chip.both  .pb-dir { color: var(--cyan);  background: var(--cyan-dim); }
  .pb-status {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1px;
    padding: 1px 5px; border-radius: 2px; margin-left: auto;
    border: 1px solid;
  }
  .pb-status.verified    { color: var(--green); border-color: var(--green); background: var(--green-dim); }
  .pb-status.backtesting { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
  .pb-status.idea        { color: var(--text-dim); border-color: var(--line-2); background: var(--bg-2); }
  .pb-status.under_review{ color: var(--violet); border-color: var(--violet); background: var(--violet-dim); }
  .pb-status.rejected    { color: var(--red); border-color: var(--red); background: var(--red-dim); opacity: 0.6; }

  /* Backtesting plays in col-2 — distinct visual so trader instantly
     knows "engine is watching, do NOT put real risk on yet." Dashed
     amber border + smaller MONITOR pip next to the play name. */
  .play-card.monitor {
    border-style: dashed;
    border-color: var(--amber);
    background: linear-gradient(180deg,
      rgba(245, 158, 11, 0.04) 0%, transparent 60%);
  }
  .play-card.monitor:hover {
    border-color: var(--amber);
    background: linear-gradient(180deg,
      rgba(245, 158, 11, 0.08) 0%, transparent 60%);
  }
  .monitor-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 0 5px;
    font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--amber); background: var(--amber-dim);
    border: 1px solid var(--amber); border-radius: 2px;
    vertical-align: 1px;
  }
  .pb-strip-h {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--text-mute); font-weight: 700;
    margin: 18px 0 4px;
  }
  .pb-strip-h::before {
    content: "▸"; color: var(--cyan); text-shadow: 0 0 8px var(--cyan);
  }
  .pb-strip-h .source {
    font-family: var(--mono); font-size: 9px; color: var(--text-mute);
    letter-spacing: 1px;
  }

  /* ===== Collapsible details/summary cards ===== */
  details.card { padding: 0; }
  details.card > summary {
    cursor: pointer;
    list-style: none;
    padding: 12px 16px;
    margin: 0;
    border-bottom: 1px solid transparent;
    user-select: none;
    transition: background 0.12s;
  }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after {
    content: "▾";
    font-family: var(--mono); color: var(--text-mute);
    margin-left: 8px; font-size: 11px;
    transition: transform 0.18s;
    display: inline-block;
  }
  details.card[open] > summary::after { transform: rotate(180deg); color: var(--cyan); }
  details.card[open] > summary { border-bottom-color: var(--line-soft); }
  details.card > summary:hover { background: var(--card-hover); }
  details.card > summary .card-h {
    margin-bottom: 0; padding: 0; border: 0;
  }
  details.card > *:not(summary) {
    padding: 14px 16px;
  }
  details.card > .narrative,
  details.card > .narrative-empty {
    margin: 0 16px 14px;
    padding: 9px 12px;
  }
  details.card .summary-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex: 1;
  }

  /* Play card expansion */
  .play-card { cursor: pointer; }
  .play-card.veto { cursor: default; }
  .play-detail {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line-soft);
    display: none;
  }
  .play-card.expanded .play-detail { display: block; }
  .play-card.expanded {
    background: linear-gradient(180deg, var(--cyan-dim), var(--bg-2) 80%);
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 24px -8px var(--cyan-glow);
  }
  .play-detail .pd-section {
    margin-top: 10px;
  }
  .play-detail .pd-section:first-child { margin-top: 0; }
  .play-detail .pd-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 5px;
  }
  .play-detail .pd-fline {
    display: grid; grid-template-columns: 16px 50px 1fr;
    gap: 8px; align-items: baseline;
    padding: 4px 0;
    font-size: 11px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .play-detail .pd-fline:last-child { border-bottom: 0; }
  .play-detail .pd-fline .m { font-family: var(--mono); color: var(--green); }
  .play-detail .pd-fline .l { font-family: var(--mono); color: var(--green); font-weight: 600; }
  .play-detail .pd-fline.pend .m { color: var(--text-mute); }
  .play-detail .pd-fline.pend .l { color: var(--text-dim); }
  .play-detail .pd-fline .desc { color: var(--text); }
  .play-detail .pd-fline .when {
    font-family: var(--mono); font-size: 9px;
    color: var(--cyan); background: var(--cyan-dim);
    padding: 0 4px; border-radius: 2px;
    margin-right: 4px;
  }
  .play-detail .pd-exp {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    line-height: 1.6; padding: 8px 10px; background: var(--bg-3); border-radius: 3px;
  }
  .play-detail .pd-exp b { color: var(--text); font-weight: 700; }
  .play-detail .pd-narr {
    margin-top: 10px;
    padding: 9px 11px;
    background: linear-gradient(90deg, var(--violet-dim), transparent 80%);
    border-left: 2px solid var(--violet);
    border-radius: 0 3px 3px 0;
    font-size: 11px;
    color: var(--violet-text);
    line-height: 1.55;
  }
  .play-detail .pd-narr::before {
    content: "AI"; display: inline-block;
    font-size: 8px; font-family: var(--mono); font-weight: 700;
    letter-spacing: 1.5px; color: var(--violet);
    padding: 1px 4px; border: 1px solid var(--violet);
    border-radius: 2px; margin-right: 6px; vertical-align: middle;
  }
  .play-detail .pd-narr b { color: var(--violet); font-weight: 600; }
  .play-card.expanded .pname::after {
    content: " ◢";
    color: var(--cyan); font-size: 10px;
  }
  .pd-hint {
    font-family: var(--mono); font-size: 9px; color: var(--text-mute);
    letter-spacing: 1px; margin-top: 4px;
  }

  /* ===== Card ===== */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    position: relative;
  }
  .card.dense { padding: 10px 12px; }
  .card-h {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
  }
  .card-t {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text-dim); font-weight: 700;
  }
  .card-t::before { content: "▌ "; color: var(--cyan); }

  /* ===== Narrative callout ===== */
  .narrative {
    margin-top: 12px;
    padding: 10px 12px;
    background: linear-gradient(90deg, var(--violet-dim), transparent 80%);
    border-left: 2px solid var(--violet);
    border-radius: 0 3px 3px 0;
    font-size: 12px;
    color: var(--violet-text);
    line-height: 1.6;
  }
  .narrative::before {
    content: "AI"; display: inline-block;
    font-size: 8px; font-family: var(--mono); font-weight: 700;
    letter-spacing: 1.5px; color: var(--violet);
    padding: 1px 5px; border: 1px solid var(--violet);
    border-radius: 2px; margin-right: 8px;
    vertical-align: middle;
  }
  .narrative b { color: var(--violet); font-weight: 600; }
  .narrative-empty {
    margin-top: 10px; padding: 6px 10px;
    border-left: 2px dashed var(--line-2);
    color: var(--text-mute); font-size: 10px; font-style: italic; letter-spacing: 0.3px;
  }
  /* When the narrative was regenerated mid-session, the `.narrative` block
     gets a structured header instead of the static ::before AI tag. We
     hide the ::before in that case so it doesn't double up. */
  .narrative[data-narr-generated]::before { display: none; }
  .narr-tag {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
    font-family: var(--mono);
  }
  .narr-pulse {
    font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--violet);
    padding: 1px 6px; border: 1px solid var(--violet);
    border-radius: 2px;
    background: var(--violet-dim);
    animation: pulse 2s ease-in-out infinite;
  }
  .narr-trigger {
    font-size: 9px; letter-spacing: 1px; color: var(--violet);
    font-weight: 600;
  }
  .narr-age {
    margin-left: auto;
    font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px;
  }
  .narr-body { /* inherits .narrative typography */ }
  /* Brief glow when a narrative is freshly applied so the eye catches it. */
  .narrative-just-updated {
    animation: narr-flash 0.6s ease-out 0s 4;
  }
  @keyframes narr-flash {
    0%   { box-shadow: 0 0 0 0 var(--violet); background-position: 0% 50%; }
    50%  { box-shadow: 0 0 16px -2px var(--violet); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* ===== Chips ===== */
  .chip {
    display: inline-flex; align-items: center;
    padding: 3px 8px;
    border-radius: 2px;
    font-size: 10px; line-height: 1.4;
    margin: 2px 3px 2px 0;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text-dim);
    font-family: var(--mono);
    white-space: nowrap;
    letter-spacing: 0.4px;
  }
  .chip.on  { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .chip.off { background: var(--bg-2); border-color: var(--line); color: var(--text-mute); }
  .chip.unk { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .chip.veto{ background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .chip.dim { color: var(--text-dim); }

  /* ===== Matrix play card ===== */
  .play {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .play + .play { margin-top: 10px; }
  .play.active {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 28px -10px var(--cyan-glow);
  }
  .play.veto {
    border-color: var(--veto-border);
    background: linear-gradient(180deg, var(--veto-bg-top), var(--bg-1));
  }
  .play::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: var(--line-2);
  }
  .play.veto::before { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .play.active::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .play.skip::before { background: var(--text-mute); }

  .play-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .play-id { display: flex; align-items: center; gap: 12px; }
  .play-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--text-mute); background: var(--bg-3); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 2px; font-weight: 700;
  }
  .play.active .play-tag { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-dim); }
  .play.veto   .play-tag { color: var(--red);  border-color: var(--red);  background: var(--red-dim); }
  .play-name { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
  .play-window { font-family: var(--mono); font-size: 11px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 8px; }
  .badge-dir {
    padding: 3px 8px; border-radius: 2px; font-size: 9px;
    text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;
    font-family: var(--mono);
  }
  .badge-dir.long  { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
  .badge-dir.short { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }
  .badge-dir.both  { background: var(--cyan-dim);  color: var(--cyan);  border: 1px solid var(--cyan); }

  /* Stat tiles */
  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-bottom: 12px;
  }
  .stat-tile {
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
    text-align: left;
  }
  .stat-tile .t-l {
    font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mute); font-weight: 700; font-family: var(--mono);
  }
  .stat-tile .t-v {
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    margin-top: 3px; color: var(--text);
  }
  .stat-tile.good .t-v { color: var(--green); }
  .stat-tile.bad  .t-v { color: var(--red); }
  .stat-tile.warn .t-v { color: var(--amber); }
  .stat-tile.cool .t-v { color: var(--cyan); }

  /* Confluence dots */
  .conf-dots {
    display: flex; align-items: center; gap: 5px; margin-bottom: 10px;
    font-family: var(--mono); font-size: 11px;
  }
  .conf-dots .d {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid var(--line-2); background: transparent;
    flex-shrink: 0;
  }
  .conf-dots .d.on { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .conf-dots .d.maybe { background: transparent; border-color: var(--cyan); border-style: dashed; }
  .conf-dots .l { color: var(--text-dim); margin-left: 8px; letter-spacing: 0.5px; }
  .conf-dots .l b { color: var(--text); }

  .factor-line {
    display: grid;
    grid-template-columns: 16px 50px 1fr 95px;
    gap: 8px; align-items: baseline;
    padding: 4px 0;
    font-size: 12px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .factor-line:last-child { border-bottom: 0; }
  .factor-line.pending { opacity: 0.75; }
  .factor-line .marker { font-family: var(--mono); font-size: 11px; }
  .factor-line.on .marker { color: var(--green); }
  .factor-line.pending .marker { color: var(--text-mute); }
  .factor-line.veto .marker { color: var(--red); }
  .factor-line .lift {
    font-family: var(--mono); font-size: 11px;
    color: var(--green); font-weight: 600;
  }
  .factor-line.pending .lift { color: var(--text-dim); }
  .factor-line.veto .lift { color: var(--red); }
  .factor-line .desc { color: var(--text); }
  .factor-line.veto .desc { color: var(--red); }
  .factor-line .meta {
    font-family: var(--mono); font-size: 10px; color: var(--text-mute); text-align: right;
  }
  .factor-line .meta .when {
    color: var(--cyan); padding: 1px 5px; border: 1px solid var(--cyan-dim);
    border-radius: 2px; margin-right: 4px;
  }

  .projection-strip {
    display: flex; gap: 6px; margin: 12px 0 0;
  }
  .proj-card {
    flex: 1;
    min-width: 0;                    /* prevent flex-item from overflowing */
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 9px 11px;
    position: relative;
    overflow-wrap: anywhere;         /* wrap long tokens like (n=1) */
    word-break: break-word;
  }
  .proj-card.active {
    border-color: var(--cyan);
    background: linear-gradient(180deg, var(--cyan-dim), var(--bg-3));
    box-shadow: 0 0 12px -4px var(--cyan-glow);
  }
  .proj-card.veto.active {
    border-color: var(--red);
    background: linear-gradient(180deg, var(--red-dim), var(--bg-3));
    box-shadow: 0 0 12px -4px var(--red);
  }
  .proj-card .pl {
    font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mute); font-weight: 700; font-family: var(--mono);
  }
  .proj-card .pa { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .proj-card .pn { font-size: 10px; color: var(--text-dim); margin-top: 3px; font-family: var(--mono); }
  .proj-card.skip .pa { color: var(--text-mute); }
  .proj-card.take .pa { color: var(--green); }
  .proj-card.veto .pa { color: var(--red); }

  .extra-note {
    margin-top: 10px; padding: 7px 10px;
    background: var(--amber-dim); border-left: 2px solid var(--amber);
    border-radius: 0 3px 3px 0; color: var(--amber-text); font-size: 11px; line-height: 1.5;
  }

  /* ===== Edges ===== */
  .edge-list { display: flex; flex-direction: column; gap: 6px; }
  .edge {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 3px;
    padding: 9px 11px;
    position: relative;
  }
  .edge.armed {
    border-color: var(--green);
    background: linear-gradient(90deg, var(--green-dim) 0%, var(--bg-2) 60%);
    box-shadow: 0 0 16px -8px var(--green);
  }
  .edge-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: 12px;
  }
  .edge-head .stars { color: var(--amber); letter-spacing: 1px; }
  .edge-head .stats {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    display: flex; gap: 10px;
  }
  .edge-head .stats b { color: var(--text); font-weight: 600; }
  .edge-factors { font-family: var(--mono); font-size: 12px; color: var(--text); margin-top: 4px; }
  .edge-confirm {
    margin-top: 6px; font-size: 10px; display: flex; gap: 10px; flex-wrap: wrap;
    color: var(--text-mute);
  }

  /* ===== Range Briefing ===== */
  .range-card { display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; }
  .range-head {
    display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
  }
  .range-quintile {
    font-family: var(--mono); font-size: 42px; font-weight: 700; line-height: 1;
    padding: 8px 14px; border-radius: 4px;
    border: 1px solid var(--line-2); background: var(--bg-2);
    color: var(--text-dim); min-width: 70px; text-align: center;
  }
  .range-quintile.good { color: var(--green); border-color: var(--green); background: var(--green-dim); text-shadow: 0 0 12px var(--green); }
  .range-quintile.cool { color: var(--cyan);  border-color: var(--cyan);  background: var(--cyan-dim); text-shadow: 0 0 12px var(--cyan-glow); }
  .range-quintile.warn { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); text-shadow: 0 0 12px var(--amber); }
  .range-quintile.bad  { color: var(--red);   border-color: var(--red);   background: var(--red-dim);  text-shadow: 0 0 12px var(--red); }
  .range-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .range-pts {
    font-size: 28px; font-weight: 700; color: var(--text); line-height: 1;
  }
  .range-pts .unit {
    font-size: 12px; color: var(--text-dim); margin-left: 6px;
    font-weight: 600; letter-spacing: 1px;
  }
  .range-ci {
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px;
  }
  /* Plain-English Q meaning under the points number — tells the user
     what Q4/Q5/etc means in practical terms (WIDE / STANDARD / SKIP
     + the historical PF stat). Color tracks the tier (good/cool/warn/bad). */
  .range-meaning {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    margin-top: 1px;
  }
  .range-meaning.good { color: var(--green); }
  .range-meaning.cool { color: var(--cyan); }
  .range-meaning.warn { color: var(--amber); }
  .range-meaning.bad  { color: var(--red); }
  /* Sub-label rendered under EVOLVING FORECAST etc. — one-liner that
     explains what the section is showing. Tighter than .narrative. */
  .r-sublabel {
    font-size: 10px; letter-spacing: 0.3px;
    line-height: 1.45;
    margin: -2px 0 8px;
    color: var(--text-mute);
  }
  /* Hero badge — tags the big number with its provenance so the user
     can instantly tell prediction from reality. Three states:
       .forecast — pre-open, cold-start model output
       .live     — session in progress, OR still building
       .locked   — 45-min OR has closed, value is final */
  .hero-badge {
    display: inline-block; margin-left: 10px;
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: 1.5px; padding: 2px 6px; border-radius: 2px;
    vertical-align: middle; line-height: 1.2;
    border: 1px solid currentColor;
  }
  .hero-badge.forecast { color: var(--cyan); background: var(--cyan-dim); }
  .hero-badge.live     { color: var(--cyan); background: var(--cyan-dim);
                         box-shadow: 0 0 12px -2px var(--cyan-glow);
                         animation: pulse 2s ease-in-out infinite; }
  .hero-badge.locked   { color: var(--green); background: var(--green-dim); }
  .hero-header { transition: color 0.4s ease; }

  /* Q-bar highlights in ACTUAL mode — solid border ring + extra glow so
     it visibly differs from the cold-start forecast highlight. */
  .q-seg.actual-live { outline: 2px solid white; outline-offset: 1px; }
  .q-seg.actual-locked { outline: 2px solid white; outline-offset: 1px;
                         box-shadow: 0 0 18px currentColor, 0 0 4px white inset; }

  .q-bar {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  }
  .q-seg {
    height: 10px; border-radius: 2px; background: var(--bg-3);
    border: 1px solid var(--line);
  }
  .q-seg.q1.on { background: var(--red);   box-shadow: 0 0 10px var(--red);   border-color: var(--red); }
  .q-seg.q2.on { background: var(--amber); box-shadow: 0 0 10px var(--amber); border-color: var(--amber); }
  .q-seg.q3.on { background: var(--cyan);  box-shadow: 0 0 10px var(--cyan);  border-color: var(--cyan); }
  .q-seg.q4.on { background: var(--green); box-shadow: 0 0 10px var(--green); border-color: var(--green); }
  .q-seg.q5.on { background: var(--green); box-shadow: 0 0 14px var(--green), 0 0 24px var(--green); border-color: var(--green); }
  .q-labels {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    font-family: var(--mono); font-size: 9px; color: var(--text-mute);
    text-align: center; letter-spacing: 1px;
  }
  .q-legend {
    display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 4px;
    font-size: 8px; color: var(--text-mute); letter-spacing: 1.5px;
    margin-top: -4px;
  }
  .q-legend .lbad { color: var(--red);   text-align: left; }
  .q-legend .lneutral { color: var(--cyan); text-align: center; }
  .q-legend .lgood { color: var(--green); text-align: right; }

  .range-action {
    padding: 10px 12px; border-radius: 4px;
    background: var(--bg-2); border-left: 3px solid var(--line-2);
  }
  .range-action.good { background: var(--green-dim); border-left-color: var(--green); }
  .range-action.cool { background: var(--cyan-dim);  border-left-color: var(--cyan); }
  .range-action.warn { background: var(--amber-dim); border-left-color: var(--amber); }
  .range-action.bad  { background: var(--red-dim);   border-left-color: var(--red); }
  .range-action .r-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 4px;
  }
  .range-action .r-text {
    font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4;
  }
  .range-action.good .r-text { color: var(--green); }
  .range-action.cool .r-text { color: var(--cyan); }
  .range-action.warn .r-text { color: var(--amber); }
  .range-action.bad  .r-text { color: var(--red); }

  .range-intel { padding: 0; }
  .range-intel .r-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .range-intel .r-label::before { content: "▸ "; color: var(--cyan); }
  .range-intel .r-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1px;
    color: var(--green); padding: 1px 5px; border: 1px solid var(--green);
    border-radius: 2px; background: var(--green-dim);
    margin-left: auto;
  }
  .range-intel .r-title {
    font-size: 12px; color: var(--text); font-weight: 600;
    margin-bottom: 8px; line-height: 1.4;
  }
  .r-bullets { display: flex; flex-direction: column; gap: 4px; }
  .r-bullet {
    display: grid; grid-template-columns: 56px 92px 1fr;
    gap: 8px; align-items: baseline;
    padding: 6px 10px;
    border-left: 2px solid var(--line-2);
    background: rgba(255,255,255,0.01);
    font-size: 11px;
  }
  .r-bullet.upsize    { border-left-color: var(--green); background: var(--green-dim); }
  .r-bullet.standard  { border-left-color: var(--cyan);  background: var(--cyan-dim);  }
  .r-bullet.skip      { border-left-color: var(--red);   background: var(--red-dim);   }
  .r-bullet .r-q { font-weight: 700; letter-spacing: 1px; }
  .r-bullet.upsize    .r-q { color: var(--green); }
  .r-bullet.standard  .r-q { color: var(--cyan); }
  .r-bullet.skip      .r-q { color: var(--red); }
  .r-bullet .r-r { color: var(--text-dim); font-size: 10px; }
  .r-bullet .r-s { color: var(--text); font-size: 11px; line-height: 1.4; }

  .range-drivers .r-label,
  .range-velocity .r-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .range-drivers .r-label::before,
  .range-velocity .r-label::before { content: "▸ "; color: var(--cyan); }
  .range-velocity .r-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1px;
    color: var(--violet); padding: 1px 5px; border: 1px solid var(--violet);
    border-radius: 2px; background: var(--violet-dim);
    margin-left: auto;
  }
  .r-driver {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 10px; align-items: baseline;
    padding: 4px 0;
    font-size: 11px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .r-driver:last-child { border-bottom: 0; }
  .r-driver .r-d-name { color: var(--text); font-size: 11px; }
  .r-driver .r-d-z { color: var(--text-dim); font-size: 10px; }
  .r-driver.up .r-d-pts { color: var(--green); font-weight: 700; }
  .r-driver.down .r-d-pts { color: var(--red); font-weight: 700; }
  .r-velocity-text {
    font-size: 11px; color: var(--text-dim); line-height: 1.7;
    padding: 8px 10px; background: var(--bg-2); border-radius: 3px;
    border-left: 2px solid var(--violet);
  }
  .r-v-good    { color: var(--green); font-weight: 700; }
  .r-v-bad     { color: var(--red); font-weight: 700; }
  .r-v-neutral { color: var(--amber); font-weight: 700; }

  /* ===== Live OR Progress (rendered inside Range Briefing during session) ===== */
  .range-or-live { /* placeholder, hidden until live data fills it */ }
  .or-live-card {
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--cyan-dim), transparent 70%);
    border: 1px solid var(--cyan);
    border-radius: 4px;
    box-shadow: 0 0 24px -8px var(--cyan-glow);
  }
  .or-live-card .r-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--cyan); font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .or-live-card .r-label::before { content: "● "; color: var(--cyan); animation: pulse 2s ease-in-out infinite; }
  .or-live-card .r-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1px;
    color: var(--green); padding: 1px 5px; border: 1px solid var(--green);
    border-radius: 2px; background: var(--green-dim);
    margin-left: auto;
  }
  .or-live-card.locked .r-tag {
    color: var(--text-dim); border-color: var(--text-dim); background: transparent;
  }
  .or-live-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin-bottom: 10px;
  }
  .or-live-stat {
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 8px;
  }
  .or-live-stat .lbl {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px;
    color: var(--text-mute); font-weight: 700;
  }
  .or-live-stat .val {
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    color: var(--text); margin-top: 3px;
  }
  .or-live-stat.width .val { color: var(--cyan); }
  .or-time-bar {
    height: 4px; background: var(--bg-3); border-radius: 2px;
    overflow: hidden; margin-bottom: 4px;
  }
  .or-time-bar > i {
    display: block; height: 100%; background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    transition: width 0.6s ease-out;
  }
  .or-time-label {
    font-family: var(--mono); font-size: 9px; color: var(--text-dim);
    letter-spacing: 0.5px; text-align: right; margin-bottom: 10px;
  }
  .or-live-verdict {
    font-size: 11px; color: var(--text-dim); line-height: 1.6;
    padding: 8px 10px; background: var(--bg-3); border-radius: 3px;
    border-left: 2px solid;
  }
  .or-live-verdict.good { border-color: var(--green); }
  .or-live-verdict.cool { border-color: var(--cyan); }
  .or-live-verdict.warn { border-color: var(--amber); }
  .or-live-verdict.bad  { border-color: var(--red); }
  .or-live-verdict b { font-weight: 700; }
  .or-live-verdict.good b { color: var(--green); }
  .or-live-verdict.cool b { color: var(--cyan); }
  .or-live-verdict.warn b { color: var(--amber); }
  .or-live-verdict.bad  b { color: var(--red); }

  /* ===== Evolving Forecast (stepwise OR trajectory) ===== */
  /* Renders a 4-row table between the static quintile bar and the live-OR
     section. Each row represents a refinement step: cold → 5m → 15m → final.
     States: waiting (faded), live (cyan glow), locked (solid). */
  .evolving-forecast {
    margin: 10px 0 0;
    padding: 10px 12px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .evolving-forecast .r-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--text-mute); font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .evolving-forecast .r-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 1px;
    color: var(--text-dim); padding: 1px 5px;
    border: 1px solid var(--line); border-radius: 2px;
    margin-left: auto;
  }
  .ef-rows {
    display: flex; flex-direction: column; gap: 4px;
  }
  .ef-row {
    display: grid;
    grid-template-columns: 145px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
