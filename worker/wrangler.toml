# Cloudflare Worker config — NQ live snapshot middleware.
#
# Deploy from this directory:
#   npm install
#   npx wrangler login                         # one-time browser auth
#   npx wrangler kv namespace create SNAPSHOT_KV  # one-time — copy the ID into this file
#   npx wrangler secret put DATABENTO_API_KEY  # paste your key when prompted
#   npx wrangler deploy
#
# Local dev:
#   npx wrangler dev   → starts a local worker at http://localhost:8787
#   curl http://localhost:8787/api/live
#
# Tail live logs:
#   npx wrangler tail
name = "nq-live-snapshot"
main = "src/index.js"
compatibility_date = "2026-05-01"

# --- Cron triggers ---
# Every minute, weekdays, 10:00–15:59 UTC.
# Covers 6:00–11:59 AM ET during DST and 5:00–10:59 AM ET during standard time —
# i.e. the entire pre-open + opening-range window with margin on either side.
# ~360 invocations/day, well within free-tier limits (100k/day).
[triggers]
crons = ["* 10-15 * * 1-5"]

# --- KV namespace binding ---
# After running `wrangler kv namespace create SNAPSHOT_KV`, paste the returned
# id below. The preview_id is used during `wrangler dev`.
[[kv_namespaces]]
binding = "SNAPSHOT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"  # optional

# --- Observability ---
[observability]
enabled = true

[observability.logs]
enabled = true
