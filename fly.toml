# Fly.io app config — NQ Live Snapshot service.
#
# Single shared-cpu-1x VM (256MB RAM), always-on (auto_stop_machines = "off")
# so the Databento Live connection stays alive between dashboard polls.
#
# Free tier covers 3× shared-cpu-1x at 256MB. We use 1.
# `fly launch` will replace this `app` value with a unique name on first deploy
# if there's a collision. Adjust if you prefer a different region.

app = "nq-live-snapshot"
primary_region = "iad"  # US East — close to Databento's NY infra + GitHub Pages

[build]
  # Dockerfile lives in flyio/ but the build CONTEXT is the repo root so
  # we can COPY the fvgc/ package (sibling of flyio/) into the image.
  # Without this, the FVGC engine can't be imported and intra-session
  # signal detection would have to duplicate engine code.
  dockerfile = "flyio/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # IMPORTANT: do NOT auto-stop. The Databento Live connection has to stay
  # open continuously, and we want sub-second freshness when the dashboard
  # polls. Auto-stop would idle the machine and drop the subscription.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[services]]
  internal_port = 8080
  protocol = "tcp"
