            h('span', {class:'marker'}, '⊘'),
            h('span', {class:'lift'}, ''),
            h('span', {class:'desc'}, desc),
            h('span', {class:'meta'}, id)));
        });
        wrap.appendChild(sec);
      }

      // ----- EXIT STRATEGY — structured exit rules -----
      const es = p.exit_strategy || {};
      if (Object.keys(es).length) {
        const sec = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'EXIT STRATEGY'));
        const labels = {
          always: 'ALWAYS',
          primary_target: 'PRIMARY',
          aggressive_target: 'AGGRESSIVE',
          scale_out_alt: 'SCALE-OUT',
        };
        ['always','primary_target','aggressive_target','scale_out_alt'].forEach(k => {
          if (!es[k]) return;
          sec.appendChild(h('div', {class:'factor-line on'},
            h('span', {class:'marker mono', style:'min-width:70px;font-size:9px;letter-spacing:1px;'},
              labels[k] || k),
            h('span', {class:'lift'}, ''),
            h('span', {class:'desc'}, es[k])));
        });
        wrap.appendChild(sec);
      }

      if (p.action_plan) {
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'INTRADAY + EXIT (notes)'),
          h('div', {class:'detail-text'}, p.action_plan)));
      }

      if (p.notion_url) {
        wrap.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
      }
      return wrap;
    }

    // ====== Legacy renderers (kept but unused by new layout) ======

    function renderCandidates(mp, primary) {
      const col = h('div', {class:'flow-col'});
      col.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '2'),
        h('span', {class:'t'}, 'PLAY'),
        h('span', null, 'CANDIDATES')));

      if (!mp.length) {
        col.appendChild(h('div', {class:'empty'}, 'No matrix plays configured.'));
        return col;
      }

      const primaryName = primary?.play?.name;

      // Sort: primary first, then non-vetoed, then vetoed
      const sorted = mp.slice().sort((a, b) => {
        if (a.name === primaryName) return -1;
        if (b.name === primaryName) return 1;
        if (a.veto_active && !b.veto_active) return 1;
        if (b.veto_active && !a.veto_active) return -1;
        return 0;
      });

      sorted.forEach((p, idx) => {
        col.appendChild(renderPlayCard(p, idx, p.name === primaryName));
      });

      return col;
    }

    function renderPlayCard(p, idx, isPrimary) {
      const isVeto = !!p.veto_active;
      const proj = p.projection || {};
      const maxAction = (proj.max_tier?.action || '').toUpperCase();
      const isTakeable = !isVeto && maxAction.includes('TAKE');

      let stateClass, stateLabel;
      if (isVeto) { stateClass = 'veto'; stateLabel = 'VETO'; }
      else if (isPrimary) { stateClass = 'live'; stateLabel = 'PRIMARY'; }
      else if (isTakeable) { stateClass = 'live'; stateLabel = 'LIVE'; }
      else { stateClass = 'wait'; stateLabel = 'WAIT'; }

      const cardCls = 'play-card ' + (isPrimary ? 'primary' : isVeto ? 'veto' : isTakeable ? '' : 'wait');

      const dots = [];
      for (let i = 0; i < p.max_preopen; i++) {
        dots.push(h('div', {class: 'dd' + (i < p.preopen_count ? ' on' : '')}));
      }
      for (let i = 0; i < (p.post_pending || []).length; i++) {
        dots.push(h('div', {class:'dd maybe'}));
      }

      const noteMax = proj.max_tier?.note || '';
      const wrMatch = noteMax.match(/~?(\d+(?:[-–]\d+)?)\s*%\s*WR/i);
      const pfMatch = noteMax.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);

      const card = h('div', {class: cardCls});

      card.appendChild(h('div', {class:'ph'},
        h('div', {class:'pname'},
          h('span', {class:'pnum'}, String(idx + 1).padStart(2, '0')),
          h('span', null, p.name),
          h('span', {class: 'badge-dir ' + p.direction, style:'font-size:8px;'}, p.direction.toUpperCase())),
        h('span', {class: 'pstate ' + stateClass}, stateLabel)));

      if (isVeto) {
        const reasons = (p.active_vetoes || []).map(v => v.id).join(', ') || 'veto';
        card.appendChild(h('div', {class:'pveto-line'}, reasons + ' · skip regardless'));
        return card;
      }

      card.appendChild(h('div', {class:'pbody'},
        h('div', {class:'conf-mini'}, dots),
        h('span', null,
          `${p.preopen_count}/${p.max_preopen} confluence`,
          (p.post_pending || []).length ? ` · +${p.post_pending.length}` : ''),
        h('div', {class:'pstats'},
          wrMatch ? h('span', null, 'WR ', h('b', null, wrMatch[1] + '%')) : null,
          pfMatch ? h('span', null, 'PF ', h('b', null, pfMatch[1])) : null),
        h('span', {class:'pwin'}, p.window)));

      if (!isTakeable && !isPrimary) {
        card.appendChild(h('div', {class:'pwait-line'}, `Need ${proj.max_count}+ confluence to unlock`));
      }

      // ===== Hidden detail panel (revealed on click) =====
      const detail = h('div', {class:'play-detail'});

      // Active factors
      if ((p.preopen_active || []).length) {
        const sec = h('div', {class:'pd-section'},
          h('div', {class:'pd-label'}, `ACTIVE PRE-OPEN · ${p.preopen_active.length}`));
        p.preopen_active.forEach(f => sec.appendChild(h('div', {class:'pd-fline'},
          h('span', {class:'m'}, '✓'),
          h('span', {class:'l'}, `+${f.lift_pp}pp`),
          h('span', {class:'desc'}, f.desc))));
        detail.appendChild(sec);
      }

      // Pending factors
      if ((p.post_pending || []).length) {
        const sec = h('div', {class:'pd-section'},
          h('div', {class:'pd-label'}, `PENDING POST-OPEN · ${p.post_pending.length}`));
        p.post_pending.forEach(f => sec.appendChild(h('div', {class:'pd-fline pend'},
          h('span', {class:'m'}, '○'),
          h('span', {class:'l'}, `+${f.lift_pp}pp`),
          h('span', {class:'desc'},
            h('span', {class:'when'}, f.when), f.desc))));
        detail.appendChild(sec);
      }

      // Projection scenarios
      detail.appendChild(h('div', {class:'pd-section'},
        h('div', {class:'pd-label'}, 'PROJECTION'),
        h('div', {class:'projection-strip'},
          proj.locked
            ? h('div', {class:'proj-card active take'},
                h('div', {class:'pl'}, `COUNT ${proj.min_count}`),
                h('div', {class:'pa'}, proj.min_tier.action),
                h('div', {class:'pn'}, proj.min_tier.note || ''))
            : [
                h('div', {class:'proj-card skip'},
                  h('div', {class:'pl'}, `IF ${proj.min_count}`),
                  h('div', {class:'pa'}, proj.min_tier.action),
                  h('div', {class:'pn'}, proj.min_tier.note || '')),
                h('div', {class:'proj-card take active'},
                  h('div', {class:'pl'}, `IF ${proj.max_count}`),
                  h('div', {class:'pa'}, proj.max_tier.action),
                  h('div', {class:'pn'}, proj.max_tier.note || ''))
              ]
        )));

      // Expectancy
      if (p.expectancy) {
        const e = p.expectancy;
        detail.appendChild(h('div', {class:'pd-section'},
          h('div', {class:'pd-label'}, 'EXPECTANCY'),
          h('div', {class:'pd-exp'},
            'Baseline (no veto, conf≥', h('b', null, e.tradeable_threshold), '): ',
            h('b', null, `${e.setup_pct_of_all_days}%`), ' of days · fires ',
            h('b', null, `${e.fire_rate_pct}%`), ' · EV ',
            h('b', null, `+${e.ev_per_setup_day_R}R/setup-day`),
            e.fire_rate_now_pct != null
              ? [' · today fires ~', h('b', null,
                  e.fire_rate_now_pct === e.fire_rate_max_pct || e.fire_rate_max_pct == null
                    ? `${e.fire_rate_now_pct}%`
                    : `${e.fire_rate_now_pct}-${e.fire_rate_max_pct}%`)]
              : null)));
      }

      // Extra note + Notion link
      if (p.extra_note) detail.appendChild(h('div', {class:'extra-note'}, p.extra_note));
      if (p.notion_url) detail.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank',
        onclick: (e) => e.stopPropagation()}, '→ PLAYBOOK'));

      // AI narrative
      if (p.narrative) {
        detail.appendChild(h('div', {class:'pd-narr', html: p.narrative}));
      }

      card.appendChild(detail);
      card.appendChild(h('div', {class:'pd-hint'},
        isPrimary ? '▼ click to collapse' : '▼ click for detail'));

      card.addEventListener('click', () => card.classList.toggle('expanded'));

      // Primary play starts expanded so user sees the detail without clicking
      if (isPrimary) card.classList.add('expanded');

      return card;
    }

    function renderExecution(primary, fc, gp) {
      const wrap = h('div', {class: 'flow-col exec ' + primary.mode},
        h('div', {class:'exec-frame'},
          h('i', {class:'tl'}), h('i', {class:'tr'}),
          h('i', {class:'bl'}), h('i', {class:'br'})));

      wrap.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '3'),
        h('span', {class:'t'}, "TODAY'S"), h('span', null, 'READ')));

      wrap.appendChild(h('div', {class:'exec-action'}, primary.label));
      wrap.appendChild(h('div', {class:'exec-sub'},
        primary.play
          ? `${(primary.direction || '').toUpperCase()}  ·  ${primary.window}`
          : primary.window));

      if (primary.play) {
        wrap.appendChild(h('div', {class:'exec-summary'},
          'Currently ', h('b', null, `${primary.play.preopen_count}/${primary.play.max_preopen}`),
          ' confluence pre-open. Unlocks at projected count ',
          h('b', null, `${primary.play.projection.max_count}`),
          primary.backup ? h('span', null, '. Backup: ', h('b', null, primary.backup.name), '.') : '.'));
      } else {
        wrap.appendChild(h('div', {class:'exec-summary'}, primary.reason));
      }

      // Triggers
      if (primary.triggers && primary.triggers.length) {
        const trigBlock = h('div', {class:'exec-block'},
          h('div', {class:'label'}, 'TRIGGERS @ 9:30+'));
        primary.triggers.forEach((t, i) => {
          trigBlock.appendChild(h('div', {class:'trig-row'},
            h('span', {class:'step'}, String(i + 1).padStart(2, '0')),
            h('span', {class:'time'}, t.when),
            h('span', {class:'desc'}, t.desc),
            h('span', {class:'lift'}, `+${t.lift_pp}pp`)));
        });
        wrap.appendChild(trigBlock);
      }

      // Size · Target · Kill tiles
      const fcReady = fc.available;
      const qLab = (fc.quintile || '').split(' ', 1)[0];
      const firstTarget = (gp.best_targets || [])
        .filter(t => primary.direction === 'short' ? t.direction === 'below' : t.direction === 'above')[0]
        || (gp.best_targets || [])[0];

      wrap.appendChild(h('div', {class:'exec-block'},
        h('div', {class:'label'}, 'SIZE · TARGET · KILL'),
        h('div', {class:'exec-tiles'},
          h('div', {class: 'exec-tile ' + (
            fc.tier_level === 'wide' || fc.tier_level === 'wide_max' ? 'good' :
            fc.tier_level === 'normal' ? 'cool' :
            fc.tier_level === 'below' ? 'warn' :
            fc.tier_level === 'stand_down' ? 'bad' : '')},
            h('div', {class:'tl'}, 'TIER'),
            h('div', {class:'tv'}, fcReady ? qLab : '—')),
          firstTarget
            ? h('div', {class: 'exec-tile ' + (firstTarget.direction === 'above' ? 'good' : 'bad')},
                h('div', {class:'tl'}, 'TGT-01'),
                h('div', {class:'tv'}, `${firstTarget.label} ${fmtPts(firstTarget.distance_pts)}`))
            : h('div', {class:'exec-tile'},
                h('div', {class:'tl'}, 'TGT'),
                h('div', {class:'tv'}, '—')),

    function renderMatrixPlay(p, idx) {
      const isVeto = !!p.veto_active;
      const proj = p.projection || {};
      const minAction = (proj.min_tier?.action || '').toUpperCase();
      const maxAction = (proj.max_tier?.action || '').toUpperCase();
      const isActive = !isVeto && maxAction.includes('TAKE');

      const exp = p.expectancy;
      const noteMax = proj.max_tier?.note || '';
      const wrMatch = noteMax.match(/~?(\d+(?:[-–]\d+)?)\s*%\s*WR/i);
      const pfMatch = noteMax.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);

      const statTiles = [
        {label:'Confluence', value: `${p.preopen_count}/${p.max_preopen}`,
          cls: p.preopen_count >= Math.ceil((p.max_preopen||1)/2) ? 'cool' : ''},
        {label:'Best WR', value: wrMatch ? wrMatch[1] + '%' : '—', cls: 'good'},
        {label:'Best PF', value: pfMatch ? pfMatch[1] : '—', cls: 'good'},
        {label: exp ? 'Setup/day' : 'Status',
          value: exp ? exp.setup_pct_of_all_days + '%' :
                 (isVeto ? 'VETO' : isActive ? 'READY' : 'WAIT'),
          cls: exp ? '' : (isVeto ? 'bad' : isActive ? 'cool' : 'warn')},

      const dots = [];
      for (let i = 0; i < p.max_preopen; i++) {
        dots.push(h('div', {class: 'd' + (i < p.preopen_count ? ' on' : '')}));
      }
      for (let i = 0; i < (p.post_pending || []).length; i++) {
        dots.push(h('div', {class:'d maybe'}));
      }

      const cardCls = 'play ' + (isVeto ? 'veto' : isActive ? 'active' : 'skip');
      const card = h('div', {class: cardCls});

      card.appendChild(h('div', {class:'play-head'},
        h('div', {class:'play-id'},
          h('span', {class:'play-tag'}, String(idx + 1).padStart(2, '0')),
          h('span', {class: 'badge-dir ' + p.direction}, p.direction.toUpperCase()),
          h('span', {class:'play-name'}, p.name)),
        h('span', {class:'play-window'},
          isVeto ? h('span', {class:'chip veto'}, '🚫 VETO') : null,
          p.window)));

      if (isVeto) {
        card.appendChild(h('div', null,
          (p.active_vetoes || []).map(v => h('div', {class:'factor-line veto'},
            h('span', {class:'marker'}, '✕'),
            h('span', {class:'lift'}, `${v.lift_pp > 0 ? '+' : ''}${v.lift_pp}pp`),
            h('span', {class:'desc'}, v.desc),
            h('span', {class:'meta'}, v.id)))));
        card.appendChild(h('div', {class:'extra-note'},
          `Skip ${p.name} today — veto overrides any confluence count.`));
        if (p.extra_note) card.appendChild(h('div', {class:'extra-note'}, p.extra_note));
        if (p.notion_url) card.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
        card.appendChild(narrative(p.narrative));
        return card;
      }

      card.appendChild(h('div', {class:'conf-dots'},
        dots,
        h('span', {class:'l'},
          h('b', null, `${p.preopen_count}`), '/',
          h('b', null, `${p.max_preopen}`), ' CONFLUENCE',
          (p.post_pending || []).length ? ` · +${p.post_pending.length} possible` : '')));

      card.appendChild(h('div', {class:'stat-row'},
        statTiles.map(s => h('div', {class:'stat-tile ' + (s.cls||'')},
          h('div', {class:'t-l'}, s.label),
          h('div', {class:'t-v'}, s.value)))));

      if ((p.preopen_active || []).length) {
        card.appendChild(h('div', null,
          p.preopen_active.map(f => h('div', {class:'factor-line on'},
            h('span', {class:'marker'}, '✓'),
            h('span', {class:'lift'}, `+${f.lift_pp}pp`),

          p.post_pending.map(f => h('div', {class:'factor-line pending'},
            h('span', {class:'marker'}, '○'),
            h('span', {class:'lift'}, `+${f.lift_pp}pp`),
            h('span', {class:'desc'}, f.desc),
            h('span', {class:'meta'},

      const projStrip = h('div', {class:'projection-strip'});

      card.appendChild(projStrip);

      if (exp) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:10px;margin-top:10px;text-align:right;letter-spacing:0.5px;'},

    function buildPriceLadder(po, lv) {
      const cur = po.current_price;
      if (cur == null) return h('div', {class:'empty'}, 'No live price.');

      const pts = [];
      const push = (price, label, color) => {
        if (price == null) return;
        pts.push({price, label, color});
      };
      const ovr = po.overnight || {};
      const asia = po.asia || {};
      const lon = po.london || {};
      const pr = po.prior_rth || {};
      push(ovr.high, 'ON H', 'var(--cyan)');
      push(ovr.low,  'ON L', 'var(--cyan)');
      push(asia.high, 'Asia H', 'var(--violet)');
      push(asia.low,  'Asia L', 'var(--violet)');
      push(lon.high, 'Lon H', 'var(--amber)');
      push(lon.low,  'Lon L', 'var(--amber)');
      push(pr.high, 'PDH', 'var(--green)');
      push(pr.low,  'PDL', 'var(--green)');
      push(pr.close, 'PDC', 'var(--green)');
      (lv.above || []).forEach(l => {
        if (!pts.find(p => Math.abs(p.price - l.price) < 0.5)) push(l.price, l.label, 'var(--green)');
      });
      (lv.below || []).forEach(l => {
        if (!pts.find(p => Math.abs(p.price - l.price) < 0.5)) push(l.price, l.label, 'var(--red)');
      });

      const allP = pts.map(p => p.price).concat([cur]);
      const minP = Math.min(...allP), maxP = Math.max(...allP);
      const span = Math.max(maxP - minP, 1);
      const pad = span * 0.08;
      const lo = minP - pad, hi = maxP + pad;
      const W = 600, H = 320;
      const yOf = p => H - ((p - lo) / (hi - lo)) * (H - 20) - 10;

      const svg = h('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio:'none'});

      // grid lines
      for (let i = 0; i < 5; i++) {
        const y = (H / 5) * i + 4;
        svg.appendChild(h('line', {x1: 0, x2: W, y1: y, y2: y,
          stroke: 'var(--ladder-grid)', 'stroke-width': 1}));
      }

      // spine
      svg.appendChild(h('line', {x1: 90, x2: 90, y1: 6, y2: H-6,
        stroke: 'var(--line)', 'stroke-width': 1}));

      // current price marker
      const curY = yOf(cur);
      svg.appendChild(h('line', {x1: 0, x2: W, y1: curY, y2: curY,
        stroke: 'var(--text)', 'stroke-width': 1.4, 'stroke-dasharray': '5,3', opacity: 0.7}));
      svg.appendChild(h('rect', {x: W-118, y: curY-13, width: 112, height: 24,
        fill: 'var(--bg-1)', stroke:'var(--cyan)', 'stroke-width': 1.2, rx: 2}));
      svg.appendChild(h('text', {x: W-62, y: curY+4, 'text-anchor': 'middle',
        'font-family': 'ui-monospace, Menlo', 'font-size': 12, 'font-weight': 700,
        fill: 'var(--cyan)'}, `▶ ${cur.toFixed(2)}`));

      // de-collide labels
      const sorted = pts.slice().sort((a,b) => b.price - a.price);
      const minGap = 16;
      const placed = [];
      sorted.forEach(p => {
        let ty = yOf(p.price);
        for (const q of placed) if (Math.abs(ty - q.ty) < minGap) ty = q.ty + minGap;
        placed.push({...p, ty, y: yOf(p.price)});
      });

      placed.forEach(p => {
        svg.appendChild(h('line', {x1: 82, x2: 98, y1: p.y, y2: p.y,
          stroke: p.color, 'stroke-width': 2}));
        svg.appendChild(h('circle', {cx: 90, cy: p.y, r: 3.5,
          fill: p.color, stroke: 'var(--bg-1)', 'stroke-width': 1.5}));
        svg.appendChild(h('line', {x1: 98, x2: 130, y1: p.y, y2: p.ty,
          stroke: p.color, 'stroke-width': 1, opacity: 0.4}));
        svg.appendChild(h('text', {x: 134, y: p.ty+4,
          'font-family': 'ui-monospace, Menlo', 'font-size': 11, 'font-weight': 600,
          fill: p.color},
          `${p.label}  ${p.price.toFixed(2)}  `,
          h('tspan', {fill: 'var(--text-mute)', 'font-size': 10, 'font-weight': 400},
            `${p.price > cur ? '+' : ''}${(p.price - cur).toFixed(1)}`)));
      });

      return h('div', {class:'ladder'}, svg);
    }

              e.currency ? h('span', {class:'e-ccy'}, e.currency) : null));
          });
        } else {
          card.appendChild(h('div', {class:'empty'}, 'No red folder events'));
        }
        card.appendChild(h('div', {class:'flag-row'},
          h('span', {class: 'flag ' + (cal.is_fomc_week ? 'on' : '')},
            'FOMC: ', cal.is_fomc_week ? 'YES' : 'NO'),
          cal.dow_note ? h('span', {class:'flag'}, cal.dow_note) : null));
      }
      card.appendChild(narrative(cal.narrative));
      return card;
    }

    function renderFactors(fs) {
      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, 'Factor Snapshot'),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${(fs.active||[]).length} ON · ${(fs.inactive||[]).length} OFF`)));
      const body = h('div', null);
      card.appendChild(body);
      const sec = (title, list, cls) => {
        if (!list || !list.length) return;
        body.appendChild(h('div', {style:'margin-top:6px;'},
          h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin-bottom:5px;'},
            `${title} · ${list.length}`),
          h('div', null, list.map(f => h('span', {class:'chip ' + cls}, f)))));
      };
      sec('ACTIVE', fs.active, 'on');
      sec('UNKNOWN', fs.unknown, 'unk');
      sec('INACTIVE', fs.inactive, 'off');
      body.appendChild(narrative(fs.narrative));
      return card;
    }

    // Vertical price-relative map of the liquidity levels: a rail with the
    // current price marked, every level placed true-to-scale by price, and a
    // de-collided label on the right so clustered levels stay readable. The
    // NOW marker (and each level's live distance) re-derives from curPrice, so
    // this can be redrawn cheaply as live price ticks in.
    function buildLadder(host, levels, curPrice) {
      host.textContent = '';
      if (curPrice == null || !levels.length) return;

      const H = Math.max(220, Math.min(420, 64 + levels.length * 34));
      host.style.height = H + 'px';
      const PAD = 14;                       // top/bottom px breathing room
      const prices = levels.map(l => l.price).concat([curPrice]);
      let lo = Math.min(...prices), hi = Math.max(...prices);
      const span = (hi - lo) || 1;
      lo -= span * 0.08; hi += span * 0.08;
      const yOf = (p) => PAD + (hi - p) / (hi - lo) * (H - 2 * PAD);

      // SVG geometry layer (rail, now line, leaders, ticks) — stretched, so
      // no text lives here. Uses a 0..100 x-space mapped to full width.
      const RAIL = 86, LBL = 100;           // px, must match CSS vars
      const W = host.clientWidth || 600;
      const xPct = (px) => px / W * 100;
      const svg = h('svg', {viewBox: `0 0 100 ${H}`, preserveAspectRatio: 'none'});

      // de-collide level labels (keep tick at true y, nudge label, link w/ leader)
      const items = levels.map((l, i) => ({l, i, ty: yOf(l.price), ly: yOf(l.price)}))
        .sort((a, b) => a.ty - b.ty);
      const GAP = 24;
      for (let i = 1; i < items.length; i++)
        if (items[i].ly - items[i - 1].ly < GAP) items[i].ly = items[i - 1].ly + GAP;
      // if the stack overran the bottom, pull the whole thing up from the end
      if (items.length && items[items.length - 1].ly > H - PAD) {
        items[items.length - 1].ly = H - PAD;
        for (let i = items.length - 2; i >= 0; i--)
          if (items[i + 1].ly - items[i].ly < GAP) items[i].ly = items[i + 1].ly - GAP;
      }

      svg.appendChild(h('line', {class: 'rail',
        x1: xPct(RAIL), y1: PAD, x2: xPct(RAIL), y2: H - PAD}));

      items.forEach(it => {
        const side = it.l.price >= curPrice ? 'above' : 'below';
        // leader: rail tick (true y) -> label y
        svg.appendChild(h('path', {class: 'lead ' + side,
          d: `M${xPct(RAIL)} ${it.ty} C ${xPct(RAIL) + 4} ${it.ty}, ${xPct(LBL) - 4} ${it.ly}, ${xPct(LBL)} ${it.ly}`}));
        svg.appendChild(h('line', {class: 'tick ' + side,
          x1: xPct(RAIL - 4), y1: it.ty, x2: xPct(RAIL + 4), y2: it.ty}));
      });
      // NOW line across the whole width
      const ny = yOf(curPrice);
      svg.appendChild(h('line', {class: 'nowline', x1: 0, y1: ny, x2: 100, y2: ny}));
      host.appendChild(svg);

      // HTML label layer (crisp text)
      items.forEach(it => {
        const l = it.l;
        const dist = l.price - curPrice;
        const side = dist >= 0 ? 'above' : 'below';
        host.appendChild(h('div', {class: 'lv-row ' + side, style: `top:${it.ly}px;`},
          h('span', {class: 'lv-arrow'}, side === 'above' ? '▲' : '▼'),
          h('span', {class: 'lv-name'}, l.label),
          h('span', {class: 'lv-px'}, fmtPrice(l.price)),
          h('span', {class: 'lv-dist'}, fmtPts(dist))));
      });
      // NOW chip on the rail
      host.appendChild(h('div', {class: 'lv-now', style: `top:${ny}px;`},
        h('span', {class: 'now-tag'}, 'NOW'),
        h('span', {class: 'now-px'}, fmtPrice(curPrice))));
    }

    function renderLevelsTable(lv, curPrice) {
      const above = lv.above || [], below = lv.below || [];
      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, 'Liquidity Levels'),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${above.length + below.length} · WITHIN ${lv.scope_pts || 100}P`)));
      const body = h('div', null);
      card.appendChild(body);

      if (!above.length && !below.length) {
        body.appendChild(h('div', {class:'empty'}, 'No levels available — needs live price.'));
        body.appendChild(narrative(lv.narrative));
        return card;
      }
      const tbl = h('table', {class:'levels'},
        h('thead', null, h('tr', null,
          h('th', null, ''), h('th', null, 'Level'),
          h('th', null, 'Price'), h('th', null, 'Dist'),
          h('th', null, 'Hit 45m'), h('th', null, 'WR'))));
      const tb = h('tbody');
      const fmtRow = (l, cls) => h('tr', {class: cls},
        h('td', null, cls === 'above' ? '↑' : '↓'),
        h('td', null, l.label),
        h('td', null, fmtPrice(l.price)),
        h('td', null, fmtPts(l.distance_pts)),
        h('td', null,
          h('span', {class:'heat', style:`--w:${Math.min(100, l.hit_rate_45m_pct || 0)}%`}),
          fmtPct(l.hit_rate_45m_pct)),
        h('td', {class: l.below_baseline ? 'weak' : ''}, fmtPct(l.wr_as_magnet_pct)));
      above.forEach(l => tb.appendChild(fmtRow(l, 'above')));
      below.forEach(l => tb.appendChild(fmtRow(l, 'below')));
      tbl.appendChild(tb);

      // Price-relative ladder above the table. Levels sit at true price
      // positions around a NOW marker so distance is visible at a glance.
      const allLevels = above.concat(below);
      if (curPrice != null && allLevels.length) {
        const ladder = h('div', {class: 'lv-ladder'});
        body.appendChild(ladder);
        const draw = () => buildLadder(ladder, allLevels,
          (window.__livePrice != null ? window.__livePrice : curPrice));
        ladder._redraw = draw;
        draw();
        // redraw once on layout settle (clientWidth needs the DOM laid out)
        requestAnimationFrame(draw);
        if (!window.__ladderResizeHooked) {
          window.__ladderResizeHooked = true;
          window.addEventListener('resize', () =>
            document.querySelectorAll('.lv-ladder').forEach(n => n._redraw && n._redraw()));
        }
      }

      body.appendChild(tbl);
      body.appendChild(h('div', {class:'mute mono', style:'font-size:10px;margin-top:10px;line-height:1.6;'},
        '1–2 levels in trade direction = sweet spot (55% WR, PF 1.30) ',
        '· 1 obstruction between entry/target = positive (58.5% WR) ',
        '· 3+ stacked = contested, reduce size'));
      body.appendChild(narrative(lv.narrative));
      return card;
    }

    function renderGamePlan(gp) {
      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, "Today's Game Plan"),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${(gp.checklist||[]).length} CHECKS · ${(gp.best_targets||[]).length} TGTS`)));
      const body = h('div', null);
      card.appendChild(body);

      (gp.one_liners || []).forEach(o =>
        body.appendChild(h('div', {class:'one-liner'}, '"', o, '"')));

      if ((gp.checklist || []).length) {
        body.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin:12px 0 4px;'},
          '9:30 CHECKLIST'));
        body.appendChild(h('ul', {class:'checklist'},
          gp.checklist.map(t => h('li', null, t))));
      }

      if ((gp.best_targets || []).length) {
        body.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin:14px 0 4px;'},
          'BEST DRAW TARGETS'));
        gp.best_targets.forEach(t =>
          body.appendChild(h('div', {class: 'target-row ' + (t.direction === 'above' ? 'up' : 'down')},
            h('span', null, t.direction === 'above' ? '↑' : '↓'),
            h('span', {class:'t-label'}, t.label),
            h('span', {class:'t-px'}, fmtPrice(t.price)),
            h('span', {class:'t-dist'}, fmtPts(t.distance_pts), ' pts'))));
      }
      body.appendChild(narrative(gp.narrative));
      return card;
    }

    // ============ LIVE MACRO STATUS ============
    // Walk each .window-section[data-window] and tag it pending/live/past
    // based on the current time in America/New_York. Only applies when the
    // briefing's meta.date matches today in ET — otherwise the cards stay
    // in their static historical state.
    function getETNow() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).formatToParts(new Date());
      const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
      let hour = parseInt(p.hour, 10);
      if (hour === 24) hour = 0;
      return {
        date: `${p.year}-${p.month}-${p.day}`,
        minOfDay: hour * 60 + parseInt(p.minute, 10),
      };
    }
    function parseWindowRange(w) {
      const m = w && w.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      return {
        start: parseInt(m[1], 10) * 60 + parseInt(m[2], 10),
        end:   parseInt(m[3], 10) * 60 + parseInt(m[4], 10),
      };
    }
    function tickMacroStatus() {
      const { date, minOfDay } = getETNow();
      // Stale-data agreement: the play cards (timeStateForPlay) flip to DONE
      // whenever the briefing date is older than today's ET date. If we bail
      // here on !isToday, the sections keep their neutral (open-looking) state
      // while every play reads DONE — the recurring "M3 DONE but the window's
      // still open" contradiction. So when the briefing is from a PAST date,
      // force every section to 'past' so the UI is internally consistent (and
      // the stale banner / self-heal handles actually pulling fresh data). A
      // future briefing date (shouldn't happen) leaves everything 'pending'.
      const staleState = meta.date < date ? 'past'
                       : meta.date > date ? 'pending'
                       : null;  // null === today: compute per-window below
      document.querySelectorAll('.window-section[data-window]').forEach(sec => {
        sec.classList.remove('pending', 'live', 'past');
        if (staleState) { sec.classList.add(staleState); return; }
        const range = parseWindowRange(sec.getAttribute('data-window'));
        if (!range) return;
        const state = minOfDay < range.start ? 'pending'
                    : minOfDay < range.end   ? 'live'
                    :                          'past';
        sec.classList.add(state);
      });
    }
    tickMacroStatus();
    setInterval(tickMacroStatus, 30000);
  })();
  </script>
</body>
</html>
