name: Morning Briefing

# Runs the daily pre-market briefing autonomously — replaces the Claude Code
# routine entirely. Order:
#   1. Sync the FVGC Playbook from Notion → playbook/plays.json
#   2. Run morning_briefing.py to fetch live market data + write
#      briefing.json + data.js (with AI narratives via GPT-5 Nano)
#   3. Commit + push the artifacts to master
#   4. Deploy the dashboard to GitHub Pages directly from this run.
#
# Why the deploy lives here instead of in pages.yml:
# GitHub Actions silently blocks workflows from being triggered by the
# default GITHUB_TOKEN — an anti-infinite-loop guardrail. So when this
# workflow pushes a commit, the standalone pages.yml workflow does NOT
# auto-trigger. We fold the deploy in-line to avoid the dependency. The
# separate pages.yml still handles deploys for human pushes that don't
# go through this cron.
#
# Cron: 13:10 UTC weekdays. During DST that's 6:10 AM PT (matches the old
# Claude routine); during standard time it runs 1h earlier — still pre-open.

on:
  schedule:
    - cron: '10 13 * * 1-5'
  workflow_dispatch:
    inputs:
      ai_overwrite:
        description: 'Regenerate AI narratives even if present'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync FVGC Playbook from Notion
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          python tools/sync_playbook_from_notion.py --from-api

      - name: Run morning briefing (live data + AI narratives)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          AI_FLAGS="--ai-narratives"
          if [ "${{ github.event.inputs.ai_overwrite }}" = "true" ]; then
            AI_FLAGS="$AI_FLAGS --ai-overwrite"
          fi
          python tools/morning_briefing.py --export-dashboard $AI_FLAGS

      - name: Commit and push artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playbook/plays.json tools/briefing/briefing.json tools/briefing/data.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "briefing: daily run $(TZ=America/New_York date +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push origin HEAD:master; then
                echo "Pushed successfully."
                break
              fi
              git pull --rebase origin master
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/briefing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
