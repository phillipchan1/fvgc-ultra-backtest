name: Deploy Briefing to GitHub Pages

# Auto-deploys tools/briefing/ to GitHub Pages whenever the dashboard files
# change on master. Daily morning routine commits to briefing.json + data.js
# trigger a redeploy; pushes that don't touch tools/briefing/ are ignored.
#
# Manual trigger available via Actions → Deploy Briefing → Run workflow.

on:
  push:
    branches: [master]
    paths:
      - 'tools/briefing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy. New runs cancel any in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub Pages is enabled (Actions source)
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for this repo."
            echo "Open https://github.com/${{ github.repository }}/settings/pages"
            echo "Set Build and deployment → Source → GitHub Actions, then re-run this workflow."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected Pages API response: HTTP $code"
            cat /tmp/pages.json
            exit 1
          fi
          build_type=$(python3 -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type',''))")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages source is '$build_type' but must be GitHub Actions (workflow)."
            echo "Open https://github.com/${{ github.repository }}/settings/pages → Source → GitHub Actions"
            exit 1
          fi
          echo "Pages site is configured (workflow deploy)."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/briefing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
