        const dbCount  = document.querySelector(`[data-detail-state-count="${cssEscape(p.name)}"]`);
        const dbAction = document.querySelector(`[data-detail-state-action="${cssEscape(p.name)}"]`);
        const dbBanner = document.querySelector(`[data-detail-play="${cssEscape(p.name)}"]`);
        if (dbChip && dbCount && dbAction && dbBanner) {
          // Recompute via the shared helper — pulls in time-state so the
          // banner flips to DONE once the window passes.
          const st = _computeMatrixState(p);
          dbBanner.className = 'detail-state-banner ' + st.cls;
          dbChip.className   = 'dsb-chip ' + st.cls;
          dbChip.textContent = st.label;
          dbAction.className = 'dsb-action ' + st.cls;
          dbAction.textContent = st.action;
          // First time we observe a terminal state for this play today —
          // ping Fly.io to regenerate the play's narrative.
          maybeTriggerPlayNarrative(p, st);
          // Count: "<liveCount>/<max>  · +<unknown>"
          const unknownCount = pending.length - firedIds.size - missedIds.size;
          dbCount.innerHTML =
            `<b>${liveCount}</b>/${p.max_preopen}` +
            (unknownCount > 0 ? `<span class="dim"> · +${unknownCount}</span>` : '');
          // Tracker dots live inside the banner — already updated by the
          // .conf-tracker .dd[data-pending-factor] sweep below.
        }

        // Update the big tracker dots in the detail banner (sibling of
        // the .conf-mini sweep above, but with .conf-tracker selector).
        document.querySelectorAll('.conf-tracker .dd[data-pending-factor]').forEach(d => {
          const fid = d.dataset.pendingFactor;
          if (firedIds.has(fid))      { d.classList.remove('maybe','missed'); d.classList.add('on'); }
          else if (missedIds.has(fid)) { d.classList.remove('maybe','on');     d.classList.add('missed'); }
        });
      }

      // cssEscape moved to outer scope (above updatePlayTimeStates)
      // because that function also uses it. Was originally defined here
      // inside setupLiveOverlay's closure, which is invisible to outer-
      // scope callers — broke updatePlayTimeStates with ReferenceError,
      // killing the 30s state-refresh ticker and freezing every play
      // card in its initial state ("DONE every morning" pattern).

      // -------- Tier 2: playbook play live kill-switches --------
      // FVGC To Opening Range H/L decision tree, applied against the
      // 15-min OR (snap.or_15min — locks at 9:45) NOT the 45-min OR
      // used by the Range Briefing:
      //
      //   width > 150 pts                      → VETOED (fires immediately,
      //                                          width is monotonically
      //                                          non-decreasing during build)
      //   both OR sides swept (post-9:45)      → VETOED
      //   one side swept                       → "LONGS ONLY" or "SHORTS ONLY"
      //                                          (direction toward the
      //                                          remaining-unswept side)
      //   width 60-100 and OR locked, no sweep → PRIME
      //   width otherwise and OR locked         → ELIGIBLE
      //   OR not yet locked                    → leave badge (time-state ticker
      //                                          handles WAIT/LIVE)
      //
      // Generalisable later — keyed off play name for now.
      function applyLivePlaybookVerdicts(snap) {
        const or15 = snap?.or_15min;
        if (!or15 || or15.high == null) return;
        const w = or15.width || 0;

        // Determine verdict.
        let verdict = null;
        let cls = null;
        let cardExtraCls = null;

        if (w > 150) {
          // Width kill switch fires immediately — width can only grow.
          verdict = 'VETOED · OR > 150';
          cls = 'veto';
        } else if (or15.complete && or15.high_swept && or15.low_swept) {
          verdict = 'VETOED · BOTH SWEPT';
          cls = 'veto';
        } else if (or15.complete && or15.high_swept) {
          verdict = 'SHORTS ONLY';   // OR.H taken — trade toward OR.L
          cls = 'wait';
        } else if (or15.complete && or15.low_swept) {
          verdict = 'LONGS ONLY';    // OR.L taken — trade toward OR.H
          cls = 'wait';
        } else if (or15.complete) {
          // OR locked, neither side swept yet, width <= 150.
          if (w >= 60 && w <= 100) { verdict = 'PRIME';    cls = 'live'; }
          else                     { verdict = 'ELIGIBLE'; cls = 'live'; }
        } else {
          // Pre-9:45 — let the time-state ticker handle WAIT/LIVE.
          return;
        }

        const apAll = window.BRIEFING_DATA?.active_plays || [];
        apAll.forEach(p => {
          if (p.name !== 'FVGC To Opening Range H/L') return;
          const cardKey = `playbook:${p.name}`;
          const card = document.querySelector(
            `[data-key="${(window.CSS && CSS.escape) ? CSS.escape(cardKey) : cardKey}"]`
          );
          if (!card) return;
          const stateEl = card.querySelector('.pstate');
          if (!stateEl) return;
          if (stateEl.textContent === verdict) return;  // no change
          stateEl.className = 'pstate ' + cls;
          stateEl.textContent = verdict;
          // Apply card-level dimming for VETOED.
          card.classList.toggle('veto', cls === 'veto');

          // Mirror to detail-pane state banner if open.
          const dChip = document.querySelector(`[data-detail-state-chip="${cssEscape(p.name)}"]`);
          const dBan  = document.querySelector(`[data-detail-play="${cssEscape(p.name)}"]`);
          const dAct  = document.querySelector(`[data-detail-state-action="${cssEscape(p.name)}"]`);
          if (dChip && dBan && dAct) {
            // Map card pstate cls (live/veto/wait) → banner cls.
            const banCls = cls === 'veto' ? 'veto' : cls === 'live' ? 'live' : 'wait';
            dBan.className  = 'detail-state-banner ' + banCls;
            dChip.className = 'dsb-chip ' + banCls;
            dChip.textContent = verdict;
            // Map verdict → an action sentence.
            const actionMap = {
              'VETOED · OR > 150':   'OR width above the 150-pt kill line. Skip.',
              'VETOED · BOTH SWEPT': 'Both OR sides swept — no clean direction. Skip.',
              'SHORTS ONLY':         'OR.H taken — trade toward OR.L only.',
              'LONGS ONLY':          'OR.L taken — trade toward OR.H only.',
              'PRIME':               'Width 60–100, OR locked, no sweep — best-zone setup.',
              'ELIGIBLE':            'OR locked, no sweep — trade per FVGC signal.',
            };
            dAct.className = 'dsb-action ' + banCls;
            dAct.textContent = actionMap[verdict] || verdict;
          }
        });
      }

      // ====== HERO STATE ======
      // Range Briefing hero auto-flips between two modes:
      //   FORECAST  (pre-open)   — cold-start prediction is the big number;
      //                            badge says "FORECAST".
      //   ACTUAL    (session)    — real OR width is the big number; the
      //                            cold-start gets demoted to a subtitle
      //                            ("forecast was 212 · Q4 (−26 tighter)").
      // The flip is keyed off snap.opening_range — once Fly.io serves a
      // non-empty width (i.e. the session has begun and bars exist for
      // 9:30+), ACTUAL takes the hero spot. The top-right header tag
      // moves from "45-MIN OR FORECAST" → "LIVE · BUILDING" → "LIVE · LOCKED".
      function updateRangeHero(snap) {
        const fc = window.BRIEFING_DATA?.or_forecast;
        const sw = fc?.stepwise;
        const card = document.querySelector('.range-card');
        if (!card || !fc?.available) return;

        const head     = card.querySelector('.range-head');
        const qEl      = card.querySelector('[data-hero-q]');
        const ptsEl    = card.querySelector('[data-hero-pts]');
        const ciEl     = card.querySelector('[data-hero-ci]');
        const meanEl   = card.querySelector('[data-hero-meaning]');
        const headerEl = card.querySelector('[data-hero-header]');
        if (!head || !qEl || !ptsEl || !ciEl) return;

        const or45 = snap?.opening_range;
        const heroIsActual = !!(snap?.in_session && or45 && or45.width > 0);

        // Cold-start refs — needed in both branches (delta line + restore).
        const coldQ   = ((fc.quintile || '').split(' ', 1)[0] || '').toUpperCase();
        const coldQCls = _qClass(coldQ);
        const coldPts = Math.round(fc.point_pts);

        if (!heroIsActual) {
          // Restore FORECAST mode (covers offline → online transitions).
          if (head.dataset.heroMode === 'actual') {
            head.dataset.heroMode = 'forecast';
            qEl.className = 'range-quintile ' + coldQCls;
            qEl.textContent = coldQ || '—';
            ptsEl.innerHTML =
              `${coldPts}<span class="unit">pts</span>` +
              `<span class="hero-badge forecast">FORECAST</span>`;
            if (meanEl) {
              meanEl.className = 'range-meaning mono ' + coldQCls;
              meanEl.textContent = _qMeaning(coldQ);
            }
            ciEl.textContent =
              `${fc.lo80_pts}–${fc.hi80_pts} · ${fc.quintile || ''} · cold-start`;
            if (headerEl) headerEl.textContent = '45-MIN OR FORECAST';
            card.querySelectorAll('.q-seg').forEach(s => s.classList.remove('actual'));
            const lit = card.querySelector(`.q-seg.${(coldQ||'').toLowerCase()}`);
            if (lit) lit.classList.add('on');
          }
          return;
        }

        // ACTUAL mode — real OR width drives the hero.
        const w = or45.width;
        const complete = !!or45.complete;
        let actualQ = '—';
        let actualQCls = '';
        if (sw?.thresholds?.or_45min) {
          const q = _bucketize(w, sw.thresholds.or_45min);
          actualQ = `Q${q}`;
          actualQCls = _qClass(actualQ);
        }

        // Delta — sign w.r.t. cold-start point estimate.
        const delta = Math.round(w - coldPts);
        const onTrack = (actualQ && coldQ && actualQ === coldQ);
        let deltaTxt;
        if (delta === 0)       deltaTxt = 'on target';
        else if (delta < 0)    deltaTxt = `${Math.abs(delta)} tighter`;
        else                   deltaTxt = `${delta} wider`;
        const trackTag = onTrack ? ' · on track' : '';

        head.dataset.heroMode = 'actual';
        qEl.className = 'range-quintile ' + actualQCls;
        qEl.textContent = actualQ;

        const badgeCls  = complete ? 'locked' : 'live';
        const badgeText = complete ? 'ACTUAL · LOCKED' : 'ACTUAL · BUILDING';
        ptsEl.innerHTML =
          `${Math.round(w)}<span class="unit">pts</span>` +
          `<span class="hero-badge ${badgeCls}">${badgeText}</span>`;
        if (meanEl) {
          meanEl.className = 'range-meaning mono ' + actualQCls;
          meanEl.textContent = _qMeaning(actualQ);
        }
        ciEl.textContent =
          `forecast was ${coldPts} · ${coldQ} (${deltaTxt}${trackTag})`;
        if (headerEl) {
          headerEl.textContent = complete ? 'LIVE · LOCKED' : 'LIVE · BUILDING';
          headerEl.style.color = complete ? 'var(--green)' : 'var(--cyan)';
        }

        // Quintile bar: clear stale highlights, light the ACTUAL segment.
        // (Cold-start lit segment came from initial render; we move the
        // .on glow to actualQ so the bar always reflects truth-of-the-day.)
        card.querySelectorAll('.q-seg').forEach(s => {
          s.classList.remove('on', 'actual', 'live-locked');
        });
        const seg = card.querySelector(`.q-seg.${actualQ.toLowerCase()}`);
        if (seg) seg.classList.add('on', complete ? 'actual-locked' : 'actual-live');
      }

      // ====== EVOLVING FORECAST ======
      // Three-step refinement of the 45-min OR forecast as live evidence
      // arrives. Sources:
      //   cold:  fc.point_pts (model output, pre-open)
      //   5min:  snap.or_5min.width × ratio_5_to_45.median  (locks 9:35)
      //   15min: snap.or_15min.width × ratio_15_to_45.median (locks 9:45)
      //   final: snap.opening_range.width once 9:30+45min elapsed
      //
      // Confidence per step = max-probability quintile from the relevant
      // transition matrix (5→45 or 15→45). Validated on 1393 trading days:
      // 15min Q5 → 45min Q5 hits 66% (95% top-2 adjacent).
      function _bucketize(width, cuts) {
        // cuts = [Q1max, Q2max, Q3max, Q4max] → returns 1..5
        for (let i = 0; i < cuts.length; i++) {
          if (width <= cuts[i]) return i + 1;
        }
        return 5;
      }
      function _refineForecast(width, transitionRow, ratio) {
        // transitionRow: array of 5 probabilities P(45min=Qi | observed=Qsource)
        // ratio: {median, q25, q75, q10, q90}
        if (!transitionRow || !ratio) return null;
        let bestI = 0, bestP = -1;
        transitionRow.forEach((p, i) => { if (p > bestP) { bestP = p; bestI = i; } });
        const top2P = (bestP || 0) + (transitionRow[Math.min(4, bestI + 1)] || 0)
                    + (transitionRow[Math.max(0, bestI - 1)] || 0)
                    - (bestP || 0);  // bestP counted once; adjacents added
        return {
          quintile: `Q${bestI + 1}`,
          confidence: bestP,             // 0..1, max-quintile probability
          top2_adj: Math.min(1, bestP + Math.max(
            transitionRow[Math.min(4, bestI + 1)] || 0,
            transitionRow[Math.max(0, bestI - 1)] || 0)),
          point_pts: width * ratio.median,
          lo_pts: width * ratio.q25,
          hi_pts: width * ratio.q75,
        };
      }
      // _qClass + _qMeaning now live at outer scope (above renderRange-
      // Briefing) so both the initial render AND the live hero updater
      // can reach them without scope-walking inside setupLiveOverlay.
      function renderEvolvingForecast(snap) {
        const fc = window.BRIEFING_DATA?.or_forecast;
        const sw = fc?.stepwise;
        let container = document.getElementById('evolving-forecast');

        // Need stepwise stats (baked into briefing.json) + a cold-start
        // forecast to even show the trajectory.
        if (!sw || !sw.available || !fc?.available) {
          if (container) container.style.display = 'none';
          return;
        }
        if (!container) {
          const rangeCard = document.querySelector('.range-card');
          if (!rangeCard) return;
          container = document.createElement('div');
          container.id = 'evolving-forecast';
          container.className = 'evolving-forecast';
          // Insert before live-OR section if present, else before action.
          const liveOR = rangeCard.querySelector('#or-live-section');
          const actionBlock = rangeCard.querySelector('.range-action');
          const anchor = liveOR || actionBlock;
          if (anchor) {
            rangeCard.insertBefore(container, anchor);
          } else {
            rangeCard.appendChild(container);
          }
        }
        container.style.display = '';

        const or5  = snap?.or_5min;
        const or15 = snap?.or_15min;
        const or45 = snap?.opening_range;

        // STEP 1 — pre-open MODEL output (always shown)
        const coldQ = ((fc.quintile || '').split(' ', 1)[0] || '').toUpperCase();
        const coldRow = {
          stage: 'PRE-OPEN MODEL',
          time: '9:29',
          state: 'locked',          // model output, never changes intraday
          quintile: coldQ || '—',
          confidence: null,
          point_pts: fc.point_pts,
          lo_pts: fc.lo80_pts,
          hi_pts: fc.hi80_pts,
          basis: 'from 13 features',
        };

        // STEP 2 — refined by 5-min OR (locks 9:35)
        let step5 = { stage: 'AFTER 5-MIN OR', time: '9:35', state: 'waiting' };
        if (or5 && or5.width > 0) {
          const q5 = _bucketize(or5.width, sw.thresholds.or_5min);
          const row = sw.transition_5_to_45[q5 - 1];
          const refined = _refineForecast(or5.width, row, sw.ratio_5_to_45);
          step5 = Object.assign(step5, refined || {}, {
            state: or5.complete ? 'locked' : 'live',
            basis: `OR(5m) = ${Math.round(or5.width)}pt · Q${q5}`,
            source_q: q5,
            source_width: or5.width,
          });
        }

        // STEP 3 — refined by 15-min OR (locks 9:45)
        let step15 = { stage: 'AFTER 15-MIN OR', time: '9:45', state: 'waiting' };
        if (or15 && or15.width > 0) {
          const q15 = _bucketize(or15.width, sw.thresholds.or_15min);
          const row = sw.transition_15_to_45[q15 - 1];
          const refined = _refineForecast(or15.width, row, sw.ratio_15_to_45);
          step15 = Object.assign(step15, refined || {}, {
            state: or15.complete ? 'locked' : 'live',
            basis: `OR(15m) = ${Math.round(or15.width)}pt · Q${q15}`,
            source_q: q15,
            source_width: or15.width,
          });
        }

        // STEP 4 — observed final (45-min OR locked at 10:15)
        let stepFinal = { stage: 'OBSERVED (LOCKED)', time: '10:15', state: 'waiting' };
        if (or45 && or45.complete && or45.width > 0) {
          const qFinal = _bucketize(or45.width, sw.thresholds.or_45min);
          stepFinal = {
            stage: 'OBSERVED (LOCKED)',
            time: '10:15',
            state: 'locked',
            quintile: `Q${qFinal}`,
            confidence: 1.0,
            point_pts: or45.width,
            lo_pts: or45.width,
            hi_pts: or45.width,
            basis: 'OR(45m) locked — actual',
            source_width: or45.width,
          };
        }

        const steps = [coldRow, step5, step15, stepFinal];

        // Build HTML. Re-render whole block each tick — cheap, lets us
        // animate state transitions cleanly.
        const stepHtml = steps.map((s, i) => {
          const isWaiting = s.state === 'waiting';
          const qLetter = (s.quintile || '').toUpperCase();
          const qCls = _qClass(qLetter);
          const stateCls = s.state || 'waiting';
          const widthCell = s.point_pts != null
            ? `<span class="ef-pts mono">${Math.round(s.point_pts)}<span class="ef-unit">pt</span></span>`
            : `<span class="ef-pts mute mono">—</span>`;
          const rangeCell = (s.lo_pts != null && s.hi_pts != null && s.lo_pts !== s.hi_pts)
            ? `<span class="ef-range mono mute">${Math.round(s.lo_pts)}–${Math.round(s.hi_pts)}</span>`
            : '';
          const qCell = qLetter && !isWaiting
            ? `<span class="ef-q ${qCls} mono">${qLetter}</span>`
            : `<span class="ef-q dim mono">—</span>`;
          const confCell = (s.confidence != null && s.confidence > 0 && s.state !== 'waiting' && s.stage !== 'COLD START' && s.stage !== 'ACTUAL')
            ? `<span class="ef-conf mono mute">${Math.round(s.confidence * 100)}%</span>`
            : '';
          return `
            <div class="ef-row ${stateCls}">
              <div class="ef-stage">
                <span class="ef-dot ${stateCls}"></span>
                <span class="ef-time mono">${s.time}</span>
                <span class="ef-name mono">${s.stage}</span>
              </div>
              <div class="ef-data">
                ${qCell}
                ${widthCell}
                ${rangeCell}
                ${confCell}
              </div>
              <div class="ef-basis mono mute">${s.basis || (isWaiting ? 'pending' : '')}</div>
            </div>
          `;
        }).join('');

        // Drift indicator: if the latest available step disagrees with
        // cold-start quintile, surface it (Q drift is real signal).
        const last = [stepFinal, step15, step5].find(s => s && s.state !== 'waiting' && s.quintile);
        let drift = '';
        if (last && last.stage !== 'COLD START' && coldQ && last.quintile) {
          const cIdx = parseInt(coldQ.slice(1), 10);
          const lIdx = parseInt(last.quintile.slice(1), 10);
          if (!isNaN(cIdx) && !isNaN(lIdx) && lIdx !== cIdx) {
            const dir = lIdx > cIdx ? 'WIDER' : 'TIGHTER';
            const dCls = lIdx > cIdx ? 'good' : 'bad';
            drift = `<div class="ef-drift ${dCls} mono">DRIFT ${dir} · cold ${coldQ} → live ${last.quintile}</div>`;
          } else if (!isNaN(cIdx) && !isNaN(lIdx)) {
            drift = `<div class="ef-drift cool mono">ON TRACK · cold ${coldQ} confirmed at ${last.stage}</div>`;
          }
        }

        container.innerHTML = `
          <div class="r-label">
            FORECAST TRAJECTORY
            <span class="r-tag">stepwise · n=${sw.sample_size}</span>
          </div>
          <div class="r-sublabel mono mute">
            Each row predicts where the 45-min OR will land, using the
            evidence available at that point in the session. Refines as
            5-min and 15-min OR lock.
          </div>
          <div class="ef-rows">${stepHtml}</div>
          ${drift}
        `;
      }

      // DEPRECATED — kept as a no-op for backward compatibility. The
      // live OR width and quintile are now surfaced as the hero of the
      // Range Briefing card (see updateRangeHero), and the build
      // trajectory lives in the EVOLVING FORECAST block. Anything that
      // calls this just hides the legacy container if it exists.
      // DEPRECATED — the live OR width and quintile are now the hero of
      // the Range Briefing card (see updateRangeHero), and the build
      // trajectory lives in the EVOLVING FORECAST block. Kept as a
      // hide-only stub in case anything (a cached page, a future caller)
      // still references it.
      function renderLiveORSection(_snap) {
        const container = document.getElementById('or-live-section');
        if (container) container.style.display = 'none';
      }

      async function pollOnce() {
        try {
          const resp = await fetch(LIVE_API, { cache: 'no-store' });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const snap = await resp.json();
          if (snap.error) throw new Error(snap.error);
          liveData = snap;
          // Expose to outer scope so renderers like the playbook detail
          // can evaluate confluences (gap, intraday_factors, OR widths)
          // against the latest snapshot without taking a dependency on
          // setupLiveOverlay's closure.
          window.__LIVE_SNAP = snap;
          lastSuccessAt = Date.now();
          consecutiveFails = 0;
          // Show snapshot lag in pill — that's "bar publish lag",
          // typically ~60s for 1-min bars (start-of-minute timestamp).
          const lag = snap.lag_seconds != null ? snap.lag_seconds : 0;
          setPill(lag > STALE_SECONDS ? 'stale' : 'live', lag);
          applyLiveOverlay(snap);
        } catch (e) {
          consecutiveFails++;
          const ageSinceSuccessSec = lastSuccessAt
            ? Math.floor((Date.now() - lastSuccessAt) / 1000)
            : null;
          if (consecutiveFails >= OFFLINE_AFTER_FAILS || !lastSuccessAt) {
            setPill('offline');
          } else {
            setPill('stale', ageSinceSuccessSec);
          }
        }
      }

      pollOnce();
      setInterval(pollOnce, POLL_INTERVAL_MS);

      // ====== AI narrative polling ======
      // Pulls Fly.io's regenerated narratives every 30s and slots them into
      // the matching DOM sections. Each known-applied narrative is recorded
      // in `seenNarratives` so re-application is a no-op until a fresher
      // generated_at_utc shows up.
      const seenNarratives = {};   // event -> generated_at_utc string
      async function pollNarratives() {
        try {
          const resp = await fetch(NARR_API, { cache: 'no-store' });
          if (!resp.ok) return;
          const data = await resp.json();
          const narrs = data.narratives || {};
          Object.entries(narrs).forEach(([event, narr]) => {
            const stamp = narr.generated_at_utc || '';
            if (seenNarratives[event] === stamp) return;
            seenNarratives[event] = stamp;
            applyNarrativeUpdate(event, narr);
          });
          // Reflect server-side enabled flag + most-recent narrative age
          // in the top-bar AI pill.
          if (typeof window._setAiPillState === 'function') {
            const stamps = Object.values(narrs)
              .map(n => n && n.generated_at_utc)
              .filter(Boolean)
              .sort();
            const latest = stamps.length ? stamps[stamps.length - 1] : null;
            window._setAiPillState(!!data.enabled, latest);
          }
        } catch (_) { /* silent — best-effort */ }
      }
      // Pulse the timestamps every 30s so "updated N min ago" stays current
      // even on a quiet news day where no new narrative arrives.
      function tickNarrativeAges() {
        document.querySelectorAll('[data-narr-generated]').forEach(el => {
          const ts = el.dataset.narrGenerated;
          if (!ts) return;
          const mins = Math.max(0, Math.floor((Date.now() - new Date(ts).getTime()) / 60000));
          const ageEl = el.querySelector('.narr-age');
          if (ageEl) {
            ageEl.textContent = mins === 0 ? 'just now' : `${mins} min ago`;
          }
        });
      }
      pollNarratives();
      setInterval(pollNarratives,  NARR_POLL_MS);
      setInterval(tickNarrativeAges, NARR_POLL_MS);

      // ====== Session replay (FVGC signal retrospective) ======
      // Polls Fly.io's /api/play-history every 30s. Fly runs the canonical
      // FVGC engine on today's aggregated 30s session bars and returns
      // both raw signals and a per-play match table.
      const PLAY_HISTORY_API = 'https://nq-live-snapshot.fly.dev/api/play-history';
      const PLAY_HIST_POLL_MS = 30000;
      let lastPlayHistoryAt = 0;
      async function pollPlayHistory() {
        try {
          const resp = await fetch(PLAY_HISTORY_API, { cache: 'no-store' });
          if (!resp.ok) return;
          const data = await resp.json();
          lastPlayHistoryAt = Date.now();
          // Expose to outer scope so play-detail confluence evaluation
          // can answer "did 1m/3m FVGC fire today?" — see _evalConfluence.
          window.__PLAY_HISTORY = data;
          // Re-decorate any open detail pane so confluence ✓/✕ markers
          // catch up with the freshest signal data without requiring a
          // re-click.
          if (typeof refreshOpenDetailConfluences === 'function') {
            try { refreshOpenDetailConfluences(); } catch (_) {}
          }
        } catch (_) { /* silent — best-effort */ }
      }
      pollPlayHistory();
      setInterval(pollPlayHistory, PLAY_HIST_POLL_MS);
    }

    // Resolve which DOM element should host a given narrative event.
    //   or_5min_lock / or_15min_lock / or_45min_lock → Range Briefing card
    //   play:<name>:<state>                          → detail pane narrative
    //                                                  for that play (if open)
    function _narrativeTarget(event) {
      if (event === 'or_5min_lock' || event === 'or_15min_lock' || event === 'or_45min_lock') {
        const card = document.querySelector('.range-card');
        if (!card) return null;
        // Reuse the morning .narrative slot if present, else create one and
        // pin it just before the .range-action block.
        let host = card.querySelector('[data-narr-host="range_briefing"]');
        if (!host) {
          host = document.createElement('div');
          host.dataset.narrHost = 'range_briefing';
          host.className = 'narrative';
          const anchor = card.querySelector('.range-action');
          if (anchor) card.insertBefore(host, anchor);
          else card.appendChild(host);
        }
        return host;
      }
      if (event.startsWith('play:')) {
        const name = event.split(':', 3)[1];
        // The detail pane has the AI narrative div as the last `.narrative`
        // inside the active matrix-detail. We tag the .narrative produced by
        // renderMatrixDetail with the play name (see narrative() helper).
        const safe = (window.CSS && CSS.escape) ? CSS.escape(name) : name;
        return document.querySelector(`[data-narr-host="play:${safe}"]`);
      }
      return null;
    }

    // Render a narrative into its target host. The host gets:
    //   - the fresh prose
    //   - a "✨ AI · updated N min ago · <trigger>" tag
    //   - a brief glow animation so the user notices the swap
    function applyNarrativeUpdate(event, narr) {
      const host = _narrativeTarget(event);
      if (!host) return;
      const triggerLabel = ({
        'or_5min_lock':  '5-min OR locked',
        'or_15min_lock': '15-min OR locked',
        'or_45min_lock': '45-min OR locked',
      })[event] || (event.startsWith('play:') ? 'play state changed' : event);
      const generatedAt = narr.generated_at_utc || new Date().toISOString();
      const mins = Math.max(0, Math.floor((Date.now() - new Date(generatedAt).getTime()) / 60000));
      const ageTxt = mins === 0 ? 'just now' : `${mins} min ago`;
      host.dataset.narrGenerated = generatedAt;
      host.innerHTML = `
        <div class="narr-tag">
          <span class="narr-pulse">✨ AI</span>
          <span class="narr-trigger">${triggerLabel}</span>
          <span class="narr-age mute mono">${ageTxt}</span>
        </div>
        <div class="narr-body">${narr.text || ''}</div>
      `;
      host.classList.add('narrative-just-updated');
      setTimeout(() => host.classList.remove('narrative-just-updated'), 4000);
    }

    // Per-play narrative trigger — fires when the dashboard detects a play
    // transition into ARMED / MISSED / DONE. Posts to Fly.io which enqueues
    // a regen. Idempotent on the server side (same event for the day = no-op).
    const _playEventSent = {};
    function maybeTriggerPlayNarrative(p, st) {
      if (!st || !st.label) return;
      // Only fire on meaningful destination states.
      const stable = ['ARMED', 'MISSED', 'DONE', 'DONE · ARMED'];
      if (!stable.includes(st.label)) return;
      const key = `play:${p.name}:${st.label}`;
      if (_playEventSent[key]) return;
      _playEventSent[key] = true;
      const NARR_TRIGGER_API = 'https://nq-live-snapshot.fly.dev/api/narrative-trigger';
      const fired  = (p._fired_factor_ids  || []);
      const missed = (p._missed_factor_ids || []);
      const proj   = p.projection || {};
      const liveCount = p._live_count != null ? p._live_count : p.preopen_count;
      fetch(NARR_TRIGGER_API, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          event: key,
          extra: {
            count: liveCount,
            max: proj.max_count,
            fired_factors: fired,
            missed_factors: missed,
            action: proj.max_tier?.action || '',
          },
        }),
      }).catch(() => { /* silent — best-effort */ });
    }

    // ========================================================
    // Renderers
    // ========================================================

    // ====== Decision flow: column renderers ======

    function renderConditions(po, cal, fc, factors, mp) {
      const col = h('div', {class:'flow-col'});
      col.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '1'),
        h('span', {class:'t'}, 'PRE-MARKET'),
        h('span', null, 'CONDITIONS')));

      // Sizing tier deliberately NOT shown here — it gets the dedicated
      // Range Briefing card below. This column is just the verifiable
      // pre-market data points the trader needs to confirm.

      const gap = po.gap || {};
      const ovr = po.overnight || {};
      const pr = po.prior_rth || {};

      // Rows are tuples: [label, value, valueClass, sub, liveField?]
      // liveField tags the value span with data-live-field so the live
      // poller can update it in place when Fly.io snapshot arrives.
      const rows = [];
      // Always emit Price + Gap rows even if morning data missing — live
      // overlay will populate them shortly. Avoids layout jump.
      rows.push(['Price',
                 po.current_price != null ? fmtPrice(po.current_price) : '—',
                 '', po.current_price_ts || '', 'price']);
      rows.push(['Gap',
                 gap.pts != null ? fmtPts(gap.pts) : '—',
                 gap.pts == null ? '' : (gap.pts >= 0 ? 'up' : 'down'),
                 gap.pct != null ? fmtPts(gap.pct) + '%' : '',
                 'gap']);
      if (ovr.range != null) {
        const tag = ovr.tight ? 'TIGHT' : ovr.wide ? 'WIDE' : '';
        rows.push(['Overnight', `${Math.round(ovr.range)}p ${(ovr.direction || '').toLowerCase()}`,
                   ovr.tight || ovr.wide ? 'warn' : '', tag, 'overnight']);
      } else {
        rows.push(['Overnight', '—', '', '', 'overnight']);
      }
      if (pr.close_position != null) {
        const pcp = pr.close_position;
        const pcpStr = `close@${(pcp * 100).toFixed(0)}%`;
        const cls = pcp < 0.33 ? 'down' : pcp > 0.66 ? 'up' : '';
        rows.push(['Prior RTH', pcpStr, cls,
                   pcp < 0.33 ? 'WEAK' : pcp > 0.66 ? 'STRONG' : 'MID',
                   'prior_rth_position']);
      } else if (pr.close != null) {
        rows.push(['Prior RTH', fmtPrice(pr.close), '', '', 'prior_rth_close']);
      } else {
        rows.push(['Prior RTH', '—', '', '', 'prior_rth_close']);
      }
      if (cal && !cal.unknown) {
        const evts = (cal.events || []).filter(e => (e.impact||'').toLowerCase() === 'high');
        rows.push(['Calendar',
                   evts.length ? `${evts.length} HIGH` : 'CLEAR',
                   evts.length ? 'warn' : '',
                   evts.length ? evts.map(e => e.time_et).filter(Boolean).join(' ') : '']);
        rows.push(['FOMC', cal.is_fomc_week ? 'YES' : 'no',
                   cal.is_fomc_week ? 'bad' : '', '']);
      }
      // Day type
      rows.push(['Day', cal.day_of_week || '—', '', '']);
      // Regime + opex
      const active = factors.active || [];
      const regimeBull = active.includes('regime_bull');
      const regimeBear = active.includes('regime_bear');
      if (regimeBull || regimeBear) {
        rows.push(['Regime', regimeBull ? 'BULL 60d' : 'BEAR 60d',
                   regimeBull ? 'up' : 'down', '']);
      }
      const opex = active.includes('is_opex_week');
      if (opex) rows.push(['Opex Week', 'YES', 'warn', '']);

      rows.forEach(([l, v, cls, sub, liveField]) => {
        const valAttrs = {class: 'v ' + (cls || '')};
        if (liveField) valAttrs['data-live-field'] = liveField;
        col.appendChild(h('div', {class:'cond-row'},
          h('span', {class:'l'}, l),
          h('span', valAttrs,
            v, sub ? h('span', {class:'sub', 'data-live-sub': liveField || ''}, sub) : null)));
      });

      return col;
    }

    // ====== New time-grouped candidates + selection-driven detail pane ======

    function renderTimeGroupedCandidates(candidates, onClick) {
      const col = h('div', {class:'flow-col'});
      col.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '2'),
        h('span', {class:'t'}, 'PLAY'),
        h('span', null, 'CANDIDATES')));

      if (!candidates.length) {
        col.appendChild(h('div', {class:'empty'}, 'No candidates today.'));
        return col;
      }

      // Group by window
      const groups = new Map();
      WINDOW_ORDER.forEach(w => groups.set(w, []));
      candidates.forEach(p => {
        const w = primaryWindow(p);
        if (!groups.has(w)) groups.set(w, []);
        groups.get(w).push(p);
      });

      // Sort within each group: non-vetoed first, then by confluence count (matrix) / WR (playbook)
      groups.forEach((plays) => {
        plays.sort((a, b) => {
          if (a.veto_active && !b.veto_active) return 1;
          if (b.veto_active && !a.veto_active) return -1;
          const aScore = a._kind === 'matrix' ? a.preopen_count : 0;
          const bScore = b._kind === 'matrix' ? b.preopen_count : 0;
          return bScore - aScore;
        });
      });

      const windowLabels = {
        '9:30-9:45':   'W1 · 9:30–9:45',
        '9:45-10:00':  'W2 · 9:45–10:00',
        '10:00-10:15': 'W3 · 10:00–10:15',
        'Any':         'Any window',
      };

      // Render windows in order: matrix W1/W2/W3 first, then any non-
      // standard windows by start time (e.g. a 9:30-9:37 short play that
      // doesn't fit a W bucket), then 'Any' last. Used to silently skip
      // anything not in WINDOW_ORDER — meaning the FVGC Off of 930 Candle
      // play with window '9:30-9:37' bucketed but never rendered.
      const parseStartMin = (w) => {
        const m = String(w || '').match(/(\d{1,2}):(\d{2})/);
        return m ? parseInt(m[1],10)*60 + parseInt(m[2],10) : 9999;
      };
      const extraWindows = [...groups.keys()]
        .filter(w => !WINDOW_ORDER.includes(w))
        .sort((a, b) => parseStartMin(a) - parseStartMin(b));
      const renderOrder = [
        ...WINDOW_ORDER.filter(w => w !== 'Any'),
        ...extraWindows.filter(w => w !== 'Any'),
        'Any',
      ];

      renderOrder.forEach(w => {
        const plays = groups.get(w);
        if (!plays || !plays.length) return;
        // Build a label for non-standard windows (just the time range).
        const label = windowLabels[w] || (w === 'Any' ? 'Any window' : w);
        const sec = h('div', {class:'window-section', 'data-window': w});
        sec.appendChild(h('div', {class: 'window-header' + (w === 'Any' ? ' win-any' : '')},
          h('span', {class:'w-bar'}),
          h('span', null, label),
          h('span', {class:'w-status'}),
          h('span', {class:'w-count'}, `${plays.length}`)));
        plays.forEach(p => sec.appendChild(renderCandidateCard(p, onClick)));
        col.appendChild(sec);
      });

      return col;
    }

    function renderCandidateCard(p, onClick) {
      const isVeto = !!p.veto_active;
      const isMatrix = p._kind === 'matrix';

      // State badge — time-aware. Order of precedence:
      //   1. Hard veto (regardless of time) wins.
      //   2. Time bucket relative to play's window:
      //      - 'wait'      → WAIT     (pre-window or future briefing)
      //      - 'passed'    → DONE     (window already closed for the day)
      //      - 'in_window' → LIVE / ARMED based on confluence
      let stateClass, stateLabel;
      const timeState = timeStateForPlay(p);
      if (isVeto) {
        stateClass = 'veto'; stateLabel = 'VETO';
      } else if (timeState === 'wait') {
        stateClass = 'wait'; stateLabel = 'WAIT';
      } else if (timeState === 'passed') {
        stateClass = 'passed'; stateLabel = 'DONE';
      } else {
        // In window (or timeState couldn't be computed — treat as in-window)
        if (isMatrix) {
          const maxAction = (p.projection?.max_tier?.action || '').toUpperCase();
          if (maxAction.includes('TAKE')) { stateClass = 'live'; stateLabel = 'LIVE'; }
          else { stateClass = 'wait'; stateLabel = 'WAIT'; }
        } else {
          // Playbook in-window — uses Notion status
          const s = (p.status || 'idea').toLowerCase();
          if (s === 'verified')         { stateClass = 'live'; stateLabel = 'LIVE'; }
          else if (s === 'backtesting') { stateClass = 'wait'; stateLabel = 'BACKTEST'; }
          else                          { stateClass = 'wait'; stateLabel = (p.status || 'idea').toUpperCase(); }
        }
      }

      // Backtesting cohort gets a distinct visual treatment so the trader
      // can tell at a glance "engine is watching this, but don't risk
      // capital yet." Same applies to the state badge below.
      const isMonitoring = !isMatrix
        && (p.status || '').toLowerCase() === 'backtesting';
      const cardCls = 'play-card '
        + (isVeto ? 'veto'
           : stateClass === 'passed' ? 'passed'
           : stateClass === 'wait' ? 'wait' : '')
        + (isMonitoring ? ' monitor' : '');
      const card = h('div', {class: cardCls, 'data-key': playKey(p)});

      const dir = (p.direction || 'both').toLowerCase();

      // Header row — backtesting plays get a MONITOR pip next to the name
      // so the user reads "this is observation-only" before reading state.
      card.appendChild(h('div', {class:'ph'},
        h('div', {class:'pname'},
          h('span', {class: 'badge-dir ' + dir, style:'font-size:8px;'}, dir.toUpperCase()),
          h('span', null, p.name),
          isMonitoring ? h('span', {class:'monitor-tag mono'}, 'MONITOR') : null),
        h('span', {class: 'pstate ' + stateClass}, stateLabel)));

      // ===== Standardized body: [indicator] [meta] [stats] =====
      // Indicator: confluence dots (matrix) | status dot (playbook)
      // Meta:      "1/5 · +2" (matrix)      | "Tier A" (playbook)
      // Stats:     WR · PF · n  (both, right-aligned, consistent width)
      let indicator, metaText, wr, pf, n;

      if (isMatrix) {
        const dots = [];
        for (let i = 0; i < p.max_preopen; i++) {
          dots.push(h('div', {class: 'dd' + (i < p.preopen_count ? ' on' : '')}));
        }
        // Each "maybe" dot is tagged with its post_pending factor id so the
        // live overlay can flip it to "on" when intraday_factors[id] === true.
        for (const f of (p.post_pending || [])) {
          dots.push(h('div', {
            class: 'dd maybe',
            'data-pending-factor': f.id,
          }));
        }
        indicator = h('div', {class:'conf-mini'}, dots);
        if (isVeto) {
          metaText = (p.active_vetoes || []).map(v => v.id).join(', ').slice(0, 32) || 'veto';
        } else {
          metaText = `${p.preopen_count}/${p.max_preopen}`
            + ((p.post_pending || []).length ? ` · +${p.post_pending.length}` : '');
        }
        // Parse "%WR" and "PF" from tier notes. Decimals matter — "64.5% WR"
        // must capture "64.5", not "5". Fall back from max_tier to min_tier when
        // max_tier is unlock-only / has no clean numbers.
        const parseTierStats = (text) => {
          if (!text) return {wr: null, pf: null};
          const wrM = text.match(/(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)\s*%\s*WR/i);
          const pfM = text.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);
          return {wr: wrM ? wrM[1] : null, pf: pfM ? pfM[1] : null};
        };
        const maxStats = parseTierStats(p.projection?.max_tier?.note);
        const minStats = parseTierStats(p.projection?.min_tier?.note);
        wr = (maxStats.wr || minStats.wr);
        pf = (maxStats.pf || minStats.pf);
        if (wr) wr += '%';
        // n = sample size from cross-referenced playbook entry. Falls back to
        // setup frequency (% of days) if no playbook match found.
        n = p._sample_size != null
          ? String(p._sample_size)
          : p.expectancy?.setup_pct_of_all_days != null
            ? `${p.expectancy.setup_pct_of_all_days}%/d`
            : null;
      } else {
        // Playbook: indicator is a single status dot; meta is tier
        indicator = h('div', {class:'conf-mini'},
          h('div', {class: 'dd on'}));
        metaText = p.tier ? `Tier ${p.tier}` : '—';
        const wrMatch = (p.wr_base || '').match(/[\d.]+%/);
        wr = wrMatch ? wrMatch[0] : null;
        pf = p.pf_base != null ? Number(p.pf_base).toFixed(2) : null;
        n  = p.sample_size != null ? String(p.sample_size) : null;
      }

      card.appendChild(h('div', {class:'pbody pbody-standard'},
        indicator,
        h('span', {class:'pmeta'}, metaText),
        h('div', {class:'pstats'},
          h('span', {class:'stat-cell'}, 'WR ', h('b', null, wr || '—')),
          h('span', {class:'stat-cell'}, 'PF ', h('b', null, pf || '—')),
          h('span', {class:'stat-cell'}, 'n ', h('b', null, n || '—')))));

      card.addEventListener('click', () => onClick(p));
      return card;
    }

    // ====== Detail-pane renderers (column 3) ======

    function renderDetailEmpty(candidates) {
      const wrap = h('div', {class:'detail-empty'});
      wrap.appendChild(h('div', {class:'icon'}, '◎'));
      wrap.appendChild(h('div', {class:'hint'}, 'Select a candidate'));
      wrap.appendChild(h('div', {class:'arrow'}, '◀'));

      // Compact "what to watch" summary
      const nonVeto = candidates.filter(p => !p.veto_active);
      const matrixTop = nonVeto
        .filter(p => p._kind === 'matrix')
        .sort((a, b) => b.preopen_count - a.preopen_count)[0];
      const verified = nonVeto.filter(p => p._kind === 'playbook' && (p.status || '').toLowerCase() === 'verified').length;
      const total = nonVeto.length;
      const vetoed = candidates.length - nonVeto.length;

      const summary = h('div', {class:'summary'},
        h('div', null,
          h('b', null, `${total}`), ' active candidates · ',
          h('b', null, `${vetoed}`), ' vetoed'),
        matrixTop ? h('div', {style:'margin-top:6px;'},
          'Highest matrix confluence: ',
          h('b', null, `${matrixTop.name}`),
          ` (${matrixTop.preopen_count}/${matrixTop.max_preopen})`) : null,
        h('div', {style:'margin-top:6px;'},
          h('b', null, `${verified}`), ' verified playbook plays today'));
      wrap.appendChild(summary);
      return wrap;
    }

    // ====== PLAY DETAIL — actionable trade guide (col 3) ======
    // Layout, top to bottom:
    //   1. Detail head — name, direction badge, window, veto chip if any
    //   2. STATE BANNER — current play state (WAIT/LIVE/ARMED/MISSED/DONE/
    //      VETO) + confluence dot tracker mirroring col-2's mini dots
    //      (bigger), big-letter count "X/Y", and the recommended ACTION
    //      string from the relevant projection tier.
    //   3. CONFLUENCE CHECKLIST — single ordered list of all factors with
    //      live state per row (✓ fired / ○ pending / ✕ missed). Replaces
    //      the previous "Active Pre-Open" + "Pending Post-Open" split.
    //   4. PROJECTION strip — IF/IF cards (unchanged shape, overflow fixed)
    //   5. EXECUTION GUIDE — derived actionable checklist: window, size,
    //      management (parsed from action string), kill switches.
    //   6. EXPECTANCY — unchanged
    //   7. Note / Playbook link / AI narrative
    function renderMatrixDetail(p) {
      const wrap = h('div');
      const dir = (p.direction || 'both').toLowerCase();

      // -------- Head --------
      wrap.appendChild(h('div', {class:'detail-head'},
        h('div', {class:'detail-title'}, p.name),
        h('div', {class:'detail-sub'},
          h('span', {class:'badge-dir ' + dir}, dir.toUpperCase()),
          h('span', null, p.window),
          p.veto_active ? h('span', {class:'chip veto'}, '🚫 VETO') : null,
          h('span', {class:'mute'}, `${p.preopen_count}/${p.max_preopen} pre-open`))));

      // -------- State banner (live-updatable) --------
      // Single source of truth — same logic the card uses, so the detail
      // banner can never disagree with the col-2 chip (incl. post-window
      // DONE, which used to be missing here).
      const firedSet  = new Set(p._fired_factor_ids  || []);
      const missedSet = new Set(p._missed_factor_ids || []);
      const liveCount = p._live_count != null ? p._live_count : p.preopen_count;
      const pending   = p.post_pending || [];
      const unknownPending = pending.filter(f =>
        !firedSet.has(f.id) && !missedSet.has(f.id));
      const proj = p.projection || {};
      const projMax = proj.max_count ?? 0;
      const st = _computeMatrixState(p);
      const stateLabel = st.label;
      const stateCls   = st.cls;
      const actionLine = st.action;

      // Confluence dot tracker — mirrors the mini dots in col 2 but bigger.
      // Renders ALL factors (preopen + pending) so the tracker is visually
      // identical to what's shown on the card.
      const trackerDots = h('div', {class:'conf-tracker'});
      (p.preopen_active || []).forEach(_ => {
        trackerDots.appendChild(h('span', {class:'dd big on'}));
      });
      pending.forEach(f => {
        let cls = 'dd big maybe';
        if (firedSet.has(f.id))  cls = 'dd big on';
        if (missedSet.has(f.id)) cls = 'dd big missed';
        trackerDots.appendChild(h('span', {class: cls, 'data-pending-factor': f.id}));
      });

      const stateBanner = h('div', {
        class:'detail-state-banner ' + stateCls,
        'data-detail-play': p.name,
      },
        h('div', {class:'dsb-top'},
          h('span', {class:'dsb-chip ' + stateCls, 'data-detail-state-chip': p.name}, stateLabel),
          h('span', {class:'dsb-count mono', 'data-detail-state-count': p.name},
            h('b', null, String(liveCount)), '/', String(p.max_preopen),
            unknownPending.length > 0
              ? h('span', {class:'dim'}, ` · +${unknownPending.length}`)
              : null),
          trackerDots),
        h('div', {class:'dsb-action ' + stateCls, 'data-detail-state-action': p.name},
          actionLine));
      wrap.appendChild(stateBanner);

      // -------- Veto factor list (if vetoed) --------
      if (p.veto_active) {
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'ACTIVE VETOES'),
          ...(p.active_vetoes || []).map(v => h('div', {class:'factor-line veto'},
            h('span', {class:'marker'}, '✕'),
            h('span', {class:'lift'}, `${v.lift_pp > 0 ? '+' : ''}${v.lift_pp}pp`),
            h('span', {class:'desc'}, v.desc),
            h('span', {class:'meta'}, v.id)))));
        if (p.extra_note) wrap.appendChild(h('div', {class:'extra-note'}, p.extra_note));
        if (p.notion_url) wrap.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
        wrap.appendChild(playNarrative(p));
        return wrap;
      }

      // -------- Confluence checklist (unified) --------
      // Single ordered list. data-pending-factor on every row (including
      // already-fired ones, harmlessly idempotent) so the live updater
      // hits any row when its factor resolves.
      // Include every factor on the play — fired, missed pre-open, OR
      // still-pending in window — so the trader sees the full Notion
      // checklist (e.g. "3/7 fired" for M1 Long instead of just listing
      // the 3 that fired). preopen_missed is emitted by the morning
      // briefing now; falls back gracefully for older snapshots.
      const preopenActive = p.preopen_active || [];
      const preopenMissed = p.preopen_missed || [];
      const totalFactors  = preopenActive.length + preopenMissed.length + pending.length;
      const firedCount    = preopenActive.length
                          + pending.filter(f => firedSet.has(f.id)).length;
      const checklist = h('div', {class:'detail-section'},
        h('div', {class:'detail-label'},
          `CONFLUENCE CHECKLIST · ${firedCount}/${totalFactors} fired`));
      const rows = [];
      preopenActive.forEach(f => rows.push({
        f, state: 'on', marker: '✓', whenTxt: 'pre-open · fired',
      }));
      preopenMissed.forEach(f => rows.push({
        f, state: 'missed', marker: '✕', whenTxt: 'pre-open · missed',
      }));
      pending.forEach(f => {
        if (firedSet.has(f.id))       rows.push({f, state: 'on',      marker: '✓', whenTxt: 'fired'});
        else if (missedSet.has(f.id)) rows.push({f, state: 'missed',  marker: '✕', whenTxt: 'missed'});
        else                          rows.push({f, state: 'pending', marker: '○', whenTxt: f.when || 'live'});
      });
      rows.forEach(r => {
        const row = h('div', {
          class: `factor-line ${r.state}`,
          'data-pending-factor': r.f.id,
        },
          h('span', {class:'marker'}, r.marker),
          h('span', {class:'lift'}, `${r.f.lift_pp >= 0 ? '+' : ''}${r.f.lift_pp}pp`),
          h('span', {class:'desc'}, r.f.desc),
          h('span', {class:'meta'},
            h('span', {class:'when'}, r.whenTxt), r.f.id));
        checklist.appendChild(row);
      });
      wrap.appendChild(checklist);

      // -------- Projection strip --------
      // Both action strings need the UC version for cls() — earlier rewrite
      // renamed minAction → minActionUC but missed declaring maxActionUC.
      // Result: clicking any matrix play with proj.locked=false threw
      // ReferenceError: maxAction is not defined, detail pane silently went
      // blank, looked like the click was being ignored. (Observed 2026-05-26
      // when M1 Short was the first matrix play whose projection was still
      // in flux — vetoed/armed plays bypass this branch via earlier returns.)
      const cls = (action) => action.includes('TAKE') ? 'take' : 'skip';
      const minActionUC = (proj.min_tier?.action || '').toUpperCase();
      const maxActionUC = (proj.max_tier?.action || '').toUpperCase();
      const projStrip = h('div', {class:'projection-strip'});
      if (proj.locked) {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minActionUC) + ' active'},
          h('div', {class:'pl'}, `COUNT ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
      } else {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minActionUC)},
          h('div', {class:'pl'}, `IF ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(maxActionUC) + ' active'},
          h('div', {class:'pl'}, `IF ${proj.max_count}`),
          h('div', {class:'pa'}, proj.max_tier.action),
          h('div', {class:'pn'}, proj.max_tier.note || '')));
      }
      wrap.appendChild(h('div', {class:'detail-section'},
        h('div', {class:'detail-label'}, 'PROJECTION'),
        projStrip));

      // -------- Execution guide --------
      // Actionable checklist parsed from the available play data. Some of
      // these come from string-parsing the projection action — not ideal
      // long-term; the cleaner version waits on a Notion schema bump that
      // adds entry/stop/target/kill fields per play. For now we extract
      // what we can so the trader has the whole "how to take this trade"
      // surface in one place.
      const exec = h('div', {class:'detail-section'},
        h('div', {class:'detail-label'}, 'HOW TO TAKE THIS TRADE'));
      const execList = h('div', {class:'exec-checklist'});

      // 1. WINDOW
      execList.appendChild(_execRow('1', 'WINDOW',
        `Entry window: ${p.window}. Wait for FVGC engine signal in this band.`));

      // 2. DIRECTION + SIZE — derived from projection.max_tier
      const sizeBits = _parseSizeFromAction(proj.max_tier?.action || '');
      execList.appendChild(_execRow('2', 'SIZE & DIRECTION',
        `${dir.toUpperCase()} · ${sizeBits.size}` +
        (sizeBits.scaleNote ? ` (${sizeBits.scaleNote})` : '')));

      // 3. MANAGEMENT — stop/BE/target rules parsed from action string
      const mgmt = _parseManagementFromAction(proj.max_tier?.action || '');
      execList.appendChild(_execRow('3', 'MANAGEMENT', mgmt));

      // 4. THRESHOLD — confluence count needed (mirror of state action)
      execList.appendChild(_execRow('4', 'THRESHOLD',
        `Need ${projMax}/${p.max_preopen} confluence to fire ` +
        `(currently ${liveCount}). Below tier = SKIP.`));

      // 5. KILL SWITCHES — vetoes + common kill phrases from extra_note
      const kills = _extractKills(p);
      execList.appendChild(_execRow('5', 'KILL SWITCHES', kills));

      exec.appendChild(execList);
      wrap.appendChild(exec);

      // -------- Expectancy --------
      if (p.expectancy) {
        const e = p.expectancy;
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'EXPECTANCY'),
          h('div', {class:'pd-exp'},
            'Baseline (no veto, conf≥', h('b', null, e.tradeable_threshold), '): ',
            h('b', null, `${e.setup_pct_of_all_days}%`), ' of days · fires ',
            h('b', null, `${e.fire_rate_pct}%`), ' · EV ',
            h('b', null, `+${e.ev_per_setup_day_R}R/setup-day`),
            e.fire_rate_now_pct != null
              ? [' · today fires ~', h('b', null,
                  e.fire_rate_now_pct === e.fire_rate_max_pct || e.fire_rate_max_pct == null
                    ? `${e.fire_rate_now_pct}%`
                    : `${e.fire_rate_now_pct}-${e.fire_rate_max_pct}%`)]
              : null)));
      }

      if (p.extra_note) wrap.appendChild(h('div', {class:'extra-note'}, p.extra_note));
      if (p.notion_url) wrap.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
      wrap.appendChild(playNarrative(p));
      return wrap;
    }

    // ---- Helpers for the EXECUTION GUIDE ----
    function _execRow(num, label, body) {
      return h('div', {class:'ex-row'},
        h('span', {class:'ex-num mono'}, num),
        h('div', {class:'ex-body'},
          h('div', {class:'ex-label mono'}, label),
          h('div', {class:'ex-text'}, body)));
    }
    function _parseSizeFromAction(action) {
      // Examples seen in projection.action:
      //   "TAKE full size, BE@1R -> 3R fixed"
      //   "TAKE same size — do NOT scale up"
      //   "TAKE full size, runner mode (TP@5R no-BE)"
      const a = (action || '').toLowerCase();
      let size = 'Per playbook';
      let scaleNote = '';
      if (a.includes('full size'))       size = 'Full size';
      else if (a.includes('half size'))  size = 'Half size';
      else if (a.includes('same size'))  size = 'Same size as min tier';
      else if (a.includes('min size'))   size = 'Minimum size';
      if (a.includes('do not scale') || a.includes("don't scale"))
        scaleNote = 'do NOT scale up';
      else if (a.includes('runner mode')) scaleNote = 'runner mode';
      return {size, scaleNote};
    }
    function _parseManagementFromAction(action) {
      // Pull the bits after the size token. Falls back to the raw string.
      if (!action) return 'Per playbook — manage by FVGC engine signal.';
      const a = action.trim();
      // Strip the leading "TAKE <something>, " prefix to surface the
      // management portion: "BE@1R -> 3R fixed" / "runner mode (TP@5R no-BE)" / etc.
      const stripped = a.replace(/^TAKE\s+[^,\—]+[,\—]\s*/i, '');
      if (stripped && stripped !== a) return stripped + '.';
      return a + '.';
    }
    function _extractKills(p) {
      // Surface the most actionable kill conditions:
      //   - any active vetoes (won't apply if veto_active was false but
      //     a row may be lurking with lift_pp neutral)
      //   - simple keyword scrape of extra_note for kill phrases
      const bits = [];
      (p.active_vetoes || []).forEach(v => bits.push(`${v.id} (${v.desc})`));
      const note = (p.extra_note || '').toLowerCase();
      if (/avoid|skip|kill|stand[- ]?down/.test(note))
        bits.push('See note below for skip conditions');
      if (!bits.length) bits.push('Standard FVGC kills: news hit, OR locks Q1/Q2, both OR sides swept.');
      return bits.join(' · ');
    }

    // ====== Confluence live evaluator ======
    // Given an intraday_confluence entry from a play + the play itself,
    // return { state: 'fired' | 'missed' | 'unknown', detail: string|null }
    // by checking live snapshot data + today's engine signals.
    //
    // We're conservative: any factor whose source data isn't available
    // returns 'unknown' (rendered as a dim '·') rather than guessing.
    // Better to under-report fires than mislead.
    function _evalConfluence(c, p) {
      const snap = window.__LIVE_SNAP || {};
      const playHist = window.__PLAY_HISTORY || {};
      const briefingPO = (window.BRIEFING_DATA?.pre_open) || {};
      const factors = snap.intraday_factors || {};
      const rawByTfDir = playHist.raw_signals_by_tf_direction || {};

      // Parse the play's window into start/end minutes-of-day for the
      // FVGC-fires-in-window checks below.
      function _windowMins() {
        const wins = (Array.isArray(p.window) ? p.window : [p.window || ''])
          .map(s => String(s || '').trim()).filter(Boolean);
        if (!wins.length) return null;
        const m = wins[0].match(/(\d+):(\d+)\s*-\s*(\d+):(\d+)/);
        if (!m) return null;
        return {
          start: parseInt(m[1],10)*60 + parseInt(m[2],10),
          end:   parseInt(m[3],10)*60 + parseInt(m[4],10),
        };
      }
      function _fvgcInWindow(tf, dir) {
        const sigs = rawByTfDir[`${tf}:${dir}`] || [];
        const win = _windowMins();
        const hits = sigs.filter(s => {
          const ts = s.timestamp_et || '';
          const tm = ts.match(/T(\d+):(\d+)/);
          if (!tm) return false;
          const mins = parseInt(tm[1],10)*60 + parseInt(tm[2],10);
          if (!win) return true;
          return mins >= win.start && mins <= win.end;
        });
        if (!hits.length) return null;
        return hits[0];
      }

      switch (c.id) {
        case 'wide_930_candle': {
          // Proxy via c930_body_top_q (top quartile of 9:30 candle body).
          // Wide body strongly correlates with wide range — close enough
          // until we add a dedicated c930_range_top_q factor server-side.
          const v = factors.c930_body_top_q;
          if (v === true)  return {state:'fired',  detail:'9:30 candle body in top quartile (proxy for wide)'};
          if (v === false) return {state:'missed', detail:'9:30 candle body NOT wide'};
          return {state:'unknown', detail:'9:30 candle data not yet available'};
        }
        case '1m_fvgc_same_day': {
          const hit = _fvgcInWindow('1min', 'short');
          if (hit) return {state:'fired',
                           detail:`fired @ ${hit.time_et_human} · ${hit.variant} · entry ${hit.entry_price}`};
          return {state:'missed', detail:'no 1m short FVGC in window'};
        }
        case '3m_fvgc_same_day': {
          const hit = _fvgcInWindow('3min', 'short');
          if (hit) return {state:'fired',
                           detail:`fired @ ${hit.time_et_human} · ${hit.variant} · entry ${hit.entry_price}`};
          return {state:'missed', detail:'no 3m short FVGC in window (rare — ~4/yr)'};
        }
        case 'top_q_dump_day': {
          // Approximate via 15-min OR width vs stepwise Q4 cutoff in
          // briefing.json.or_forecast.stepwise.thresholds.or_15min[3].
          // True dump-magnitude needs first-15min OPEN→LOW which we don't
          // separately compute today — wide 15-min OR is a reasonable
          // proxy for a high-dump day in either direction.
          const or15 = (snap.or_15min || {}).width;
          const cuts = ((window.BRIEFING_DATA?.or_forecast?.stepwise?.thresholds || {}).or_15min) || [];
          const q4cut = cuts[3];
          if (or15 == null || q4cut == null) return {state:'unknown', detail:'15-min OR not yet locked'};
          if (or15 > q4cut) return {state:'fired',
                                    detail:`15-min OR ${or15.toFixed(0)}pt > Q4 cutoff ${q4cut.toFixed(0)}pt`};
          return {state:'missed',
                  detail:`15-min OR ${or15.toFixed(0)}pt ≤ Q4 cutoff ${q4cut.toFixed(0)}pt`};
        }
        case 'gap_large_down': {
          // ANTI-confluence: triggered means BAD for this play. Use the
          // morning briefing's gap reading (pre_open) — that's the
          // signed gap vs prior close. Threshold -100pt matches
          // common gap_large_down definition elsewhere.
          const gap = briefingPO.gap?.pts;
          if (gap == null) return {state:'unknown', detail:'gap not available'};
          if (gap < -100)  return {state:'fired',  detail:`gap ${gap.toFixed(1)}pt < -100`};
          return {state:'missed', detail:`gap ${gap.toFixed(1)}pt — no large gap-down`};
        }
        case 'gap_down_day': {
          // ANY negative gap counts (Notion: "Stronger when combined with
          // gap down day"). Distinct from gap_large_down (the anti, which
          // requires gap < -100). Threshold for boost is just gap < 0.
          const gap = briefingPO.gap?.pts;
          if (gap == null) return {state:'unknown', detail:'gap not available'};
          if (gap < 0)  return {state:'fired',  detail:`gap ${gap.toFixed(1)}pt — gap-down day`};
          return {state:'missed', detail:`gap ${gap.toFixed(1)}pt — no gap-down`};
        }
        case 'prior_day_down': {
          // Prior RTH closed below where it opened — yesterday was a
          // selling day. Notion flags this as a booster for short FVGCs
          // off the 9:30 candle (sentiment continuation).
          const pr = briefingPO.prior_rth || {};
          const close = pr.close, open = pr.open;
          if (close == null || open == null) {
            return {state:'unknown', detail:'prior RTH OHLC not available'};
          }
          if (close < open) {
            return {state:'fired',
                    detail:`prior RTH: open ${open.toFixed(2)} → close ${close.toFixed(2)} (down day)`};
          }
          return {state:'missed',
                  detail:`prior RTH: open ${open.toFixed(2)} → close ${close.toFixed(2)} (up day)`};
        }
        case 'vol_score_best_cell': {
          // vol_score = ON_range_top_q + prior_day_ATR_top_q + gap_abs_top_q
          // (each 90d rolling, 1 if top quartile else 0). The play's
          // pre_market_sizing.vol_score table flags vol=2 as the best
          // cell (1.25-1.5× size). We approximate the three components
          // from briefing pre_open data — exact 90d percentiles aren't
          // in the briefing yet but the briefing flags "WIDE"/"TIGHT"
          // overnight + has gap_abs.
          const ovr = briefingPO.overnight || {};
          const gap = briefingPO.gap?.pts;
          // Use existing 'wide' flag as proxy for ON_range_top_q.
          const onTopQ = !!ovr.wide;
          // Use atr-ratio-style heuristic: gap_abs > 75pt is roughly top
          // quartile for NQ in recent regime. Imperfect but directional.
          const gapTopQ = gap != null && Math.abs(gap) > 75;
          // prior_day_ATR_top_q: no direct briefing flag; treat as
          // unknown component (won't count toward score).
          const components = [];
          if (onTopQ) components.push('ON_range top-q ✓');
          if (gapTopQ) components.push('gap_abs top-q ✓');
          const score = (onTopQ ? 1 : 0) + (gapTopQ ? 1 : 0);
          // "Best cell" is vol_score=2. We're only measuring 2 of 3
          // components so we treat 2+ as the threshold (best signal we
          // can give without the ATR-percentile data).
          if (score >= 2) {
            return {state:'fired',
                    detail:`vol_score ≈ ${score}+ · ${components.join(', ')}`};
          }
          return {state:'missed',
                  detail:`vol_score ≈ ${score} (need 2+) · ` +
                         `ON=${ovr.wide ? 'wide' : 'normal'}, gap_abs=${gap != null ? Math.abs(gap).toFixed(0) + 'pt' : 'n/a'}`};
        }
      }
      return {state:'unknown', detail:null};
    }

    // Update the "X of N fired" badge in the section header. Counts a
    // positive confluence as "good" when fired; an anti-confluence as
    // "good" when missed (anti not fired = clean day for this play).
    function _updateConfluenceTally(sectionEl, p) {
      const tally = sectionEl.querySelector('[data-conf-tally]');
      if (!tally) return;
      let good = 0, total = 0, anti_fired = 0, unknown = 0;
      (p.intraday_confluences || []).forEach(c => {
        total += 1;
        const ev = _evalConfluence(c, p);
        if (ev.state === 'unknown') { unknown += 1; return; }
        const isAnti = c.polarity === 'negative';
        if (isAnti && ev.state === 'fired') anti_fired += 1;
        const isGood = (isAnti && ev.state === 'missed') ||
                       (!isAnti && ev.state === 'fired');
        if (isGood) good += 1;
      });
      let txt = `${good} / ${total} fired`;
      if (anti_fired) txt += ` · ${anti_fired} anti`;
      if (unknown) txt += ` · ${unknown} unknown`;
      tally.textContent = txt;
      tally.className = 'conf-tally mono ' +
        (anti_fired ? 'anti' : good >= total - unknown ? 'all' : good > 0 ? 'some' : 'none');
    }

    // Called by the play-history poller to refresh confluence markers
    // when fresh signals arrive while a detail pane is open.
    function refreshOpenDetailConfluences() {
      const sec = document.querySelector('[data-play-confluences]');
      if (!sec) return;
      const playName = sec.getAttribute('data-play-confluences');
      const allPlays = (window.BRIEFING_DATA?.active_plays || [])
        .concat(window.BRIEFING_DATA?.matrix_plays || []);
      const p = allPlays.find(x => x.name === playName);
      if (!p) return;
      // Re-eval each row + re-tally. Cheap.
      sec.querySelectorAll('[data-conf-id]').forEach(row => {
        const id = row.getAttribute('data-conf-id');
        const c = (p.intraday_confluences || []).find(x => x.id === id);
        if (!c) return;
        const ev = _evalConfluence(c, p);
        const isAnti = c.polarity === 'negative';
        // Update marker + class only — leave the existing labels alone.
        const marker = row.querySelector('.marker');
        if (ev.state === 'fired') {
          marker.textContent = isAnti ? '⚠' : '✓';
          row.className = isAnti ? 'factor-line veto' : 'factor-line on';
        } else if (ev.state === 'missed') {
          marker.textContent = isAnti ? '✓' : '✕';
          row.className = isAnti ? 'factor-line on' : 'factor-line missed';
        } else {
          marker.textContent = '·';
          row.className = 'factor-line pending';
        }
      });
      _updateConfluenceTally(sec, p);
    }

    function renderPlaybookDetail(p) {
      const wrap = h('div');
      const dir = (p.direction || 'both').toLowerCase();
      const status = (p.status || 'idea').toLowerCase();

      wrap.appendChild(h('div', {class:'detail-head'},
        h('div', {class:'detail-title'}, p.name),
        h('div', {class:'detail-sub'},
          h('span', {class:'badge-dir ' + dir}, dir.toUpperCase()),
          h('span', {class: 'pb-status ' + status}, status),
          p.tier ? h('span', {class:'chip'}, 'Tier ' + p.tier) : null,
          h('span', {class:'mute mono'},
            (normalizeWindows(p)).join(', ')))));

      // -------- State banner --------
      // Playbook plays don't have confluence factors so no dot tracker —
      // just the live state chip + an action sentence. Initial state from
      // the time ticker; live updaters (updatePlayTimeStates, applyLive-
      // PlaybookVerdicts) flip it in place via [data-detail-state-chip].
      const ts = timeStateForPlay(p);
      let initStateCls, initStateLabel, initAction;
      if (p.veto_active) {
        initStateCls = 'veto'; initStateLabel = 'VETOED';
        // Name the specific kill switch that fired (active_vetoes is
        // populated by morning_briefing.py for hard_kill_switches that
        // resolve pre-open — e.g. vix_elevated). Falls back to a
        // generic message when the engine couldn't identify the cause.
        const av = (p.active_vetoes || []).map(v => v.id || v.desc).filter(Boolean);
        initAction = av.length
          ? `Kill switch active: ${av.join(', ')} — skip today.`
          : 'Kill switch active — skip.';
      } else if (ts === 'wait') {
        initStateCls = 'wait'; initStateLabel = 'WAIT';
        initAction = `Pre-window. Watch ${(normalizeWindows(p)).join(', ')}.`;
      } else if (ts === 'passed') {
        initStateCls = 'wait'; initStateLabel = 'DONE';
        initAction = 'Window has passed.';
      } else {
        initStateCls = status === 'verified' ? 'live' : 'wait';
        initStateLabel = status === 'verified' ? 'LIVE' :
                         status === 'backtesting' ? 'BACKTEST' :
                         (p.status || 'idea').toUpperCase();
        initAction = 'In window — trade per the playbook below.';
      }
      wrap.appendChild(h('div', {
        class:'detail-state-banner ' + initStateCls,
        'data-detail-play': p.name,
      },
        h('div', {class:'dsb-top'},
          h('span', {class:'dsb-chip ' + initStateCls, 'data-detail-state-chip': p.name}, initStateLabel)),
        h('div', {class:'dsb-action ' + initStateCls, 'data-detail-state-action': p.name},
          initAction)));

      // Stats row
      const stats = [];
      if (p.wr_base)    stats.push(['WR', p.wr_base]);
      if (p.pf_base)    stats.push(['PF', Number(p.pf_base).toFixed(2)]);
      if (p.sample_size) stats.push(['n', p.sample_size]);
      if (p.frequency)  stats.push(['Freq', p.frequency]);
      if (p.avg_mfe_r)  stats.push(['Avg MFE', `${p.avg_mfe_r}R`]);
      if (p.confidence) stats.push(['Confidence', p.confidence]);

      if (stats.length) {
        const statsBlock = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'STATS'),
          h('div', {class:'mono', style:'font-size:11px;line-height:1.9;color:var(--text-dim);'},
            stats.map((s, i) => h('span', null,
              s[0], ' ', h('b', {style:'color:var(--text);'}, String(s[1])),
              i < stats.length - 1 ? '   ·   ' : ''))));
        wrap.appendChild(statsBlock);
      }

      if (p.description) {
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'DESCRIPTION'),
          h('div', {class:'detail-text'}, p.description)));
      }

      if (p.pre_market_conditions) {
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'PRE-MARKET CONDITIONS'),
          h('div', {class:'detail-text'}, p.pre_market_conditions)));
      }

      // ----- PRE-MARKET FACTORS — fired/missed checklist -----
      // Mirrors the matrix-detail CONFLUENCE CHECKLIST pattern, but for
      // playbook plays that have pre_market_factors set in Notion. Each
      // factor renders as ✓ (fired) or ✕ (missed), with the human-
      // readable description from briefing_config.factors when available.
      // Header shows "X / N fired" tally.
      const pmFired   = p.pre_met_factors    || (p.pre_met    || []).map(f => ({id:f, desc:f}));
      const pmMissed  = p.pre_missing_factors|| (p.pre_missing|| []).map(f => ({id:f, desc:f}));
      const pmTotal   = pmFired.length + pmMissed.length;
      if (pmTotal > 0) {
        const sec = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, `PRE-MARKET FACTORS · ${pmFired.length}/${pmTotal} fired`));
        pmFired.forEach(f => {
          sec.appendChild(h('div', {class:'factor-line on'},
            h('span', {class:'marker'}, '✓'),
            h('span', {class:'lift'}, 'pre-open'),
            h('span', {class:'desc'}, f.desc || f.id),
            h('span', {class:'meta'}, f.id)));
        });
        pmMissed.forEach(f => {
          sec.appendChild(h('div', {class:'factor-line missed'},
            h('span', {class:'marker'}, '✕'),
            h('span', {class:'lift'}, 'missed'),
            h('span', {class:'desc'}, f.desc || f.id),
            h('span', {class:'meta'}, f.id)));
        });
        wrap.appendChild(sec);
      }

      // ----- INTRADAY CONFLUENCES — structured per-factor table -----
      // Each row is live-evaluated against today's data: ✓ (fired),
      // ✕ (missed — or anti-fired, for negative-polarity factors),
      // — (unknown / data not available). A tally above the rows shows
      // "M of N fired" so the trader sees confluence stack at a glance.
      if ((p.intraday_confluences || []).length) {
        const sec = h('div', {class:'detail-section', 'data-play-confluences': p.name},
          h('div', {class:'detail-label'},
            'INTRADAY CONFLUENCES',
            h('span', {class:'conf-tally mono', 'data-conf-tally':''}, '')));
        p.intraday_confluences.forEach(c => {
            const eval_ = _evalConfluence(c, p);
            // For positive confluences: fired=✓ (good), missed=✕ (no),
            //   unknown=· (n/a).
            // For anti-confluences (negative polarity): fired=⚠ (anti
            //   triggered → bad for play); missed=✓ (clean — anti didn't
            //   fire, so it's actually GOOD); unknown=·.
            const isAnti = c.polarity === 'negative';
            let marker, cls;
            if (eval_.state === 'fired') {
              marker = isAnti ? '⚠' : '✓';
              cls = isAnti ? 'factor-line veto' : 'factor-line on';
            } else if (eval_.state === 'missed') {
              marker = isAnti ? '✓' : '✕';
              cls = isAnti ? 'factor-line on' : 'factor-line missed';
            } else {
              marker = '·';
              cls = 'factor-line pending';
            }
            const row = h('div', {class: cls, 'data-conf-id': c.id},
              h('span', {class:'marker'}, marker),
              h('span', {class:'lift'},
                c.lift_pp != null ? `+${c.lift_pp}pp` :
                c.when ? c.when : '·'),
              h('span', {class:'desc'},
                c.desc,
                c.stats ? h('span', {class:'mute mono',
                                     style:'display:block;font-size:10px;margin-top:2px;'},
                            c.stats) : null,
                c.rationale ? h('span', {class:'mute mono',
                                         style:'display:block;font-size:10px;margin-top:2px;'},
                                c.rationale) : null,
                eval_.detail ? h('span', {class:'mono',
                                          style:'display:block;font-size:10px;margin-top:3px;color:var(--cyan);letter-spacing:0.3px;'},
                                eval_.detail) : null),
              c.id ? h('span', {class:'meta'}, c.id) : null);
            sec.appendChild(row);
        });
        wrap.appendChild(sec);
        // Compute + render tally right after the section is in the DOM.
        _updateConfluenceTally(sec, p);
      }

      // ----- PRE-MARKET SIZING (vol_score etc.) — tiered sizing table -----
      const pms = p.pre_market_sizing || {};
      if (pms.vol_score) {
        const vs = pms.vol_score;
        const sec = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'PRE-MARKET SIZING'));
        sec.appendChild(h('div', {class:'detail-text'},
          h('div', null, h('b', null, 'vol_score'), ' = ',
            h('span', {class:'mono'}, vs.computation || '')),
          vs.note ? h('div', {class:'mute mono', style:'font-size:10px;margin-top:4px;'},
                     vs.note) : null));
        const tiers = vs.tiers || {};
        Object.keys(tiers).sort().forEach(k => {
          sec.appendChild(h('div', {class:'factor-line on'},
            h('span', {class:'marker mono'}, `vol=${k}`),
            h('span', {class:'lift'}, ''),
            h('span', {class:'desc'}, tiers[k])));
        });
        wrap.appendChild(sec);
      }

      // ----- HARD KILL SWITCHES — anti-conditions / no-trade -----
      const ks = p.hard_kill_switches || {};
      if (Object.keys(ks).length) {
        const sec = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'KILL SWITCHES'));
        Object.entries(ks).forEach(([id, desc]) => {
          sec.appendChild(h('div', {class:'factor-line veto'},
