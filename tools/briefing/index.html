        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
      }).formatToParts(new Date());
      const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
      clockEl.textContent = `${p.hour}:${p.minute}:${p.second}`;
      const age = dataAgeText();
      if (age) dataAgeEl.textContent = age;
    }
    tickClock();
    setInterval(tickClock, 1000);

    const topbar = h('div', {class:'topbar'},
      h('div', {class:'brand'},
        h('span', {class:'accent'}, 'NQ'), ' BRIEFING'),
      h('div', {class:'spacer'}),
      h('span', {class:'meta-tag mono'}, h('b', null, meta.date || '—'), ' · ', meta.day_of_week || '—'),
      h('span', {class:'meta-tag mono dim'}, generatedLabel),
      dataAgeEl,
      h('span', {class:'now-label'}, 'NOW'),
      clockEl,
      h('span', {class:'now-tz'}, 'ET'),
      h('span', {class: 'pulse ' + pulseClass}, pulseText),
    );
    if (window.BriefingTheme) window.BriefingTheme.mountToggle(topbar);
    app.appendChild(topbar);

    // ============ DECISION FLOW (3 cols) ============
    const po = d.pre_open || {};
    const cal = d.calendar || {};
    const mp = d.matrix_plays || [];
    const factors = d.factors || {};
    const gp = d.game_plan || {};
    const apAll = (d.active_plays || []);

    // Build unified candidate list: matrix plays + verified-status playbook plays.
    // Matrix plays always show (they're the time-windowed scorecard). Playbook
    // plays only show if status is "verified" — backtesting/idea plays stay in
    // Notion as the catalog but don't crowd the briefing.
    // Confluence Model entries are filtered too — they're duplicates of matrix.

    // Index ALL playbook plays by name prefix (before filtering) so matrix plays
    // can borrow their corresponding "overall" sample_size for consistent display.
    // e.g. matrix "M1 Short" ↔ playbook "M1 Short — Confluence Model".
    const playbookByPrefix = new Map();
    apAll.forEach(p => {
      const prefix = (p.name || '').split(/[—\-(]/)[0].trim().toLowerCase();
      if (prefix && !playbookByPrefix.has(prefix)) playbookByPrefix.set(prefix, p);
    });

    const allCandidates = [];
    mp.forEach(p => {
      const pb = playbookByPrefix.get((p.name || '').trim().toLowerCase());
      allCandidates.push({
        ...p,
        _kind: 'matrix',
        _sample_size: pb?.sample_size ?? null,
      });
    });
    apAll
      .filter(p => !/Confluence Model/i.test(p.name || ''))
      .filter(p => (p.status || '').toLowerCase() === 'verified')
      .forEach(p => allCandidates.push({...p, _kind: 'playbook'}));

    // Selection state — single source of truth
    const state = {selectedKey: null};
    const playKey = (p) => `${p._kind}:${p.name}`;

    // Container for column 3 — re-rendered on selection change
    const detailPane = h('div', {class:'flow-col exec'},
      h('div', {class:'exec-frame'},
        h('i', {class:'tl'}), h('i', {class:'tr'}),
        h('i', {class:'bl'}), h('i', {class:'br'})));
    detailPane.appendChild(h('div', {class:'flow-step'},
      h('span', {class:'n'}, '3'),
      h('span', {class:'t'}, "PLAY"), h('span', null, 'DETAIL')));
    const detailBody = h('div');
    detailPane.appendChild(detailBody);

    function renderDetail() {
      detailBody.innerHTML = '';
      const sel = state.selectedKey
        ? allCandidates.find(p => playKey(p) === state.selectedKey)
        : null;
      if (!sel) {
        detailBody.appendChild(renderDetailEmpty(allCandidates));
      } else if (sel._kind === 'matrix') {
        detailBody.appendChild(renderMatrixDetail(sel));
      } else {
        detailBody.appendChild(renderPlaybookDetail(sel));
      }
      // Update card highlights in column 2
      document.querySelectorAll('.play-card[data-key]').forEach(el => {
        el.classList.toggle('selected', el.dataset.key === state.selectedKey);
      });
    }

    function onCardClick(p) {
      const k = playKey(p);
      state.selectedKey = state.selectedKey === k ? null : k;
      renderDetail();
    }

    app.appendChild(h('div', {class:'flow'},
      renderConditions(po, cal, fc, factors, mp),
      renderTimeGroupedCandidates(allCandidates, onCardClick),
      detailPane));

    // Initial detail render
    renderDetail();

    // ============ FRESHNESS ============
    const stale = (d.freshness || []).filter(f => f.is_stale);
    if (stale.length) {
      app.appendChild(h('div', {class:'freshness'},
        h('h3', null, '⚠ STALE DATA'),
        stale.map(f => h('div', null, `${f.label} — last ${f.last_date} (${f.days_stale}d) — ${f.impact}`))));
    }
    // Note: Avoid / Stand-Down banner removed (2026-05-19). The verbose combo
    // list was repetitive — most lines shared the same kill-switch factor
    // (tight_45min_or) and the Range Briefing already captures it as
    // "Q1-Q2 = SKIP". d.avoid stays in the JSON for now in case we want to
    // reintroduce as a distilled kill-switch chip strip later.

    // ============ RANGE BRIEFING + MARKET STATE ============
    app.appendChild(h('div', {class:'section-h'}, 'Range Briefing & Market State'));
    const main = h('div', {class:'grid grid-2'});

    const leftCol = h('div', {class:'grid', style:'gap:12px;'});
    leftCol.appendChild(renderRangeBriefing(fc, d.range_intelligence));
    main.appendChild(leftCol);

    const rightCol = h('div', {class:'grid', style:'gap:12px;'});
    rightCol.appendChild(renderPreOpen(po, d.levels || {}));
    rightCol.appendChild(renderCalendar(cal));
    rightCol.appendChild(renderFactors(factors));
    main.appendChild(rightCol);
    app.appendChild(main);

    // ============ BOTTOM: LEVELS + PLAN ============
    app.appendChild(h('div', {class:'section-h'}, 'Targets & Plan'));
    const bottom = h('div', {class:'grid grid-2'});
    bottom.appendChild(renderLevelsTable(d.levels || {}));
    bottom.appendChild(renderGamePlan(d.game_plan || {}));
    app.appendChild(bottom);

    // Footer
    app.appendChild(h('div', {class:'mute mono', style:'text-align:center;font-size:9px;margin-top:28px;letter-spacing:2px;'},
      `// SCHEMA v${d.schema_version} ${isDemo ? '// DEMO MODE — run morning_briefing.py --export-dashboard' : ''}`));

    // ========================================================
    // Renderers
    // ========================================================

    // ====== Decision flow: column renderers ======

    function renderConditions(po, cal, fc, factors, mp) {
      const col = h('div', {class:'flow-col'});
      col.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '1'),
        h('span', {class:'t'}, 'PRE-MARKET'),
        h('span', null, 'CONDITIONS')));

      // Sizing tier deliberately NOT shown here — it gets the dedicated
      // Range Briefing card below. This column is just the verifiable
      // pre-market data points the trader needs to confirm.

      const gap = po.gap || {};
      const ovr = po.overnight || {};
      const pr = po.prior_rth || {};

      const rows = [];
      if (po.current_price != null) {
        rows.push(['Price', fmtPrice(po.current_price), '', po.current_price_ts || '']);
      }
      if (gap.pts != null) {
        rows.push(['Gap', fmtPts(gap.pts), gap.pts >= 0 ? 'up' : 'down',
                   gap.pct != null ? fmtPts(gap.pct) + '%' : '']);
      }
      if (ovr.range != null) {
        const tag = ovr.tight ? 'TIGHT' : ovr.wide ? 'WIDE' : '';
        rows.push(['Overnight', `${Math.round(ovr.range)}p ${(ovr.direction || '').toLowerCase()}`,
                   ovr.tight || ovr.wide ? 'warn' : '', tag]);
      }
      if (pr.close_position != null) {
        const pcp = pr.close_position;
        const pcpStr = `close@${(pcp * 100).toFixed(0)}%`;
        const cls = pcp < 0.33 ? 'down' : pcp > 0.66 ? 'up' : '';
        rows.push(['Prior RTH', pcpStr, cls,
                   pcp < 0.33 ? 'WEAK' : pcp > 0.66 ? 'STRONG' : 'MID']);
      }
      if (cal && !cal.unknown) {
        const evts = (cal.events || []).filter(e => (e.impact||'').toLowerCase() === 'high');
        rows.push(['Calendar',
                   evts.length ? `${evts.length} HIGH` : 'CLEAR',
                   evts.length ? 'warn' : '',
                   evts.length ? evts.map(e => e.time_et).filter(Boolean).join(' ') : '']);
        rows.push(['FOMC', cal.is_fomc_week ? 'YES' : 'no',
                   cal.is_fomc_week ? 'bad' : '', '']);
      }
      // Day type
      rows.push(['Day', cal.day_of_week || '—', '', '']);
      // Regime + opex
      const active = factors.active || [];
      const regimeBull = active.includes('regime_bull');
      const regimeBear = active.includes('regime_bear');
      if (regimeBull || regimeBear) {
        rows.push(['Regime', regimeBull ? 'BULL 60d' : 'BEAR 60d',
                   regimeBull ? 'up' : 'down', '']);
      }
      const opex = active.includes('is_opex_week');
      if (opex) rows.push(['Opex Week', 'YES', 'warn', '']);

      rows.forEach(([l, v, cls, sub]) =>
        col.appendChild(h('div', {class:'cond-row'},
          h('span', {class:'l'}, l),
          h('span', {class:'v ' + (cls || '')},
            v, sub ? h('span', {class:'sub'}, sub) : null))));

      return col;
    }

    // ====== New time-grouped candidates + selection-driven detail pane ======

    function renderTimeGroupedCandidates(candidates, onClick) {
      const col = h('div', {class:'flow-col'});
      col.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '2'),
        h('span', {class:'t'}, 'PLAY'),
        h('span', null, 'CANDIDATES')));

      if (!candidates.length) {
        col.appendChild(h('div', {class:'empty'}, 'No candidates today.'));
        return col;
      }

      // Group by window
      const groups = new Map();
      WINDOW_ORDER.forEach(w => groups.set(w, []));
      candidates.forEach(p => {
        const w = primaryWindow(p);
        if (!groups.has(w)) groups.set(w, []);
        groups.get(w).push(p);
      });

      // Sort within each group: non-vetoed first, then by confluence count (matrix) / WR (playbook)
      groups.forEach((plays) => {
        plays.sort((a, b) => {
          if (a.veto_active && !b.veto_active) return 1;
          if (b.veto_active && !a.veto_active) return -1;
          const aScore = a._kind === 'matrix' ? a.preopen_count : 0;
          const bScore = b._kind === 'matrix' ? b.preopen_count : 0;
          return bScore - aScore;
        });
      });

      const windowLabels = {
        '9:30-9:45':   'W1 · 9:30–9:45',
        '9:45-10:00':  'W2 · 9:45–10:00',
        '10:00-10:15': 'W3 · 10:00–10:15',
        'Any':         'Any window',
      };

      WINDOW_ORDER.forEach(w => {
        const plays = groups.get(w);
        if (!plays || !plays.length) return;
        const sec = h('div', {class:'window-section', 'data-window': w});
        sec.appendChild(h('div', {class: 'window-header' + (w === 'Any' ? ' win-any' : '')},
          h('span', {class:'w-bar'}),
          h('span', null, windowLabels[w]),
          h('span', {class:'w-status'}),
          h('span', {class:'w-count'}, `${plays.length}`)));
        plays.forEach(p => sec.appendChild(renderCandidateCard(p, onClick)));
        col.appendChild(sec);
      });

      return col;
    }

    function renderCandidateCard(p, onClick) {
      const isVeto = !!p.veto_active;
      const isMatrix = p._kind === 'matrix';

      let stateClass, stateLabel;
      if (isVeto) { stateClass = 'veto'; stateLabel = 'VETO'; }
      else if (isMatrix) {
        const maxAction = (p.projection?.max_tier?.action || '').toUpperCase();
        if (maxAction.includes('TAKE')) { stateClass = 'live'; stateLabel = 'LIVE'; }
        else { stateClass = 'wait'; stateLabel = 'WAIT'; }
      }
      else {
        // playbook: state by status
        const s = (p.status || 'idea').toLowerCase();
        if (s === 'verified')         { stateClass = 'live'; stateLabel = 'VERIFIED'; }
        else if (s === 'backtesting') { stateClass = 'wait'; stateLabel = 'BACKTEST'; }
        else                          { stateClass = 'wait'; stateLabel = (p.status || 'idea').toUpperCase(); }
      }

      const cardCls = 'play-card ' + (isVeto ? 'veto' : stateClass === 'wait' ? 'wait' : '');
      const card = h('div', {class: cardCls, 'data-key': playKey(p)});

      const dir = (p.direction || 'both').toLowerCase();

      // Header row
      card.appendChild(h('div', {class:'ph'},
        h('div', {class:'pname'},
          h('span', {class: 'badge-dir ' + dir, style:'font-size:8px;'}, dir.toUpperCase()),
          h('span', null, p.name)),
        h('span', {class: 'pstate ' + stateClass}, stateLabel)));

      // ===== Standardized body: [indicator] [meta] [stats] =====
      // Indicator: confluence dots (matrix) | status dot (playbook)
      // Meta:      "1/5 · +2" (matrix)      | "Tier A" (playbook)
      // Stats:     WR · PF · n  (both, right-aligned, consistent width)
      let indicator, metaText, wr, pf, n;

      if (isMatrix) {
        const dots = [];
        for (let i = 0; i < p.max_preopen; i++) {
          dots.push(h('div', {class: 'dd' + (i < p.preopen_count ? ' on' : '')}));
        }
        for (let i = 0; i < (p.post_pending || []).length; i++) {
          dots.push(h('div', {class:'dd maybe'}));
        }
        indicator = h('div', {class:'conf-mini'}, dots);
        if (isVeto) {
          metaText = (p.active_vetoes || []).map(v => v.id).join(', ').slice(0, 32) || 'veto';
        } else {
          metaText = `${p.preopen_count}/${p.max_preopen}`
            + ((p.post_pending || []).length ? ` · +${p.post_pending.length}` : '');
        }
        // Parse "%WR" and "PF" from tier notes. Decimals matter — "64.5% WR"
        // must capture "64.5", not "5". Fall back from max_tier to min_tier when
        // max_tier is unlock-only / has no clean numbers.
        const parseTierStats = (text) => {
          if (!text) return {wr: null, pf: null};
          const wrM = text.match(/(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)\s*%\s*WR/i);
          const pfM = text.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);
          return {wr: wrM ? wrM[1] : null, pf: pfM ? pfM[1] : null};
        };
        const maxStats = parseTierStats(p.projection?.max_tier?.note);
        const minStats = parseTierStats(p.projection?.min_tier?.note);
        wr = (maxStats.wr || minStats.wr);
        pf = (maxStats.pf || minStats.pf);
        if (wr) wr += '%';
        // n = sample size from cross-referenced playbook entry. Falls back to
        // setup frequency (% of days) if no playbook match found.
        n = p._sample_size != null
          ? String(p._sample_size)
          : p.expectancy?.setup_pct_of_all_days != null
            ? `${p.expectancy.setup_pct_of_all_days}%/d`
            : null;
      } else {
        // Playbook: indicator is a single status dot; meta is tier
        indicator = h('div', {class:'conf-mini'},
          h('div', {class: 'dd on'}));
        metaText = p.tier ? `Tier ${p.tier}` : '—';
        const wrMatch = (p.wr_base || '').match(/[\d.]+%/);
        wr = wrMatch ? wrMatch[0] : null;
        pf = p.pf_base != null ? Number(p.pf_base).toFixed(2) : null;
        n  = p.sample_size != null ? String(p.sample_size) : null;
      }

      card.appendChild(h('div', {class:'pbody pbody-standard'},
        indicator,
        h('span', {class:'pmeta'}, metaText),
        h('div', {class:'pstats'},
          h('span', {class:'stat-cell'}, 'WR ', h('b', null, wr || '—')),
          h('span', {class:'stat-cell'}, 'PF ', h('b', null, pf || '—')),
          h('span', {class:'stat-cell'}, 'n ', h('b', null, n || '—')))));

      card.addEventListener('click', () => onClick(p));
      return card;
    }

    // ====== Detail-pane renderers (column 3) ======

    function renderDetailEmpty(candidates) {
      const wrap = h('div', {class:'detail-empty'});
      wrap.appendChild(h('div', {class:'icon'}, '◎'));
      wrap.appendChild(h('div', {class:'hint'}, 'Select a candidate'));
      wrap.appendChild(h('div', {class:'arrow'}, '◀'));

      // Compact "what to watch" summary
      const nonVeto = candidates.filter(p => !p.veto_active);
      const matrixTop = nonVeto
        .filter(p => p._kind === 'matrix')
        .sort((a, b) => b.preopen_count - a.preopen_count)[0];
      const verified = nonVeto.filter(p => p._kind === 'playbook' && (p.status || '').toLowerCase() === 'verified').length;
      const total = nonVeto.length;
      const vetoed = candidates.length - nonVeto.length;

      const summary = h('div', {class:'summary'},
        h('div', null,
          h('b', null, `${total}`), ' active candidates · ',
          h('b', null, `${vetoed}`), ' vetoed'),
        matrixTop ? h('div', {style:'margin-top:6px;'},
          'Highest matrix confluence: ',
          h('b', null, `${matrixTop.name}`),
          ` (${matrixTop.preopen_count}/${matrixTop.max_preopen})`) : null,
        h('div', {style:'margin-top:6px;'},
          h('b', null, `${verified}`), ' verified playbook plays today'));
      wrap.appendChild(summary);
      return wrap;
    }

    function renderMatrixDetail(p) {
      const wrap = h('div');
      const dir = (p.direction || 'both').toLowerCase();

      wrap.appendChild(h('div', {class:'detail-head'},
        h('div', {class:'detail-title'}, p.name),
        h('div', {class:'detail-sub'},
          h('span', {class:'badge-dir ' + dir}, dir.toUpperCase()),
          h('span', null, p.window),
          p.veto_active ? h('span', {class:'chip veto'}, '🚫 VETO') : null,
          h('span', {class:'mute'}, `${p.preopen_count}/${p.max_preopen} pre-open`))));

      if (p.veto_active) {
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'ACTIVE VETOES'),
          ...(p.active_vetoes || []).map(v => h('div', {class:'factor-line veto'},
            h('span', {class:'marker'}, '✕'),
            h('span', {class:'lift'}, `${v.lift_pp > 0 ? '+' : ''}${v.lift_pp}pp`),
            h('span', {class:'desc'}, v.desc),
            h('span', {class:'meta'}, v.id)))));
        wrap.appendChild(h('div', {class:'extra-note'},
          `Skip ${p.name} today — veto overrides any confluence count.`));
        if (p.extra_note) wrap.appendChild(h('div', {class:'extra-note'}, p.extra_note));
        if (p.notion_url) wrap.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
        wrap.appendChild(narrative(p.narrative));
        return wrap;
      }

      // Active factors
      if ((p.preopen_active || []).length) {
        const sec = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, `ACTIVE PRE-OPEN · ${p.preopen_active.length}`));
        p.preopen_active.forEach(f => sec.appendChild(h('div', {class:'factor-line on'},
          h('span', {class:'marker'}, '✓'),
          h('span', {class:'lift'}, `+${f.lift_pp}pp`),
          h('span', {class:'desc'}, f.desc),
          h('span', {class:'meta'}, f.id))));
        wrap.appendChild(sec);
      }

      // Pending factors
      if ((p.post_pending || []).length) {
        const sec = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, `PENDING POST-OPEN · ${p.post_pending.length}`));
        p.post_pending.forEach(f => sec.appendChild(h('div', {class:'factor-line pending'},
          h('span', {class:'marker'}, '○'),
          h('span', {class:'lift'}, `+${f.lift_pp}pp`),
          h('span', {class:'desc'}, f.desc),
          h('span', {class:'meta'},
            h('span', {class:'when'}, f.when), f.id))));
        wrap.appendChild(sec);
      }

      // Projection
      const proj = p.projection || {};
      const minAction = (proj.min_tier?.action || '').toUpperCase();
      const maxAction = (proj.max_tier?.action || '').toUpperCase();
      const cls = (action) => action.includes('TAKE') ? 'take' : 'skip';
      const projStrip = h('div', {class:'projection-strip'});
      if (proj.locked) {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minAction) + ' active'},
          h('div', {class:'pl'}, `COUNT ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
      } else {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minAction)},
          h('div', {class:'pl'}, `IF ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(maxAction) + ' active'},
          h('div', {class:'pl'}, `IF ${proj.max_count}`),
          h('div', {class:'pa'}, proj.max_tier.action),
          h('div', {class:'pn'}, proj.max_tier.note || '')));
      }
      wrap.appendChild(h('div', {class:'detail-section'},
        h('div', {class:'detail-label'}, 'PROJECTION'),
        projStrip));

      // Expectancy
      if (p.expectancy) {
        const e = p.expectancy;
        wrap.appendChild(h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'EXPECTANCY'),
          h('div', {class:'pd-exp'},
            'Baseline (no veto, conf≥', h('b', null, e.tradeable_threshold), '): ',
            h('b', null, `${e.setup_pct_of_all_days}%`), ' of days · fires ',
            h('b', null, `${e.fire_rate_pct}%`), ' · EV ',
            h('b', null, `+${e.ev_per_setup_day_R}R/setup-day`),
            e.fire_rate_now_pct != null
              ? [' · today fires ~', h('b', null,
                  e.fire_rate_now_pct === e.fire_rate_max_pct || e.fire_rate_max_pct == null
                    ? `${e.fire_rate_now_pct}%`
                    : `${e.fire_rate_now_pct}-${e.fire_rate_max_pct}%`)]
              : null)));
      }

      if (p.extra_note) wrap.appendChild(h('div', {class:'extra-note'}, p.extra_note));
      if (p.notion_url) wrap.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
      wrap.appendChild(narrative(p.narrative));
      return wrap;
    }

    function renderPlaybookDetail(p) {
      const wrap = h('div');
      const dir = (p.direction || 'both').toLowerCase();
      const status = (p.status || 'idea').toLowerCase();

      wrap.appendChild(h('div', {class:'detail-head'},
        h('div', {class:'detail-title'}, p.name),
        h('div', {class:'detail-sub'},
          h('span', {class:'badge-dir ' + dir}, dir.toUpperCase()),
          h('span', {class: 'pb-status ' + status}, status),
          p.tier ? h('span', {class:'chip'}, 'Tier ' + p.tier) : null,
          h('span', {class:'mute mono'},
            (normalizeWindows(p)).join(', ')))));

      // Stats row
      const stats = [];
      if (p.wr_base)    stats.push(['WR', p.wr_base]);
      if (p.pf_base)    stats.push(['PF', Number(p.pf_base).toFixed(2)]);
      if (p.sample_size) stats.push(['n', p.sample_size]);
      if (p.frequency)  stats.push(['Freq', p.frequency]);
      if (p.avg_mfe_r)  stats.push(['Avg MFE', `${p.avg_mfe_r}R`]);
      if (p.confidence) stats.push(['Confidence', p.confidence]);

      if (stats.length) {
        const statsBlock = h('div', {class:'detail-section'},
          h('div', {class:'detail-label'}, 'STATS'),

    // ====== Legacy renderers (kept but unused by new layout) ======

    function renderCandidates(mp, primary) {
      const col = h('div', {class:'flow-col'});
      col.appendChild(h('div', {class:'flow-step'},
        h('span', {class:'n'}, '2'),
        h('span', {class:'t'}, 'PLAY'),
        h('span', null, 'CANDIDATES')));

      if (!mp.length) {
        col.appendChild(h('div', {class:'empty'}, 'No matrix plays configured.'));
        return col;
      }

      const primaryName = primary?.play?.name;

      // Sort: primary first, then non-vetoed, then vetoed
      const sorted = mp.slice().sort((a, b) => {
        if (a.name === primaryName) return -1;
        if (b.name === primaryName) return 1;
        if (a.veto_active && !b.veto_active) return 1;
        if (b.veto_active && !a.veto_active) return -1;
        return 0;
      });

      sorted.forEach((p, idx) => {
        col.appendChild(renderPlayCard(p, idx, p.name === primaryName));
      });

      return col;
    }

    function renderPlayCard(p, idx, isPrimary) {
      const isVeto = !!p.veto_active;
      const proj = p.projection || {};
      const maxAction = (proj.max_tier?.action || '').toUpperCase();
      const isTakeable = !isVeto && maxAction.includes('TAKE');

      let stateClass, stateLabel;
      if (isVeto) { stateClass = 'veto'; stateLabel = 'VETO'; }
      else if (isPrimary) { stateClass = 'live'; stateLabel = 'PRIMARY'; }
      else if (isTakeable) { stateClass = 'live'; stateLabel = 'LIVE'; }
      else { stateClass = 'wait'; stateLabel = 'WAIT'; }

      const cardCls = 'play-card ' + (isPrimary ? 'primary' : isVeto ? 'veto' : isTakeable ? '' : 'wait');

      const dots = [];
      for (let i = 0; i < p.max_preopen; i++) {
        dots.push(h('div', {class: 'dd' + (i < p.preopen_count ? ' on' : '')}));
      }
      for (let i = 0; i < (p.post_pending || []).length; i++) {
        dots.push(h('div', {class:'dd maybe'}));
      }

      const noteMax = proj.max_tier?.note || '';
      const wrMatch = noteMax.match(/~?(\d+(?:[-–]\d+)?)\s*%\s*WR/i);
      const pfMatch = noteMax.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);

      const card = h('div', {class: cardCls});

      card.appendChild(h('div', {class:'ph'},
        h('div', {class:'pname'},
          h('span', {class:'pnum'}, String(idx + 1).padStart(2, '0')),
          h('span', null, p.name),
          h('span', {class: 'badge-dir ' + p.direction, style:'font-size:8px;'}, p.direction.toUpperCase())),
        h('span', {class: 'pstate ' + stateClass}, stateLabel)));

      if (isVeto) {
        const reasons = (p.active_vetoes || []).map(v => v.id).join(', ') || 'veto';
        card.appendChild(h('div', {class:'pveto-line'}, reasons + ' · skip regardless'));
        return card;
      }

      card.appendChild(h('div', {class:'pbody'},
        h('div', {class:'conf-mini'}, dots),
        h('span', null,
          `${p.preopen_count}/${p.max_preopen} confluence`,
          (p.post_pending || []).length ? ` · +${p.post_pending.length}` : ''),
        h('div', {class:'pstats'},
          wrMatch ? h('span', null, 'WR ', h('b', null, wrMatch[1] + '%')) : null,
          pfMatch ? h('span', null, 'PF ', h('b', null, pfMatch[1])) : null),
        h('span', {class:'pwin'}, p.window)));

      if (!isTakeable && !isPrimary) {
        card.appendChild(h('div', {class:'pwait-line'}, `Need ${proj.max_count}+ confluence to unlock`));
      }

      // ===== Hidden detail panel (revealed on click) =====
      const detail = h('div', {class:'play-detail'});

      // Active factors
      if ((p.preopen_active || []).length) {
        const sec = h('div', {class:'pd-section'},
          h('div', {class:'pd-label'}, `ACTIVE PRE-OPEN · ${p.preopen_active.length}`));
        p.preopen_active.forEach(f => sec.appendChild(h('div', {class:'pd-fline'},
          h('span', {class:'m'}, '✓'),
          h('span', {class:'l'}, `+${f.lift_pp}pp`),
          h('span', {class:'desc'}, f.desc))));
        detail.appendChild(sec);
      }

      // Pending factors
      if ((p.post_pending || []).length) {
        const sec = h('div', {class:'pd-section'},
          h('div', {class:'pd-label'}, `PENDING POST-OPEN · ${p.post_pending.length}`));
        p.post_pending.forEach(f => sec.appendChild(h('div', {class:'pd-fline pend'},
          h('span', {class:'m'}, '○'),
          h('span', {class:'l'}, `+${f.lift_pp}pp`),
          h('span', {class:'desc'},
            h('span', {class:'when'}, f.when), f.desc))));
        detail.appendChild(sec);
      }

      // Projection scenarios
      detail.appendChild(h('div', {class:'pd-section'},
        h('div', {class:'pd-label'}, 'PROJECTION'),
        h('div', {class:'projection-strip'},
          proj.locked
            ? h('div', {class:'proj-card active take'},
                h('div', {class:'pl'}, `COUNT ${proj.min_count}`),
                h('div', {class:'pa'}, proj.min_tier.action),
                h('div', {class:'pn'}, proj.min_tier.note || ''))
            : [
                h('div', {class:'proj-card skip'},
                  h('div', {class:'pl'}, `IF ${proj.min_count}`),
                  h('div', {class:'pa'}, proj.min_tier.action),
                  h('div', {class:'pn'}, proj.min_tier.note || '')),
                h('div', {class:'proj-card take active'},
                  h('div', {class:'pl'}, `IF ${proj.max_count}`),
                  h('div', {class:'pa'}, proj.max_tier.action),
                  h('div', {class:'pn'}, proj.max_tier.note || ''))
              ]
        )));

      // Expectancy
      if (p.expectancy) {
        const e = p.expectancy;
        detail.appendChild(h('div', {class:'pd-section'},
          h('div', {class:'pd-label'}, 'EXPECTANCY'),
          h('div', {class:'pd-exp'},
            'Baseline (no veto, conf≥', h('b', null, e.tradeable_threshold), '): ',
            h('b', null, `${e.setup_pct_of_all_days}%`), ' of days · fires ',
            h('b', null, `${e.fire_rate_pct}%`), ' · EV ',
            h('b', null, `+${e.ev_per_setup_day_R}R/setup-day`),
            e.fire_rate_now_pct != null
              ? [' · today fires ~', h('b', null,
                  e.fire_rate_now_pct === e.fire_rate_max_pct || e.fire_rate_max_pct == null
                    ? `${e.fire_rate_now_pct}%`
                    : `${e.fire_rate_now_pct}-${e.fire_rate_max_pct}%`)]
              : null)));
      }

      // Extra note + Notion link
      if (p.extra_note) detail.appendChild(h('div', {class:'extra-note'}, p.extra_note));
      if (p.notion_url) detail.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank',
        onclick: (e) => e.stopPropagation()}, '→ PLAYBOOK'));

      // AI narrative
      if (p.narrative) {
        detail.appendChild(h('div', {class:'pd-narr', html: p.narrative}));
      }

      card.appendChild(detail);
      card.appendChild(h('div', {class:'pd-hint'},
        isPrimary ? '▼ click to collapse' : '▼ click for detail'));

      card.addEventListener('click', () => card.classList.toggle('expanded'));

      // Primary play starts expanded so user sees the detail without clicking
      if (isPrimary) card.classList.add('expanded');

      return card;
    }

        h('span', {class:'t'}, "TODAY'S"), h('span', null, 'READ')));

      wrap.appendChild(h('div', {class:'exec-action'}, primary.label));
      wrap.appendChild(h('div', {class:'exec-sub'},

          ? `${(primary.direction || '').toUpperCase()}  ·  ${primary.window}`

            fc.tier_level === 'normal' ? 'cool' :
            fc.tier_level === 'below' ? 'warn' :
            fc.tier_level === 'stand_down' ? 'bad' : '')},
            h('div', {class:'tl'}, 'TIER'),
            h('div', {class:'tv'}, fcReady ? qLab : '—')),

                h('div', {class:'tl'}, 'TGT-01'),
                h('div', {class:'tv'}, `${firstTarget.label} ${fmtPts(firstTarget.distance_pts)}`))
            : h('div', {class:'exec-tile'},
                h('div', {class:'tl'}, 'TGT'),
                h('div', {class:'tv'}, '—')),
          h('div', {class: 'exec-tile ' + (primary.avoidHot ? 'bad' : 'good')},
            h('div', {class:'tl'}, 'KILL'),
            h('div', {class:'tv'}, primary.avoidHot ? 'HOT' : 'CLEAR')))));

      return wrap;

    function renderMatrixPlay(p, idx) {
      const isVeto = !!p.veto_active;
      const proj = p.projection || {};
      const minAction = (proj.min_tier?.action || '').toUpperCase();
      const maxAction = (proj.max_tier?.action || '').toUpperCase();
      const isActive = !isVeto && maxAction.includes('TAKE');

      const exp = p.expectancy;
      const noteMax = proj.max_tier?.note || '';
      const wrMatch = noteMax.match(/~?(\d+(?:[-–]\d+)?)\s*%\s*WR/i);
      const pfMatch = noteMax.match(/PF\s*(\d+(?:\.\d+)?(?:[-–]\d+(?:\.\d+)?)?)/i);

      const statTiles = [
        {label:'Confluence', value: `${p.preopen_count}/${p.max_preopen}`,
          cls: p.preopen_count >= Math.ceil((p.max_preopen||1)/2) ? 'cool' : ''},
        {label:'Best WR', value: wrMatch ? wrMatch[1] + '%' : '—', cls: 'good'},
        {label:'Best PF', value: pfMatch ? pfMatch[1] : '—', cls: 'good'},
        {label: exp ? 'Setup/day' : 'Status',
          value: exp ? exp.setup_pct_of_all_days + '%' :
                 (isVeto ? 'VETO' : isActive ? 'READY' : 'WAIT'),
          cls: exp ? '' : (isVeto ? 'bad' : isActive ? 'cool' : 'warn')},
      ];

      const dots = [];
      for (let i = 0; i < p.max_preopen; i++) {
        dots.push(h('div', {class: 'd' + (i < p.preopen_count ? ' on' : '')}));
      }
      for (let i = 0; i < (p.post_pending || []).length; i++) {
        dots.push(h('div', {class:'d maybe'}));
      }

      const cardCls = 'play ' + (isVeto ? 'veto' : isActive ? 'active' : 'skip');
      const card = h('div', {class: cardCls});

      card.appendChild(h('div', {class:'play-head'},
        h('div', {class:'play-id'},
          h('span', {class:'play-tag'}, String(idx + 1).padStart(2, '0')),
          h('span', {class: 'badge-dir ' + p.direction}, p.direction.toUpperCase()),
          h('span', {class:'play-name'}, p.name)),
        h('span', {class:'play-window'},
          isVeto ? h('span', {class:'chip veto'}, '🚫 VETO') : null,
          p.window)));

      if (isVeto) {
        card.appendChild(h('div', null,
          (p.active_vetoes || []).map(v => h('div', {class:'factor-line veto'},
            h('span', {class:'marker'}, '✕'),
            h('span', {class:'lift'}, `${v.lift_pp > 0 ? '+' : ''}${v.lift_pp}pp`),
            h('span', {class:'desc'}, v.desc),
            h('span', {class:'meta'}, v.id)))));
        card.appendChild(h('div', {class:'extra-note'},
          `Skip ${p.name} today — veto overrides any confluence count.`));
        if (p.extra_note) card.appendChild(h('div', {class:'extra-note'}, p.extra_note));
        if (p.notion_url) card.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
        card.appendChild(narrative(p.narrative));
        return card;
      }

      card.appendChild(h('div', {class:'conf-dots'},
        dots,
        h('span', {class:'l'},
          h('b', null, `${p.preopen_count}`), '/',
          h('b', null, `${p.max_preopen}`), ' CONFLUENCE',
          (p.post_pending || []).length ? ` · +${p.post_pending.length} possible` : '')));

      card.appendChild(h('div', {class:'stat-row'},
        statTiles.map(s => h('div', {class:'stat-tile ' + (s.cls||'')},
          h('div', {class:'t-l'}, s.label),
          h('div', {class:'t-v'}, s.value)))));

      if ((p.preopen_active || []).length) {
        card.appendChild(h('div', null,
          p.preopen_active.map(f => h('div', {class:'factor-line on'},
            h('span', {class:'marker'}, '✓'),
            h('span', {class:'lift'}, `+${f.lift_pp}pp`),
            h('span', {class:'desc'}, f.desc),
            h('span', {class:'meta'}, f.id)))));
      }
      if ((p.post_pending || []).length) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin-top:8px;'},
          'PENDING'));
        card.appendChild(h('div', null,
          p.post_pending.map(f => h('div', {class:'factor-line pending'},
            h('span', {class:'marker'}, '○'),
            h('span', {class:'lift'}, `+${f.lift_pp}pp`),
            h('span', {class:'desc'}, f.desc),
            h('span', {class:'meta'},
              h('span', {class:'when'}, f.when), f.id)))));
      }

      const projStrip = h('div', {class:'projection-strip'});
      const cls = (action) => action.includes('TAKE') ? 'take' : 'skip';
      if (proj.locked) {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minAction) + ' active'},
          h('div', {class:'pl'}, `COUNT ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
      } else {
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(minAction)},
          h('div', {class:'pl'}, `IF ${proj.min_count}`),
          h('div', {class:'pa'}, proj.min_tier.action),
          h('div', {class:'pn'}, proj.min_tier.note || '')));
        projStrip.appendChild(h('div', {class:'proj-card ' + cls(maxAction) + ' active'},
          h('div', {class:'pl'}, `IF ${proj.max_count}`),
          h('div', {class:'pa'}, proj.max_tier.action),
          h('div', {class:'pn'}, proj.max_tier.note || '')));
      }
      card.appendChild(projStrip);

      if (exp) {
        card.appendChild(h('div', {class:'mute mono', style:'font-size:10px;margin-top:10px;text-align:right;letter-spacing:0.5px;'},
          `baseline: ${exp.setup_pct_of_all_days}% of days · fires ${exp.fire_rate_pct}% · EV +${exp.ev_per_setup_day_R}R`));
      }
      if (p.extra_note) card.appendChild(h('div', {class:'extra-note'}, p.extra_note));
      if (p.notion_url) card.appendChild(h('a', {class:'play-link', href: p.notion_url, target:'_blank'}, '→ PLAYBOOK'));
      card.appendChild(narrative(p.narrative));
      return card;
    }

          const sign = dr.z > 0 ? '↑' : '↓';
          const cls = dr.delta_pts >= 0 ? 'up' : 'down';
          drvList.appendChild(h('div', {class: 'r-driver ' + cls},
            h('span', {class:'r-d-name mono'}, dr.factor),
            h('span', {class:'r-d-z mono'},
              sign, ' ', Math.abs(dr.z).toFixed(2), 'σ'),
            h('span', {class:'r-d-pts mono'},
              (dr.delta_pts >= 0 ? '+' : '') + dr.delta_pts.toFixed(1), ' pts')));
        });
        drv.appendChild(drvList);
        card.appendChild(drv);
      }

      // Intraday velocity reminder (validated insight #2)
      card.appendChild(h('div', {class:'range-velocity'},
        h('div', {class:'r-label'},
          'DURING SESSION CHECK',
          h('span', {class:'r-tag'}, 'intraday')),
        h('div', {class:'r-velocity-text'},
          'At entry, gauge 15-min pre-entry velocity (price now vs 15m ago, signed by trade direction):',
          h('br'),
          h('span', {class:'r-v-good mono'}, '30–90 pts aligned'), ' → take · ',
          h('span', {class:'r-v-bad mono'}, '90–120 pts'), ' → exhaustion skip · ',
          h('span', {class:'r-v-neutral mono'}, '±10 pts'), ' → chop skip',
        )));

      // AI narrative (from briefing.json or_forecast.narrative)
      if (fc.narrative) {
        card.appendChild(h('div', {class:'narrative', html: fc.narrative}));
      }

      return card;
    }

    function renderPreOpen(po, lv) {
      const cur = po.current_price;
      const ovr = po.overnight || {};
      const asia = po.asia || {};
      const lon = po.london || {};
      const pr = po.prior_rth || {};

      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, 'Pre-Open Structure'),
          h('span', {class:'mute mono', style:'font-size:10px;letter-spacing:1px;'},
            'PRICE LADDER · LEVELS')));

      const inner = h('div', null,
        h('div', {class:'preopen-head'},
          h('div', null,
            h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;'},
              'CURRENT', po.current_price_ts ? ' · ' + po.current_price_ts : ''),
            h('div', {class:'price-current'}, fmtPrice(cur))),
          po.gap?.pts != null
            ? h('div', {class:'gap-pill ' + (po.gap.pts >= 0 ? 'up' : 'down')},
                `${fmtPts(po.gap.pts)}`,
                po.gap.pct != null ? ` (${fmtPts(po.gap.pct)}%)` : '')
            : null));
      card.appendChild(inner);

      inner.appendChild(buildPriceLadder(po, lv));

      const sessions = h('div', {class:'session-grid'});
      if (pr.high != null) {
        const pcp = pr.close_position;
        const pcpStr = pcp != null ? ` · close@${(pcp*100).toFixed(0)}%` : '';
        sessions.appendChild(h('div', {class:'session-row pd'},
          h('div', {class:'s-label'}, 'PRIOR RTH'),
          h('div', {class:'s-val'}, `${fmtPrice(pr.high)} / ${fmtPrice(pr.low)}`,
            h('span', {class:'dim'}, pcpStr))));
      }
      if (ovr.high != null) {
        const tag = ovr.tight ? ' · TIGHT' : ovr.wide ? ' · WIDE' : '';
        sessions.appendChild(h('div', {class:'session-row on'},
          h('div', {class:'s-label'}, 'OVERNIGHT'),
          h('div', {class:'s-val'}, `${fmtPrice(ovr.high)} / ${fmtPrice(ovr.low)}`,
            h('span', {class:'dim'}, ` · ${fmtPts(ovr.range)}${tag}`))));
      }
      if (asia.high != null) {
        sessions.appendChild(h('div', {class:'session-row asia'},
          h('div', {class:'s-label'}, 'ASIA'),
          h('div', {class:'s-val'}, `${fmtPrice(asia.high)} / ${fmtPrice(asia.low)}`)));
      }
      if (lon.high != null) {
        sessions.appendChild(h('div', {class:'session-row lon'},
          h('div', {class:'s-label'}, 'LONDON'),
          h('div', {class:'s-val'}, `${fmtPrice(lon.high)} / ${fmtPrice(lon.low)}`)));
      }
      inner.appendChild(sessions);

      if ((po.data_notes || []).length) {
        inner.appendChild(h('div', {class:'mute', style:'font-size:10px;margin-top:6px;'},
          po.data_notes.map(n => h('div', null, '· ', n))));
      }
      inner.appendChild(narrative(po.narrative));
      return card;
    }

    function buildPriceLadder(po, lv) {
      const cur = po.current_price;
      if (cur == null) return h('div', {class:'empty'}, 'No live price.');

      const pts = [];
      const push = (price, label, color) => {
        if (price == null) return;
        pts.push({price, label, color});
      };
      const ovr = po.overnight || {};
      const asia = po.asia || {};
      const lon = po.london || {};
      const pr = po.prior_rth || {};
      push(ovr.high, 'ON H', 'var(--cyan)');
      push(ovr.low,  'ON L', 'var(--cyan)');
      push(asia.high, 'Asia H', 'var(--violet)');
      push(asia.low,  'Asia L', 'var(--violet)');
      push(lon.high, 'Lon H', 'var(--amber)');
      push(lon.low,  'Lon L', 'var(--amber)');
      push(pr.high, 'PDH', 'var(--green)');
      push(pr.low,  'PDL', 'var(--green)');
      push(pr.close, 'PDC', 'var(--green)');
      (lv.above || []).forEach(l => {
        if (!pts.find(p => Math.abs(p.price - l.price) < 0.5)) push(l.price, l.label, 'var(--green)');
      });
      (lv.below || []).forEach(l => {
        if (!pts.find(p => Math.abs(p.price - l.price) < 0.5)) push(l.price, l.label, 'var(--red)');
      });

      const allP = pts.map(p => p.price).concat([cur]);
      const minP = Math.min(...allP), maxP = Math.max(...allP);
      const span = Math.max(maxP - minP, 1);
      const pad = span * 0.08;
      const lo = minP - pad, hi = maxP + pad;
      const W = 600, H = 320;
      const yOf = p => H - ((p - lo) / (hi - lo)) * (H - 20) - 10;

      const svg = h('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio:'none'});

      // grid lines
      for (let i = 0; i < 5; i++) {
        const y = (H / 5) * i + 4;
        svg.appendChild(h('line', {x1: 0, x2: W, y1: y, y2: y,
          stroke: 'var(--ladder-grid)', 'stroke-width': 1}));
      }

      // spine
      svg.appendChild(h('line', {x1: 90, x2: 90, y1: 6, y2: H-6,
        stroke: 'var(--line)', 'stroke-width': 1}));

      // current price marker
      const curY = yOf(cur);
      svg.appendChild(h('line', {x1: 0, x2: W, y1: curY, y2: curY,
        stroke: 'var(--text)', 'stroke-width': 1.4, 'stroke-dasharray': '5,3', opacity: 0.7}));
      svg.appendChild(h('rect', {x: W-118, y: curY-13, width: 112, height: 24,
        fill: 'var(--bg-1)', stroke:'var(--cyan)', 'stroke-width': 1.2, rx: 2}));
      svg.appendChild(h('text', {x: W-62, y: curY+4, 'text-anchor': 'middle',
        'font-family': 'ui-monospace, Menlo', 'font-size': 12, 'font-weight': 700,
        fill: 'var(--cyan)'}, `▶ ${cur.toFixed(2)}`));

      // de-collide labels
      const sorted = pts.slice().sort((a,b) => b.price - a.price);
      const minGap = 16;
      const placed = [];
      sorted.forEach(p => {
        let ty = yOf(p.price);
        for (const q of placed) if (Math.abs(ty - q.ty) < minGap) ty = q.ty + minGap;
        placed.push({...p, ty, y: yOf(p.price)});
      });

      placed.forEach(p => {
        svg.appendChild(h('line', {x1: 82, x2: 98, y1: p.y, y2: p.y,
          stroke: p.color, 'stroke-width': 2}));
        svg.appendChild(h('circle', {cx: 90, cy: p.y, r: 3.5,
          fill: p.color, stroke: 'var(--bg-1)', 'stroke-width': 1.5}));
        svg.appendChild(h('line', {x1: 98, x2: 130, y1: p.y, y2: p.ty,
          stroke: p.color, 'stroke-width': 1, opacity: 0.4}));
        svg.appendChild(h('text', {x: 134, y: p.ty+4,
          'font-family': 'ui-monospace, Menlo', 'font-size': 11, 'font-weight': 600,
          fill: p.color},
          `${p.label}  ${p.price.toFixed(2)}  `,
          h('tspan', {fill: 'var(--text-mute)', 'font-size': 10, 'font-weight': 400},
            `${p.price > cur ? '+' : ''}${(p.price - cur).toFixed(1)}`)));
      });

      return h('div', {class:'ladder'}, svg);
    }

    function renderCalendar(cal) {
      const card = h('div', {class:'card'},
        h('div', {class:'card-h'},
          h('span', {class:'card-t'}, 'Calendar'),
          h('span', {class:'mute mono', style:'font-size:10px;letter-spacing:1px;'}, cal.day_of_week || '')));

      if (cal.unknown) {
        card.appendChild(h('div', {style:'color:var(--amber);font-size:11px;'},
          '⚠ Calendar unavailable — FOMC/red folder UNKNOWN'));
      } else {
        if ((cal.events || []).length) {
          cal.events.forEach(e => {
            card.appendChild(h('div', {class:'event-row'},
              e.time_et ? h('span', {class:'e-time'}, e.time_et) : null,
              h('span', {class: 'e-impact ' + (e.impact || '').toLowerCase()}),
              h('span', {class:'e-name'}, e.event),
              e.currency ? h('span', {class:'e-ccy'}, e.currency) : null));
          });
        } else {
          card.appendChild(h('div', {class:'empty'}, 'No red folder events'));
        }
        card.appendChild(h('div', {class:'flag-row'},
          h('span', {class: 'flag ' + (cal.is_fomc_week ? 'on' : '')},
            'FOMC: ', cal.is_fomc_week ? 'YES' : 'NO'),
          cal.dow_note ? h('span', {class:'flag'}, cal.dow_note) : null));
      }
      card.appendChild(narrative(cal.narrative));
      return card;
    }

    function renderFactors(fs) {
      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, 'Factor Snapshot'),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${(fs.active||[]).length} ON · ${(fs.inactive||[]).length} OFF`)));
      const body = h('div', null);
      card.appendChild(body);
      const sec = (title, list, cls) => {
        if (!list || !list.length) return;
        body.appendChild(h('div', {style:'margin-top:6px;'},
          h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin-bottom:5px;'},
            `${title} · ${list.length}`),
          h('div', null, list.map(f => h('span', {class:'chip ' + cls}, f)))));
      };
      sec('ACTIVE', fs.active, 'on');
      sec('UNKNOWN', fs.unknown, 'unk');
      sec('INACTIVE', fs.inactive, 'off');
      body.appendChild(narrative(fs.narrative));
      return card;
    }

    function renderLevelsTable(lv) {
      const above = lv.above || [], below = lv.below || [];
      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, 'Liquidity Levels'),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${above.length + below.length} · WITHIN ${lv.scope_pts || 100}P`)));
      const body = h('div', null);
      card.appendChild(body);

      if (!above.length && !below.length) {
        body.appendChild(h('div', {class:'empty'}, 'No levels available — needs live price.'));
        body.appendChild(narrative(lv.narrative));
        return card;
      }
      const tbl = h('table', {class:'levels'},
        h('thead', null, h('tr', null,
          h('th', null, ''), h('th', null, 'Level'),
          h('th', null, 'Price'), h('th', null, 'Dist'),
          h('th', null, 'Hit 45m'), h('th', null, 'WR'))));
      const tb = h('tbody');
      const fmtRow = (l, cls) => h('tr', {class: cls},
        h('td', null, cls === 'above' ? '↑' : '↓'),
        h('td', null, l.label),
        h('td', null, fmtPrice(l.price)),
        h('td', null, fmtPts(l.distance_pts)),
        h('td', null,
          h('span', {class:'heat', style:`--w:${Math.min(100, l.hit_rate_45m_pct || 0)}%`}),
          fmtPct(l.hit_rate_45m_pct)),
        h('td', {class: l.below_baseline ? 'weak' : ''}, fmtPct(l.wr_as_magnet_pct)));
      above.forEach(l => tb.appendChild(fmtRow(l, 'above')));
      below.forEach(l => tb.appendChild(fmtRow(l, 'below')));
      tbl.appendChild(tb);
      body.appendChild(tbl);
      body.appendChild(h('div', {class:'mute mono', style:'font-size:10px;margin-top:10px;line-height:1.6;'},
        '1–2 levels in trade direction = sweet spot (55% WR, PF 1.30) ',
        '· 1 obstruction between entry/target = positive (58.5% WR) ',
        '· 3+ stacked = contested, reduce size'));
      body.appendChild(narrative(lv.narrative));
      return card;
    }

    function renderGamePlan(gp) {
      const card = h('details', {class:'card'},
        h('summary', {class:'card-h'},
          h('span', {class:'card-t'}, "Today's Game Plan"),
          h('span', {class:'mute mono', style:'font-size:10px;'},
            `${(gp.checklist||[]).length} CHECKS · ${(gp.best_targets||[]).length} TGTS`)));
      const body = h('div', null);
      card.appendChild(body);

      (gp.one_liners || []).forEach(o =>
        body.appendChild(h('div', {class:'one-liner'}, '"', o, '"')));

      if ((gp.checklist || []).length) {
        body.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin:12px 0 4px;'},
          '9:30 CHECKLIST'));
        body.appendChild(h('ul', {class:'checklist'},
          gp.checklist.map(t => h('li', null, t))));
      }

      if ((gp.best_targets || []).length) {
        body.appendChild(h('div', {class:'mute mono', style:'font-size:9px;letter-spacing:2px;margin:14px 0 4px;'},
          'BEST DRAW TARGETS'));
        gp.best_targets.forEach(t =>
          body.appendChild(h('div', {class: 'target-row ' + (t.direction === 'above' ? 'up' : 'down')},
            h('span', null, t.direction === 'above' ? '↑' : '↓'),
            h('span', {class:'t-label'}, t.label),
            h('span', {class:'t-px'}, fmtPrice(t.price)),
            h('span', {class:'t-dist'}, fmtPts(t.distance_pts), ' pts'))));
      }
      body.appendChild(narrative(gp.narrative));
      return card;
    }

    // ============ LIVE MACRO STATUS ============
    // Walk each .window-section[data-window] and tag it pending/live/past
    // based on the current time in America/New_York. Only applies when the
    // briefing's meta.date matches today in ET — otherwise the cards stay
    // in their static historical state.
    function getETNow() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false,
      }).formatToParts(new Date());
      const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
      let hour = parseInt(p.hour, 10);
      if (hour === 24) hour = 0;
      return {
        date: `${p.year}-${p.month}-${p.day}`,
        minOfDay: hour * 60 + parseInt(p.minute, 10),
      };
    }
    function parseWindowRange(w) {
      const m = w && w.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      return {
        start: parseInt(m[1], 10) * 60 + parseInt(m[2], 10),
        end:   parseInt(m[3], 10) * 60 + parseInt(m[4], 10),
      };
    }
    function tickMacroStatus() {
      const { date, minOfDay } = getETNow();
      const isToday = meta.date === date;
      document.querySelectorAll('.window-section[data-window]').forEach(sec => {
        sec.classList.remove('pending', 'live', 'past');
        if (!isToday) return;
        const range = parseWindowRange(sec.getAttribute('data-window'));
        if (!range) return;
        const state = minOfDay < range.start ? 'pending'
                    : minOfDay < range.end   ? 'live'
                    :                          'past';
        sec.classList.add(state);
      });
    }
    tickMacroStatus();
    setInterval(tickMacroStatus, 30000);
  })();
  </script>
